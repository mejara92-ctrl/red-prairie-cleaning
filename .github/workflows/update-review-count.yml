name: Update Review Count, Review Link, And Urgent Service Messaging

on:
  push:
    paths:
      - '.github/workflows/update-review-count.yml'
      - 'trigger-review-update.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitewide-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update sitewide review and last-minute cleaning messaging
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          review_link = 'https://maps.app.goo.gl/BrREqvo79hKp2TtM8'
          phone = '(580) 215-0915'

          style_block = '''

/* ===== Urgent / last-minute service messaging ===== */
.rp-urgent-note{
  margin:12px 0 0;
  font-size:14px;
  font-weight:800;
  line-height:1.45;
  color:#fff;
}
.rp-urgent-note a{color:#fff;text-decoration:underline;text-underline-offset:3px;}
.rp-urgent-note-dark{
  color:#333;
  max-width:760px;
  margin:14px auto 0;
  text-align:center;
}
.rp-urgent-note-dark a{color:var(--red);}
.rp-fast-card{
  background:#fff5f5;
  border:1px solid #f0caca;
  border-radius:22px;
  padding:24px;
  max-width:980px;
  margin:28px auto 0;
  box-shadow:0 14px 35px rgba(208,0,0,.08);
  text-align:center;
}
.rp-fast-card h3{margin:0 0 8px;font-size:clamp(22px,5vw,34px);line-height:1.12;}
.rp-fast-card p{margin:0 auto 16px;max-width:760px;color:#333;}
.rp-fast-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px;}
.rp-fast-list span{background:#fff;border:1px solid #f0caca;border-radius:999px;padding:8px 12px;font-weight:900;font-size:13px;color:#111;}
.rp-fast-card .book-btn{display:inline-flex;}
@media (min-width:700px){.trust-bar{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))!important;}}
'''

          hero_note = '''\n      <p class="rp-urgent-note">⚡ Need it sooner? We can often accommodate same-day and next-day cleanings. <a href="sms:5802150915">Call or text us</a>.</p>'''

          booking_note = '''\n        <p class="rp-urgent-note-dark"><strong>Moving tomorrow or on a tight deadline?</strong> We frequently help customers with last-minute cleanings. If you do not see the time you need online, call or text us at <a href="sms:5802150915">(580) 215-0915</a>.</p>'''

          fast_card = '''
<section class="rp-fast-card-section">
  <div class="rp-fast-card">
    <h3>Need It Done Fast?</h3>
    <p>Many of our customers contact us at the last minute, and that is okay. Moves, inspections, PCS schedules, and rental turnovers do not always happen on schedule.</p>
    <div class="rp-fast-list">
      <span>✅ Same-day service often available</span>
      <span>✅ Next-day appointments</span>
      <span>✅ Move-out deadlines</span>
      <span>✅ Property manager turnovers</span>
      <span>✅ Military PCS schedules</span>
    </div>
    <a href="sms:5802150915" class="book-btn">Call or Text (580) 215-0915</a>
  </div>
</section>
'''

          faq_block = '''
<section class="rp-fast-card-section">
  <div class="rp-fast-card">
    <h3>Can You Handle Last-Minute Cleanings?</h3>
    <p>Yes. We can often accommodate same-day and next-day appointments for move-outs, deep cleanings, carpet cleaning, and property manager turnovers. If the online calendar does not show the time you need, call or text us and we will do our best to get you scheduled.</p>
    <a href="sms:5802150915" class="book-btn">Ask About Last-Minute Availability</a>
  </div>
</section>
'''

          replacements = {
              '28+ Google Reviews': '35+ Google Reviews',
              '28 Google Reviews': '35+ Google Reviews',
              'Based on 28+ Google Reviews': 'Based on 35+ Google Reviews',
              'Based on 28 Google Reviews': 'Based on 35+ Google Reviews',
              '32+ Google Reviews': '35+ Google Reviews',
              '33+ Google Reviews': '35+ Google Reviews',
              '35 Google Reviews': '35+ Google Reviews',
              'Read More Reviews': 'Read Our Google Reviews',
              'https://g.page/r/Cfx0wV2BCKMxEBM/review': review_link,
              'https://share.google/i4fjcJA9FCItV6Qxa': review_link,
              '"reviewCount": "28"': '"reviewCount": "35"',
              '"reviewCount":"28"': '"reviewCount":"35"',
          }

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              new_text = text

              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)

              new_text = re.sub(
                  r'(<a\b[^>]*?href=")[^"]*("[^>]*>[^<]*Read Our Google Reviews[^<]*</a>)',
                  rf'\1{review_link}\2',
                  new_text,
                  flags=re.IGNORECASE
              )

              if 'Urgent / last-minute service messaging' not in new_text and '</style>' in new_text:
                  new_text = new_text.replace('</style>', style_block + '\n</style>', 1)

              if 'Same-Day Availability Often Available' not in new_text:
                  new_text = re.sub(
                      r'(<div class="hero-trust">\s*)',
                      r'\1\n      <span><i class="fa-solid fa-bolt"></i> Same-Day Availability Often Available</span>',
                      new_text,
                      count=1
                  )

              if 'Need it sooner? We can often accommodate same-day and next-day cleanings' not in new_text:
                  new_text = re.sub(
                      r'(<div class="hero-buttons">.*?</div>)',
                      r'\1' + hero_note,
                      new_text,
                      count=1,
                      flags=re.DOTALL
                  )

              if 'Moving tomorrow or on a tight deadline?' not in new_text:
                  new_text = re.sub(
                      r'(<div class="rp-funnel-header">.*?</p>\s*</div>)',
                      lambda m: m.group(1).replace('</div>', booking_note + '\n      </div>', 1),
                      new_text,
                      count=1,
                      flags=re.DOTALL
                  )

              if 'Same-day service often available' not in new_text:
                  # Insert after the trust bar if the page has one; otherwise insert before the booking funnel.
                  m = re.search(r'(<section class="trust-bar">.*?</section>)', new_text, flags=re.DOTALL)
                  if m:
                      new_text = new_text[:m.end()] + '\n' + fast_card + new_text[m.end():]
                  elif '<section class="rp-funnel"' in new_text:
                      new_text = new_text.replace('<section class="rp-funnel"', fast_card + '\n<section class="rp-funnel"', 1)

              if 'Can You Handle Last-Minute Cleanings?' not in new_text:
                  if '<section class="faq"' in new_text:
                      new_text = new_text.replace('<section class="faq"', faq_block + '\n<section class="faq"', 1)
                  elif '<footer' in new_text:
                      new_text = new_text.replace('<footer', faq_block + '\n<footer', 1)

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else 'None')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add last-minute cleaning messaging sitewide"
          git push
