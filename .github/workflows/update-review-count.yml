name: Update Review Count And Review Link

on:
  push:
    paths:
      - '.github/workflows/update-review-count.yml'
      - 'trigger-review-update.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-review-count-and-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace review count and review button link across site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          review_link = 'https://maps.app.goo.gl/BrREqvo79hKp2TtM8'
          replacements = {
              '28+ Google Reviews': '35+ Google Reviews',
              '28 Google Reviews': '35+ Google Reviews',
              'Based on 28+ Google Reviews': 'Based on 35+ Google Reviews',
              'Based on 28 Google Reviews': 'Based on 35+ Google Reviews',
              '32+ Google Reviews': '35+ Google Reviews',
              '33+ Google Reviews': '35+ Google Reviews',
              '35 Google Reviews': '35+ Google Reviews',
              'Read More Reviews': 'Read Our Google Reviews',
              'https://g.page/r/Cfx0wV2BCKMxEBM/review': review_link,
              'https://share.google/i4fjcJA9FCItV6Qxa': review_link,
          }

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              new_text = text

              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)

              # Safety pass: any anchor whose visible text says Read Our Google Reviews should use the Google Maps listing.
              new_text = re.sub(
                  r'(<a\b[^>]*?href=")[^"]*("[^>]*>[^<]*Read Our Google Reviews[^<]*</a>)',
                  rf'\1{review_link}\2',
                  new_text,
                  flags=re.IGNORECASE
              )

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          print('\n'.join(changed) if changed else 'None')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Google reviews button link"
          git push
