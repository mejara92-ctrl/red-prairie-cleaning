name: Remove pre-calendar webhook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-html:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable pre-calendar webhook calls
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          repo = Path('.')
          changed = []

          disabled_function = "\n".join([
              "function rpSendEstimateToGoHighLevel(extra = {}) {",
              "  /* Calendar-only confirmation gate: do not fire website webhook before calendar booking. */",
              "  rpState.estimateSent = true;",
              "  rpState.preBookingWebhookSent = true;",
              "  return true;",
              "}",
              ""
          ])

          important_comment = "\n".join([
              "/*",
              "  IMPORTANT:",
              "  This page must NOT fire the customer text automation from the estimate/contact step.",
              "  The website only passes estimate/contact details into the embedded GHL calendar URL.",
              "  Booking confirmation texts/emails should be triggered by the GHL calendar appointment",
              "  booked/confirmed event after the customer selects a calendar time.",
              "*/"
          ])

          for path in sorted(repo.rglob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(
                  r'const\s+RP_WEBHOOK_URL\s*=\s*"[^"]+";\s*\n?',
                  'const RP_PREBOOKING_WEBHOOK_DISABLED = true;\n',
                  text
              )

              # Landing pages that go from rpSendEstimateToGoHighLevel() to rpBuildCalendarUrl()
              text = re.sub(
                  r'function\s+rpSendEstimateToGoHighLevel\s*\([^)]*\)\s*\{[\s\S]*?\}\s*function\s+rpBuildCalendarUrl',
                  disabled_function + 'function rpBuildCalendarUrl',
                  text
              )

              # Homepage / book page versions that go from rpSendEstimateToGoHighLevel() to rpSubmitLeadAndShowCalendar()
              text = re.sub(
                  r'function\s+rpSendEstimateToGoHighLevel\s*\([^)]*\)\s*\{[\s\S]*?\}\s*function\s+rpSubmitLeadAndShowCalendar',
                  disabled_function + 'function rpSubmitLeadAndShowCalendar',
                  text
              )

              text = re.sub(
                  r'/\*\s*IMPORTANT:\s*This site sends the estimator webhook[\s\S]*?If confirmation texts are still sending early, update the GHL workflow trigger\.\s*\*/',
                  important_comment,
                  text
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for item in changed:
              print(item)
          if not changed:
              print('No matching files needed changes.')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Disable pre-calendar webhook triggers"
          git push
