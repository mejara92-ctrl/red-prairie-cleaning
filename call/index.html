<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Call Console — Internal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ==========================================================================
   RPC CALL CONSOLE 2.0
   --------------------------------------------------------------------------
   Design rule for this file, and the reason for the rewrite: a phone console
   has exactly two jobs — show the words to SAY, and capture the answer in one
   tap. Everything else is reference. Reference is one keystroke away, never
   permanently on screen.

   Console 1.0 broke that rule. Measured on a live move-out call, the quote
   screen carried 541 words and put the Next button 1,268px down the page, so
   Liz scrolled while she talked. The add-ons screen told her to "ask by name"
   four separate times, in four different boxes. The right rail printed the
   same eight scope bullets on all twelve steps.

   So: three fixed zones that never scroll away — the line to say, the thing
   to tap, and the dock. Coaching collapses. Reference moves into one search.
   ========================================================================== */
:root{
  --bg:#eef0f4;
  --panel:#ffffff;
  --panel-2:#f6f7fa;
  --sunk:#e6e9ef;
  --ink:#14171c;
  --ink-2:#3d4551;
  --muted:#6b7482;
  --line:#d8dde5;
  --line-2:#c2c9d4;
  --red:#a4202a;
  --red-ink:#a4202a;
  --red-wash:#fbeef0;
  --green:#186b4d;
  --green-wash:#e8f3ee;
  --amber:#8a5a12;
  --amber-wash:#fbf2e3;
  --blue:#28517f;
  --blue-wash:#e9eff7;
  --focus:#28517f;
  --shadow:0 1px 2px rgba(16,20,26,.06), 0 10px 28px -16px rgba(16,20,26,.28);
  --dock-h:68px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1216; --panel:#181c22; --panel-2:#1e232a; --sunk:#131720;
    --ink:#eaedf2; --ink-2:#c3cad4; --muted:#8b95a3;
    --line:#2a3039; --line-2:#3a424e;
    --red:#c8323d; --red-ink:#f2969c; --red-wash:#2a1719;
    --green:#5cbd95; --green-wash:#132420;
    --amber:#dfae63; --amber-wash:#241d12;
    --blue:#8fb5e2; --blue-wash:#151d29;
    --focus:#8fb5e2;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}

/* ── Zone 1: top bar. Caller, elapsed, money, escape hatches. ───────── */
.top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:8px 12px calc(8px) 12px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--panel); border-bottom:1px solid var(--line);
}
.who{min-width:0; flex:1 1 auto; line-height:1.2}
.who b{display:block; font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who span{display:block; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.top-actions{display:flex; align-items:center; gap:7px; flex:0 0 auto}
.clock{
  font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; color:var(--muted);
  padding:0 2px; letter-spacing:.02em;
}
.money{
  display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  min-height:44px; padding:4px 12px; border-radius:10px;
  background:var(--sunk); border:1px solid var(--line);
}
.money b{font-size:20px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.money small{font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px}
.money.is-custom b{font-size:15px; color:var(--amber)}
.tbtn{
  min-height:44px; min-width:44px; padding:0 12px; border-radius:10px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--line-2); color:var(--ink);
  font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.tbtn:hover{background:var(--sunk)}
.tbtn.danger{background:var(--red); border-color:var(--red); color:#fff}
.tbtn kbd{
  font:600 10px/1 "Public Sans",sans-serif; padding:2px 4px; border-radius:3px;
  background:rgba(125,135,150,.22); color:var(--muted);
}
@media (max-width:560px){ .tbtn .lbl{display:none} .tbtn kbd{display:none} .clock{display:none} }

/* ── Step strip. Skipping around is normal on a real call. ──────────── */
.strip{
  position:sticky; top:0; z-index:30;
  display:flex; gap:5px; overflow-x:auto; padding:7px 12px;
  background:var(--panel-2); border-bottom:1px solid var(--line);
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 12px; border-radius:99px; cursor:pointer; white-space:nowrap;
  background:transparent; border:1px solid var(--line-2); color:var(--muted);
  font-size:11.5px; font-weight:700; letter-spacing:.01em; min-height:34px;
}
.chip.done{color:var(--ink-2); border-color:var(--line-2); background:var(--panel)}
.chip.now{background:var(--red); border-color:var(--red); color:#fff}

/* ── Zone 2: the line. The one thing she reads. ─────────────────────── */
.wrap{max-width:1180px; margin:0 auto; padding:16px 14px calc(var(--dock-h) + 26px)}
@media (min-width:1000px){ .wrap{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start} }
.col-main{min-width:0}

.say{
  background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--red);
  border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); margin-bottom:14px;
}
.say-label{
  display:flex; align-items:center; gap:8px; margin-bottom:8px;
  font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--red-ink);
}
.say-label .spacer{flex:1}
.say p{
  margin:0; font-family:Newsreader,Georgia,serif; font-weight:400;
  font-size:clamp(20px,2.6vw,25px); line-height:1.38; letter-spacing:-.005em; color:var(--ink);
  text-wrap:pretty;
}
.coach-btn{
  cursor:pointer; background:transparent; border:1px solid var(--line-2); color:var(--muted);
  border-radius:99px; padding:6px 12px; font-size:10px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; min-height:34px;
}
.coach-btn[aria-expanded="true"]{background:var(--blue-wash); border-color:var(--blue); color:var(--blue)}
.coach{
  margin-top:12px; padding-top:11px; border-top:1px dashed var(--line-2);
  font-size:14px; line-height:1.55; color:var(--ink-2);
}
.coach[hidden]{display:none}
.coach b{color:var(--ink)}

/* ── Zone 3: capture. One tap, numbered for the keyboard. ───────────── */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:15px 16px 16px; box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}
.card h2{margin:0 0 3px; font-size:19px; font-weight:800; letter-spacing:-.015em}
.card .sub{margin:0 0 12px; font-size:13.5px; color:var(--muted); line-height:1.45}
.grp{margin-bottom:13px}
.grp:last-child{margin-bottom:0}
.grp-h{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-bottom:6px;
  font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
}
.grp-h em{font-style:normal; font-weight:600; letter-spacing:0; text-transform:none; font-size:12px; color:var(--muted)}

.opts{display:grid; grid-template-columns:1fr; gap:7px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
/* Single-character choices (bedrooms, baths, hours, room counts) stay five
   across even on a phone — at 390px that's a 68px button, comfortably over
   the touch minimum, and it keeps the merged "About the home" screen down to
   one thumb-scroll instead of four rows of near-empty buttons. */
.opts.five{grid-template-columns:repeat(5,1fr)}
.opts.five .o{justify-content:center; text-align:center; padding-inline:6px; font-size:16px}
.opts.five .o .key{display:none}
@media (max-width:330px){ .opts.five{grid-template-columns:repeat(4,1fr)} }
.o{
  position:relative; display:flex; align-items:center; gap:9px; text-align:left; cursor:pointer;
  min-height:48px; padding:9px 12px 9px 10px; border-radius:9px;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink);
  font-size:15px; font-weight:600; line-height:1.3; width:100%;
}
.o:hover{border-color:var(--muted)}
.o.on{background:var(--red-wash); border-color:var(--red); color:var(--red-ink); font-weight:700}
.o .key{
  flex:0 0 auto; width:20px; height:20px; border-radius:4px; display:grid; place-items:center;
  background:var(--sunk); border:1px solid var(--line-2); color:var(--muted);
  font-size:10.5px; font-weight:800; font-variant-numeric:tabular-nums;
}
.o.on .key{background:var(--red); border-color:var(--red); color:#fff}
@media (max-width:560px){ .o .key{display:none} .o{padding-left:12px} }
.o .txt{min-width:0}
.o .txt small{display:block; margin-top:2px; font-size:12.5px; font-weight:500; color:var(--muted); line-height:1.4}
.o.on .txt small{color:var(--red-ink); opacity:.85}
.o .amt{margin-left:auto; flex:0 0 auto; font-weight:800; font-variant-numeric:tabular-nums; font-size:14.5px}
.o.center{justify-content:center; text-align:center}

/* Fields */
.f{margin-bottom:11px}
.f:last-child{margin-bottom:0}
.f label{display:block; margin-bottom:4px; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.f input,.f select,.f textarea{
  width:100%; min-height:48px; padding:11px 12px; border-radius:9px;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink); font-size:16px;
}
.f textarea{min-height:76px; resize:vertical; line-height:1.45}
.f-row{display:grid; grid-template-columns:1fr 110px; gap:10px}

/* Guardrails: conditional, so they earn their space. */
.guard{
  display:flex; gap:9px; margin-top:11px; padding:11px 13px; border-radius:9px;
  font-size:13.5px; line-height:1.5; border:1px solid;
}
.guard b{display:block; margin-bottom:2px; font-size:13px; font-weight:800}
.guard .ic{flex:0 0 auto; font-size:14px; line-height:1.4}
.guard.stop{background:var(--red-wash); border-color:var(--red); color:var(--ink)}
.guard.stop b{color:var(--red-ink)}
.guard.warn{background:var(--amber-wash); border-color:var(--amber); color:var(--ink)}
.guard.warn b{color:var(--amber)}
.guard.info{background:var(--blue-wash); border-color:var(--blue); color:var(--ink)}
.guard.info b{color:var(--blue)}
.guard.win{background:var(--green-wash); border-color:var(--green); color:var(--ink)}
.guard.win b{color:var(--green)}

/* ── Zone 4: the dock. Never scrolls away. ──────────────────────────── */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  display:flex; gap:10px; align-items:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--panel); border-top:1px solid var(--line);
  box-shadow:0 -6px 20px -12px rgba(16,20,26,.35);
}
.dock .back{
  min-height:48px; min-width:56px; padding:0 15px; border-radius:10px; cursor:pointer;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink-2); font-weight:700;
}
.dock .go{
  flex:1; min-height:48px; border-radius:10px; cursor:pointer; border:0;
  background:var(--red); color:#fff; font-size:16px; font-weight:800; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.dock .go:disabled{opacity:.55; cursor:default}
.dock .go kbd{font:700 10px/1 "Public Sans",sans-serif; padding:3px 5px; border-radius:3px; background:rgba(255,255,255,.22)}
@media (max-width:560px){ .dock .go kbd{display:none} }

/* ── Side panel (desktop) / stacked (mobile): live recap only. ───────── */
.side{display:flex; flex-direction:column; gap:12px}
@media (max-width:999px){ .side{margin-top:12px} }
.recap{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
.recap-h{
  padding:9px 14px; background:var(--sunk); border-bottom:1px solid var(--line);
  font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.recap-row{display:flex; justify-content:space-between; gap:12px; padding:8px 14px; border-bottom:1px solid var(--line); font-size:13.5px}
.recap-row:last-child{border-bottom:0}
.recap-row span{color:var(--muted)}
.recap-row b{font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.recap-row.neg b{color:var(--green)}

/* ── Lookup: one search over everything she used to hunt for. ───────── */
.sheet{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
  background:var(--bg);
}
.sheet[hidden]{display:none}
.sheet-top{
  display:flex; gap:9px; align-items:center; padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--panel); border-bottom:1px solid var(--line);
}
.sheet-top input{
  flex:1; min-height:48px; padding:11px 14px; border-radius:10px; font-size:17px;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink);
}
.sheet-body{flex:1; overflow-y:auto; padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
.hit{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:9px}
.hit-k{
  display:inline-block; margin-bottom:6px; padding:2px 7px; border-radius:3px;
  font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  background:var(--sunk); color:var(--muted);
}
.hit-k.say{background:var(--red-wash); color:var(--red-ink)}
.hit h3{margin:0 0 5px; font-size:15px; font-weight:800; line-height:1.35}
.hit p{margin:0 0 6px; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.hit p:last-child{margin-bottom:0}
.hit .quote{font-family:Newsreader,Georgia,serif; font-size:16.5px; line-height:1.45; color:var(--ink)}
/* The coaching note is useful once she's found the right card and useless
   while she's still scanning, so it stays clamped until the card is tapped.
   The top hit for a real query opens itself. */
.hit{cursor:pointer}
.hit .why{
  font-size:13px; color:var(--muted); border-top:1px dashed var(--line-2);
  padding-top:6px; margin-top:7px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.hit.open .why{-webkit-line-clamp:unset; overflow:visible}
.hit .more{display:block; margin-top:5px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--blue)}
.hit.open .more{display:none}
.sheet-empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14.5px}
.sheet-hint{padding:0 2px 10px; font-size:12px; color:var(--muted)}
.sheet-hint b{color:var(--ink-2)}

/* End-call sheet reuses .sheet */
.out-btn{
  display:block; width:100%; text-align:left; margin-bottom:8px; cursor:pointer;
  min-height:56px; padding:11px 14px; border-radius:10px;
  background:var(--panel); border:1.5px solid var(--line-2); color:var(--ink); font-size:15px; font-weight:700;
}
.out-btn small{display:block; font-weight:500; font-size:12.5px; color:var(--muted); margin-top:2px}
.out-btn:hover{border-color:var(--muted)}

/* Calendar (logic unchanged from 1.0; restyled to the new tokens) */
.cal-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.cal-nav button{min-height:44px; min-width:44px; border-radius:8px; cursor:pointer; background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink); font-weight:800; font-size:18px}
.cal-nav button:disabled{opacity:.4; cursor:default}
.cal-nav strong{font-weight:800; font-size:15px}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px}
.cal-weekdays span{text-align:center; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--muted)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal-blank{display:block}
.cal-day{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  aspect-ratio:1; min-height:42px; border-radius:8px; border:1.5px solid transparent;
  background:transparent; color:var(--muted); font-size:14px; font-weight:600;
  cursor:default; font-variant-numeric:tabular-nums;
}
.cal-day.avail{background:var(--panel-2); border-color:var(--line-2); color:var(--ink); cursor:pointer}
.cal-day.avail:hover{border-color:var(--muted)}
.cal-day small{font-size:9.5px; font-weight:800; color:var(--green); line-height:1}
.cal-day.sel{background:var(--red); border-color:var(--red); color:#fff}
.cal-day.sel small{color:#fff; opacity:.85}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--amber)}
.cal-day.full{opacity:.42}
.cal-key{display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 4px; font-size:11.5px; color:var(--muted)}
.cal-key span{display:flex; align-items:center; gap:5px}
.cal-key i{width:10px; height:10px; border-radius:3px; display:inline-block}
.cal-key i.avail{background:var(--panel-2); border:1.5px solid var(--line-2)}
.cal-key i.today{background:var(--panel-2); box-shadow:0 0 0 2px var(--amber)}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:7px; margin-top:6px}
@media (max-width:360px){
  /* Seven columns can't drop to six, so at the narrowest phone width the
     cells shrink instead of the page scrolling sideways. */
  .cal-grid,.cal-weekdays{gap:3px}
  .cal-day{min-height:36px; font-size:13px}
  .card{padding-left:11px; padding-right:11px}
  .wrap{padding-left:9px; padding-right:9px}
}
.sub{margin:6px 0; font-size:13.5px; color:var(--muted); line-height:1.45}
.btn{min-height:44px; padding:0 15px; border-radius:9px; cursor:pointer; background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink); font-weight:700}

.note{display:block; font-size:12.5px; color:var(--muted); line-height:1.45; margin-top:3px}
.setup-wrap{max-width:460px; margin:16vh auto 0; padding:0 18px}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }
</style>
</head>
<body>

<header class="top">
  <div class="who"><b id="whoName">Call Console</b><span id="whoSub">Internal tool</span></div>
  <div class="top-actions">
    <span class="clock" id="clock" title="Time on this call">0:00</span>
    <div class="money" id="money"><b>—</b><small>Total</small></div>
    <button class="tbtn" type="button" id="lookupBtn" onclick="openLookup()" aria-label="Look something up">
      <span aria-hidden="true">🔍</span><span class="lbl">Look up</span><kbd>/</kbd>
    </button>
    <button class="tbtn danger" type="button" onclick="openSheet('endSheet')">End</button>
  </div>
</header>

<nav class="strip" id="strip" aria-label="Call steps"></nav>

<div class="wrap">
  <div class="col-main" id="main" aria-live="polite"></div>
  <aside class="side" id="side"></aside>
</div>

<div class="dock" id="dock" hidden>
  <button class="back" type="button" id="backBtn" onclick="back()">Back</button>
  <button class="go" type="button" id="goBtn" onclick="next()"><span id="goLabel">Next</span><kbd>↵</kbd></button>
</div>

<!-- Lookup: replaces the always-on scope rail AND the 16-item objection drawer -->
<section class="sheet" id="lookupSheet" hidden aria-label="Look something up">
  <div class="sheet-top">
    <input id="lookupInput" type="search" placeholder="oven, deposit, pay, carpet, not home…" autocomplete="off" oninput="renderLookup()">
    <button class="tbtn" type="button" onclick="closeSheet('lookupSheet')">Close</button>
  </div>
  <div class="sheet-body"><div id="lookupResults"></div></div>
</section>

<section class="sheet" id="endSheet" hidden aria-label="End the call">
  <div class="sheet-top">
    <div class="who" style="flex:1"><b>How did the call end?</b><span>Logs the lead so it can be worked again</span></div>
    <button class="tbtn" type="button" onclick="closeSheet('endSheet')">Close</button>
  </div>
  <div class="sheet-body">
    <div class="f"><label for="outNotes">Anything worth noting</label>
      <textarea id="outNotes" placeholder="What they said, what to try next time…"></textarea></div>
    <div id="outList"></div>

function quoteUrgencyLine(){
  if(rpState.slotsLoading || !Object.keys(rpState.availableSlots||{}).length) return "";
  const days=availableDateKeys();
  const total=days.reduce((n,d)=>n+slotsForDate(d).length,0);

  const noun=angle().urgencyNoun || "openings";
  return `\u201cHonestly, we're down to just ${total} ${noun} across the next couple weeks \u2014 if you want one of those, I'd grab it now while I've got you.\u201d`;
}

/* =========================================================================
   GUARDRAILS — the dummy-proofing layer. "stop" blocks the Next button.
   ========================================================================= */
function guardrails(){
  const g=[], s=rpState.step;
  if(rpIsCustomQuoteOnly() && ["quote","contact","calendar"].includes(s))
    g.push({level:"stop",title:"Do not quote a price",
      body:"This job is custom-quote only. Book the visit, tell them the office confirms pricing before the cleaning date, and do NOT say a dollar amount out loud \u2014 even a rough one. A number said on the phone is the number they expect."});
  if(["home","tiers","addons","quote"].includes(s) && rpMoveoutBlocked())
    g.push({level:"stop",title:"Do not give a price on this call",
      body:`${rpMoveoutBlockReasons().join(", ")}. Tell the customer we need to sort this out before we can book \u2014 take their name and number, log the call as a custom quote / callback needed, and have the office follow up. Do not continue toward a quote.`});
  if(rpState.militaryDiscount && !rpState.militaryVerified)
    g.push({level:"warn",title:"Military discount not confirmed",
      body:"Ask: \u201cAre you active duty, retired, or a first responder?\u201d then tick the confirm box. Don't apply it just because they're calling from Lawton."});
  if(s==="contact" && rpState.address1 && !rpState.addressReadBack)
    g.push({level:"warn",title:"Read the address back",
      body:"Say the full address out loud and have them confirm before continuing. Wrong address is the #1 cause of a wasted crew trip."});
  /* Console 2.0: the "Say it, then stop" and "Ask all three by name" info
     guardrails that used to live here are gone. Both are unconditional
     advice about the current step, and both are now the first sentence of
     that step's Coach line -- printing them a second time in a coloured box
     was exactly the duplication this rewrite exists to remove. Guardrails
     are for things that are only true SOMETIMES: this job can't be quoted,
     the address wasn't read back, the tier maths just flipped.  */
  /* Round 25 (direct instruction: "I need to make money and the
     expectations need to be clear" -- and the pricing itself was built so
     buying every excluded-scope add-on on Express always costs MORE than
     switching tiers outright, by design; see rpDetailPassPrice()'s
     comment in the engine). Nothing used to say this out loud, so a
     caller could stack fridge + oven + cabinets + Detail Pass on Express
     and end up paying more than Inspection Ready for LESS scope and no
     guarantee -- worse for them, and it undersells the tier that's
     actually the better fit. Computed live off the same base-price
     function /book and /pricing use, so it can't drift out of sync with
     the real numbers. */
  if(["addons","quote"].includes(s) && rpState.service==="moveoutrefresh" && !rpIsCustomQuoteOnly()){
    const irPrice=rpMoveoutTierBasePrice("moveout"), rfPrice=rpMoveoutTierBasePrice("moveoutrefresh"), addonsTotal=rpAddonsTotal();
    if(irPrice!==null && rfPrice!==null && irPrice>rfPrice && addonsTotal>=(irPrice-rfPrice))
      g.push({level:"info",title:"Inspection Ready is now the better deal",
        body:`With these add-ons, Express comes to $${(rfPrice+addonsTotal).toFixed(0)} — Inspection Ready is $${irPrice.toFixed(0)} for the same home, fully guaranteed, nothing left out. Worth saying: “At this point Inspection Ready actually comes out even or cheaper, and it's backed by Defend Your Deposit — want me to switch it?”`});
  }
  return g;
}
function hasBlockingGuard(){ return guardrails().some(x=>x.level==="stop"); }

/* ---------- Validation ---------- */
function normalizePhone(v){ return String(v||"").replace(/\D/g,"").slice(0,10); }
function phoneOk(v){ return normalizePhone(v).length===10; }
function emailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim()); }


/* ---------- Validation (merged steps) ---------- */
function stepValid(){
  switch(rpState.step){
    case "caller":    return rpState.fullName.trim().length>1 && phoneOk(rpState.phone);
    case "service":   return !!rpState.service;
    case "home":      return !!rpState.bedrooms && !!rpState.bathrooms
                        && (["moveout","moveoutrefresh"].includes(rpState.service) ? rpMoveoutQuestionnaireAnswered() : true);
    case "tiers":     return !!rpState.moveoutTierChosen;
    case "frequency": return !!rpState.frequency;
    case "rooms":     return Number(rpState.carpetRooms)>0;
    case "hourly":    return !!rpState.cleanerCount && !!rpState.hourCount;
    case "addons":    return true;
    case "quote":     return rpState.quotedAloud;
    case "contact":   return rpState.address1.trim().length>2 && rpState.city.trim().length>1
                        && /^\d{5}$/.test(rpState.postalCode.trim())
                        && (rpState.email==="" || emailOk(rpState.email))
                        && rpState.addressReadBack;
    case "calendar":  return !!rpState.selectedStartTime;
    default:          return true;
  }
}

function fmtPhone(v){
  const d=normalizePhone(v);

/* Every tappable option also registers a number key. Liz on a laptop never
   has to reach for the mouse; Liz on a phone never sees the numbers. */
let KEYMAP = [];
function opt(label, onclick, selected, sub, amount){
  const n = KEYMAP.length + 1;
  if(n<=9) KEYMAP.push(onclick);
  return `<button type="button" class="o ${selected?"on":""}" onclick="${onclick}" aria-pressed="${selected?"true":"false"}">
    ${n<=9?`<span class="key" aria-hidden="true">${n}</span>`:""}
    <span class="txt">${label}${sub?`<small>${sub}</small>`:""}</span>
    ${amount?`<span class="amt">${amount}</span>`:""}
  </button>`;
}
function chk(field,label,sub){
  return opt(label, `toggle('${field}')`, !!rpState[field], sub);
}

/* =========================================================================
   LOOKUP — the feature that let the rail and the objection drawer go away
   =========================================================================
   1.0 answered "does that include the oven?" by printing eight scope
   bullets permanently in the rail, and answered "will I get my deposit
   back?" by making Liz open a drawer and eyeball sixteen entries. One is
   always on screen and rarely needed; the other is needed instantly and
   buried. Both are the same problem: reference material with no index.

   This builds the index fresh on every keystroke, so every price in it is
   the engine's live number — it cannot go stale the way a written cheat
   sheet does.
   ========================================================================= */
function lookupIndex(){
  const out=[];
  const money = n => `$${Number(n).toFixed(0)}`;

  OBJECTIONS.forEach(o=>out.push({
    kind:"Say this", say:true,

    }));
    if(svc.fineprint) out.push({kind:"Not included", title:"What's NOT in the base price", answer:svc.fineprint});
  }

  const ir=RP_MOVEOUT_BEDROOM_TIERS, ex=RP_MOVEOUT_REFRESH_BEDROOM_TIERS;
  out.push({kind:"Price", title:"Inspection Ready move-out",
    answer: ir.map(t=>`${t.label} ${money(t.base)}`).join(" · ") + " — bathrooms included, no square-footage charge."});
  out.push({kind:"Price", title:"Move-Out Express",
    answer: ex.map(t=>`${t.label} ${money(t.base)}`).join(" · ") + " — no deposit guarantee; oven, fridge, cabinets and Detail Pass addable."});
  out.push({kind:"Price", title:"Deep cleaning", answer:`Flat ${money(RP_DEEP_ANCHOR_PRICE)} for ${RP_DEEP_ANCHOR_HOURS} hours. Extra time ${money(RP_EXTRA_HOUR_RATE)}/hour.`});
  out.push({kind:"Price", title:"Basic cleaning", answer:`Flat ${money(RP_BASIC_ANCHOR_PRICE)} for ${RP_BASIC_ANCHOR_HOURS} hours. Recurring saves 20% weekly, 15% biweekly, 10% monthly.`});
  out.push({kind:"Price", title:"Carpet cleaning", answer:`${money(rpAddonCatalog.carpet.bundlePrice)} per room, two-room minimum. Pet enzyme ${money(RP_PET_ENZYME_RATE)}/room.`});
  out.push({kind:"Price", title:"Hourly cleaning", answer:`${money(HOURLY_RATE_PER_CLEANER)} per cleaner per hour, ${HOURLY_MIN_HOURS}-hour minimum. Booking our time, not a finished checklist — the deposit guarantee doesn't apply.`});
  out.push({kind:"Price", title:"Oven interior · fridge interior · inside cabinets",
    answer:`${money(rpAddonCatalog.oven.price)} each on Express. All three already included on Inspection Ready.`});
  out.push({kind:"Price", title:"Detail Pass",
    answer:`${money(RP_DETAIL_PASS_PRICES[0].price)}–${money(RP_DETAIL_PASS_PRICES[RP_DETAIL_PASS_PRICES.length-1].price)} by bedroom count${rpState.bedrooms?` — ${money(rpDetailPassPrice())} for this home`:""}. Baseboards, interior windows, walls, ceiling fans, vents and light fixtures. Included on Inspection Ready.`});
  out.push({kind:"Price", title:"Exterior windows · garage floor · laundry",
    answer:`Windows ${money(rpAddonCatalog.windows.basic)} basic or ${money(rpAddonCatalog.windows.premium)} premium (screens included). Garage floor ${money(rpAddonCatalog.garage.price)}, must be empty. Laundry ${money(rpAddonCatalog.laundry.pricePerLoad)} a load.`});
  out.push({kind:"Price", title:"Junk hauling", answer:"Quoted separately — volume varies too much for a flat number. Never goes in the booked total without their say-so."});
  out.push({kind:"Price", title:"Minimum charge", answer:`${money(RP_ONE_TIME_MIN)} per visit one-time, ${money(RP_RECURRING_MIN_PER_VISIT)} per visit on a recurring plan.`});
  out.push({kind:"Price", title:"Military and first responder discount", answer:`${Math.round(MILITARY_DISCOUNT_RATE*100)}% off, capped at ${money(MILITARY_DISCOUNT_CAP)}. Not combinable with other offers. Offer it before the price, don't wait to be asked.`});

  out.push({kind:"Policy", title:"Deposit or payment up front?", answer:"“No deposit, nothing due today — we take payment after the clean is done and you've seen it.”", why:"Easiest true close on the list. Lead with it any time they hesitate about committing."});
  out.push({kind:"Policy", title:"Do they need to be home?", answer:"“Nope — most move-outs are empty. Just get us a key, a lockbox code, or the property manager's contact.”", why:"Capture the access method in the notes right then."});
  out.push({kind:"Policy", title:"Does the home need to be empty?", answer:"“It cleans best empty, and move-outs usually are. We can work around belongings, but heavy clutter or trash changes the scope.”"});
  out.push({kind:"Policy", title:"Licensed and insured?", answer:"“Yes — licensed and insured, veteran-owned, and over sixty five-star reviews here in the Lawton area.”"});
  out.push({kind:"Policy", title:"If something gets missed", answer:"“Call us within 48 hours and we come back and fix it, free.” Defend Your Deposit on Inspection Ready; Satisfaction Guarantee on everything else.", why:"Re-clean, not money back. Don't invent a refund policy."});
  out.push({kind:"Policy", title:"Service area", answer:"Lawton, Fort Sill, Cache, Elgin, Medicine Park and Duncan are core. Further out, book it and note it — the office confirms coverage and travel before the date."});
  out.push({kind:"Policy", title:"Rescheduling", answer:"“Just call or text and we'll move it — no deposit riding on it either way.”", why:"Move dates slip constantly on a PCS. Book the date they think they need."});

  return out;
}

function renderLookup(){
  const q = (el("lookupInput").value||"").trim().toLowerCase();
  const idx = lookupIndex();
  const terms = q.split(/\s+/).filter(Boolean);

  /* Rank, don't just filter. Typing "oven" has to surface "the oven costs
     $50 on Express" before it surfaces a long objection whose coaching note
     happens to contain the word. Title beats answer beats note, and among
     equals the shorter entry wins — a one-line answer is faster to read out
     than a paragraph. */
  const score = item => {
    const t=item.title.toLowerCase(), a=String(item.answer).toLowerCase(), w=String(item.why||"").toLowerCase();
    let n=0;
    for(const term of terms){
      if(!t.includes(term) && !a.includes(term) && !w.includes(term)) return -1;
      if(t.includes(term)) n+=10;
      if(a.includes(term)) n+=4;
      if(w.includes(term)) n+=1;
      if(t.split(/\W+/).includes(term)) n+=6;   // whole-word title hit
    }
    return n - Math.min(4, (t.length+a.length)/400);
  };
  const hits = !terms.length ? idx
    : idx.map(i=>({i, s:score(i)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.i);

  el("lookupResults").innerHTML = hits.length
    ? `<p class="sheet-hint">${terms.length?`${hits.length} match${hits.length===1?"":"es"} \u2014 best first`:`Everything, live from the pricing engine. Type to narrow \u2014 try <b>oven</b>, <b>deposit</b>, <b>pay</b>, <b>home</b>, <b>spouse</b>.`}</p>`
      + hits.map((h,n)=>`<div class="hit ${n===0&&terms.length?"open":""}" onclick="this.classList.toggle('open')">
          <span class="hit-k ${h.say?"say":""}">${h.kind}</span>
          <h3>${h.title}</h3>
          <p class="${h.say?"quote":""}">${h.answer}</p>
          ${h.why?`<p class="why">${h.why}</p><span class="more">Tap for the note</span>`:""}
        </div>`).join("")
    : `<p class="sheet-empty">Nothing matches \u201c${esc(q)}\u201d.<br>Try a single word \u2014 \u201coven\u201d, \u201cdeposit\u201d, \u201cinsured\u201d, \u201clate\u201d.</p>`;
}
function openLookup(){
  el("lookupSheet").hidden=false; document.body.style.overflow="hidden";
  el("lookupInput").value=""; renderLookup();
  setTimeout(()=>el("lookupInput").focus(),30);
}

/* =========================================================================
   KEYBOARD — for the half of her shifts she's at a laptop
   ========================================================================= */
function typingInAField(t){
  return t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT" || t.isContentEditable);
}
document.addEventListener("keydown", e=>{
  const lookupOpen = !el("lookupSheet").hidden;
  const endOpen = !el("endSheet").hidden;
  if(e.key==="Escape"){
    if(lookupOpen) return closeSheet("lookupSheet");
    if(endOpen) return closeSheet("endSheet");
    return;
  }
  if(lookupOpen || endOpen) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/" && !typingInAField(e.target)){ e.preventDefault(); return openLookup(); }
  if(e.key==="?" && !typingInAField(e.target)){ e.preventDefault(); return toggleCoach(); }
  if(typingInAField(e.target)){
    /* Enter still advances from a text field — that's the whole point of a
       form — but not from a textarea, where Enter is a new line. */
    if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); next(); }
    return;
  }
  if(e.key==="Enter"){ e.preventDefault(); if(!el("goBtn").disabled) next(); return; }
  if(e.key==="Backspace"){ e.preventDefault(); back(); return; }
  if(/^[1-9]$/.test(e.key)){
    const fn = KEYMAP[Number(e.key)-1];
    if(fn){ e.preventDefault(); new Function(fn)(); }
  }
});

/* =========================================================================

   =========================================================================
   Client-side only — anyone who views page source can see AUTH_PASSWORD.

   device, then remembered via localStorage.
   ========================================================================= */
const AUTH_KEY="rpCallConsole.authOk";

/* Swap Move-Out tier without resetting size/addon state -- unlike
   pickService(), which is a genuine service change. See the comment on
   moveoutTierToggle above. */
/* Round 20: a tier switch changes rpState.service WITHOUT pickService()'s
   full reset, so any add-on the incoming tier doesn't offer must be
   dropped explicitly — same bug class as the "$525 instead of $225"
   note on pickService() below. Concretely: Express offers Refrigerator
   Interior ($50) because Express excludes it; Inspection Ready includes
   it in the base, so carrying the selection across quoted $50 for work
   already in scope. Liz gets a one-line heads-up so she can say it out
   loud instead of the number quietly changing mid-call. */


function switchMoveoutTier(k){
  rpState.service=k;
  const dropped=rpClearUnavailableAddons(k);
  rpState.addonDropNotice = dropped.length
    ? dropped.map(x => rpAddonCatalog[x] ? rpAddonCatalog[x].label : x).join(", ")
    : "";
  render();
}
/* Round 26: the FIRST tier pick, from the new "tiers" screen -- as
   opposed to switchMoveoutTier() above, which flips an already-chosen
   tier later from the quote screen. No add-ons exist yet at this point
   in the flow (tiers sits before addons), so nothing needs dropping;
   just set the real service, mark it chosen (so the screen shows which
   one is picked instead of both looking unselected), and move on. */
function chooseMoveoutTier(k){
  rpState.service=k;
  rpState.moveoutTierChosen=true;
  next();
}
function pickService(k){ markCallStart(); rpState.service=k;
  rpState.sqft=null; rpState.bedrooms=null; rpState.bathrooms=null;
  rpState.condition=null; rpState.frequency=null; rpState.customNotes="";
  /* BUG FIX: this reset never touched any addon field, or (once added)
     the new move-out intent/questionnaire fields. Reproduced live: pick
     Deep, toggle Additional Cleaner, switch to Carpet without a page
     reload \u2014 the $300 leftover silently added onto Carpet's total
     (confirmed $525 instead of $225 in testing). Every addon-ish field
     and all move-out-specific state resets here now, matching /book's
     rpResetServiceState() coverage. */
  rpState.carpetRooms=0; rpState.addonCarpetRooms=0; rpState.addonCarpetPetEnzyme=false; rpState.windowsTier=null;
  rpState.garageWash=false; rpState.laundryLoads=0;
  rpState.fridgeAddon=false; rpState.ovenAddon=false; rpState.cabinetsAddon=false; rpState.detailPassAddon=false; rpState.junkSize=null; rpState.handymanInterest=false; rpState.cleanerCount=null; rpState.addonDropNotice=""; rpState.moveoutTierChosen=false;
  rpState.hourCount=null; rpState.addonExtraHours=0; rpState.addonSecondCleaner=false;
  rpState.addonPetEnzyme=false; rpState.heavySoil=false; rpState.petOdor=false;
  rpState.noAC=false; rpState.moldConcern=false; rpState.petWasteConcern=false; rpState.hazardConcern=false;
  rpState.moveoutWaterOn=null; rpState.moveoutAcOn=null; rpState.moveoutMoldPests=null;
  rpState.moveoutRentalOrSelling=null; rpState.moveoutPmOrRealtor="";
  render();
  // Fetch availability in the background now, not when she reaches the
  // calendar step — by the time she's at the price, real slot counts are
  // already loaded and ready for an honest urgency line, not a guess.
  if(k!=="custom" && !Object.keys(rpState.availableSlots||{}).length) loadSlots();
}
function next(){
  if(rpState.bookingSubmitting || rpState.customLeadSaving) return;
  const f=flow(), i=stepIdx();
  if(rpState.step==="calendar"){ submitBooking(); return; }
  if(rpState.step==="contact" && isCustomService()){ submitCustomLead(); return; }
  if(i<f.length-1){
    rpState.step=f[i+1];
    window.scrollTo({top:0,behavior:"smooth"});
    render();
    if(rpState.step==="calendar" && !Object.keys(rpState.availableSlots||{}).length) loadSlots();
  }
}
function back(){ const f=flow(), i=stepIdx();
  if(i>0){ rpState.step=f[i-1]; window.scrollTo({top:0,behavior:"smooth"}); render(); } }


/* ---------- Persistence (survives an accidental refresh mid-call) ---------- */
const CSR_IDENTITY_KEY = "rpCallConsole.csrIdentity";
function save(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(rpState)); }catch(e){} }
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){
    const d=JSON.parse(raw); if(!(d&&d.bookedAt)) Object.assign(rpState,d);
  } }catch(e){}
  // CSR identity persists independently of per-call state and survives
  // "Start next call" — set once at the end of a call, applied to every
  // call after that without re-entering it.
  try{ const name=localStorage.getItem(CSR_IDENTITY_KEY); if(name) rpState.csrName=name; }catch(e){}
}
function setCsrIdentity(name){
  rpState.csrName=name;
  try{ localStorage.setItem(CSR_IDENTITY_KEY,name); }catch(e){}
  save();
}
function resetCall(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} clearCallStart(); window.location.reload(); }

/* ---------- Office/crew summary ---------- */

    rpState.noAC?"No A/C":"",
    rpState.moldConcern?"Mold/musty smell reported":"",
    rpState.petWasteConcern?"Pets / pet odor / animal waste":"",
    rpState.hazardConcern?"Excessive trash, hoarding, pests, or smoke":"",
    rpConditionMultiplier()>0?`Condition ${rpState.condition} \u2014 +${Math.round(rpConditionMultiplier()*100)}% applied, confirm on arrival`:"",
    rpIsSpecialtyCondition()?"Specialty/unsafe \u2014 office must confirm custom quote before the cleaning date":""
  ].filter(Boolean);
  /* Move-out only. Same fields /book sends on a completed booking (fixed
     last round after they were found missing there too) \u2014 this is a
     SEPARATE code path from book's rpGetEstimatePayload(), so fixing one
     never fixed the other. Without this, a phone-booked move-out would
     lose the rental/PM lead and the pre-clean confirmation entirely,
     same failure mode as the /book bug. */
  const moveoutExtras = ["moveout","moveoutrefresh"].includes(rpState.service) ? [
    `Tier: ${rpState.service==="moveout"?"Inspection Ready (Defend Your Deposit)":"Move-Out Express (Satisfaction Guaranteed, no deposit guarantee)"}`,
    `Rental or selling: ${rpState.moveoutRentalOrSelling==="renting"?"Renting":rpState.moveoutRentalOrSelling==="selling"?"Selling":"N/A"}`,

  ].filter(Boolean) : [];
  /* Round 21: one shared list (rpAddonSummaryText) with prices, replacing
     a partial hand-maintained copy that only ever mentioned three of the
     nine add-ons — so a phone-booked carpet or junk haul reached the crew
     sheet as a dollar figure with no description of what was sold. */
  return [
    `BOOKED BY PHONE${rpState.csrName?" (CSR: "+rpState.csrName+")":""}`,
    `Service: ${(rpServices[rpState.service]||{}).name||"N/A"}`,

    `Bedrooms: ${rpState.bedrooms||"N/A"} | Bathrooms: ${rpState.bathrooms||"N/A"}`,
    `Condition: ${rpState.condition||"N/A"}`,
    ...moveoutExtras,
    `Add-ons: ${rpAddonSummaryText()}${rpAddonsTotal()>0?` | Add-ons total: $${rpAddonsTotal().toFixed(2)}`:""}`,
    rpHasQuotedAddon()?`\u26a0 Junk haul selected — office must quote it separately; it is NOT in the total above.`:"",
    rpState.handymanInterest?"Additional service request: Make-ready repairs \u2014 quoted separately, not included.":"",
    `Military discount: ${rpState.militaryDiscount?(rpState.militaryVerified?"Yes (confirmed)":"Yes (NOT confirmed \u2014 verify)"):"No"}`,
    `Quote: ${rpIsCustomQuoteOnly()?"CUSTOM \u2014 not quoted on the call":"$"+rpFinalPrice().toFixed(2)}`,
    (()=>{const a=rpServiceAreaStatus();return a.status==="core"?`Service area: ${a.area}`:a.status==="unknown"?"":`\u26a0 SERVICE AREA: ${a.label}${a.area?` (${a.area})`:""}`;})(),
    `Lead source: ${rpState.csrLeadSource||"N/A"}`,
    rpState.csrCallNotes?`Call notes: ${rpState.csrCallNotes}`:"",
    rpState.specialInstructions?`Access/instructions: ${rpState.specialInstructions}`:"",

  ].filter(Boolean).join("\n");
}

/* ---------- Calendar: real month grid, current + next month ---------- */


/* ---------- Calendar ----------
      show the same bookable window. */
function slotsForDate(dateKey){
  const raw=rpState.availableSlots?.[dateKey]?.slots || [];
  return raw.filter(slot=>{
    const m=String(slot).match(/T(\d{2}):/);
    const hour=m?Number(m[1]):NaN;
    return Number.isFinite(hour) && hour>=9 && hour<=17;
  });
}
function availableDateKeys(){
  return Object.keys(rpState.availableSlots||{}).filter(k=>slotsForDate(k).length>0).sort();
}
function bookingBounds(){
  const start=centralDateKey();
  return {start, end:addDaysKey(start,60)};
}
function monthKeyFromDateKey(k){ return `${String(k).slice(0,7)}-01`; }
function clampCalendarMonth(monthKey){
  const bounds=bookingBounds();
  const minMonth=monthKeyFromDateKey(bounds.start);
  const maxMonth=monthKeyFromDateKey(bounds.end);
  if(!monthKey||monthKey<minMonth) return minMonth;
  if(monthKey>maxMonth) return maxMonth;
  return monthKey;
}
function canMoveCalendarMonth(delta){
  const current=clampCalendarMonth(rpState.calendarMonth||monthKeyFromDateKey(centralDateKey()));
  const target=clampCalendarMonth(addDaysKey(monthBounds(current).first, delta>0?32:-1));
  return target!==current;
}
function changeCalendarMonth(delta){
  const current=clampCalendarMonth(rpState.calendarMonth||monthKeyFromDateKey(centralDateKey()));
  const target=addDaysKey(monthBounds(current).first, delta>0?32:-1);
  rpState.calendarMonth=clampCalendarMonth(monthKeyFromDateKey(target));
  render();
}
function formatMonthTitle(monthKey){
  return new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric"}).format(dateFromKey(monthKey));
}
function calendarGridHtml(monthKey){
  const bounds=bookingBounds();
  const first=dateFromKey(monthKey);
  const year=first.getFullYear(), month=first.getMonth();
  const firstDow=new Date(year,month,1,12).getDay();
  const daysInMonth=new Date(year,month+1,0,12).getDate();
  const today=bounds.start;
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(`<span class="cal-blank" aria-hidden="true"></span>`);
  for(let day=1;day<=daysInMonth;day++){
    const dateKey=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const inWindow=dateKey>=bounds.start && dateKey<=bounds.end;
    const count=inWindow?slotsForDate(dateKey).length:0;
    const avail=inWindow && count>0;
    const isToday=dateKey===today;
    const isSel=rpState.selectedDay===dateKey;
    const cls=["cal-day",avail?"avail":"full",isToday?"today":"",isSel?"sel":""].filter(Boolean).join(" ");
    cells.push(`<button type="button" class="${cls}" ${avail?`onclick="pick('selectedDay','${dateKey}')"`:"disabled"}>
      <span>${day}</span>${avail?`<small>${count}</small>`:""}
    </button>`);
  }
  return cells.join("");
}
function calendarHtml(){
  if(rpState.slotsLoading) return `<p class="sub">Loading availability\u2026</p>`;
  if(rpState.slotsError) return `<div class="guard warn"><b>Availability unavailable</b>${esc(rpState.slotsError)}
    <div style="margin-top:8px"><button class="btn" onclick="loadSlots()">Try again</button></div></div>`;
  if(!Object.keys(rpState.availableSlots||{}).length) return `<p class="sub">No open slots returned.</p><button class="btn" onclick="loadSlots()">Reload</button>`;

  const monthKey=clampCalendarMonth(rpState.calendarMonth||monthKeyFromDateKey(centralDateKey()));
  rpState.calendarMonth=monthKey;
  const daysWithSlots=availableDateKeys();
  const sel=(rpState.selectedDay && slotsForDate(rpState.selectedDay).length>0) ? rpState.selectedDay : "";
  const slots=sel?slotsForDate(sel):[];

  return `<div class="cal-nav">
      <button type="button" onclick="changeCalendarMonth(-1)" ${canMoveCalendarMonth(-1)?"":"disabled"} aria-label="Previous month">\u2039</button>
      <strong>${formatMonthTitle(monthKey)}</strong>
      <button type="button" onclick="changeCalendarMonth(1)" ${canMoveCalendarMonth(1)?"":"disabled"} aria-label="Next month">\u203a</button>
    </div>
    <div class="cal-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="cal-grid">${calendarGridHtml(monthKey)}</div>
    <div class="cal-key"><span><i class="avail"></i>Open (number = slots)</span><span><i class="today"></i>Today</span></div>
    ${!daysWithSlots.some(d=>monthKeyFromDateKey(d)===monthKey) ? `<p class="sub">Nothing open this month \u2014 try the other month.</p>` : ""}
    ${sel ? `<p class="sub" style="margin-top:2px"><b>${fmtDay(sel)}</b> \u2014 tap a time:</p>
      <div class="slots">${slots.length?slots.map(t=>opt(fmtTime(t),`pickSlot('${t}')`,rpState.selectedStartTime===t)).join("")
        :`<p class="sub">Nothing open that day \u2014 offer another.</p>`}</div>` : ""}
    ${rpState.bookingError?`<div class="guard stop" style="margin-top:10px"><b>Booking failed</b>${esc(rpState.bookingError)}</div>`:""}
    ${rpState.bookingSubmitting?`<p class="sub" style="margin-top:10px">Booking\u2026</p>`:""}`;
}
function fmtDay(d){ return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"}); }
/* Explicit America/Chicago, same as /book's rpFormatTime() — without
   this, a device set to a different timezone shows the wrong time. */
function fmtTime(t){
  return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"}).format(new Date(t));
}
function pickSlot(t){ rpState.selectedStartTime=t;
  rpState.bookedAt=`${fmtDay(rpState.selectedDay)} at ${fmtTime(t)}`; render(); }

/* Date helpers — must match /book exactly. The booking worker expects
   date-only keys (YYYY-MM-DD) in America/Chicago, NOT ISO timestamps.
   Sending a full .toISOString() gets rejected as "Invalid date range".
   /book also requests one MONTH at a time (start/end clamped to a single
   month, within a 60-day booking window), so we do the same and merge two
   months — otherwise a call late in the month shows almost no dates. */
function centralDateKey(date=new Date()){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",
    year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date)
    .reduce((a,x)=>{ if(x.type!=="literal") a[x.type]=x.value; return a; },{});
  return `${p.year}-${p.month}-${p.day}`;
}
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateFromKey(k){ return new Date(`${k}T12:00:00`); }
function addDaysKey(key,days){ const d=dateFromKey(key); d.setDate(d.getDate()+days); return isoDate(d); }
/* Inclusive first/last day of the month containing `key`. */
function monthBounds(key){
  const first=dateFromKey(key); first.setDate(1);
  const last=new Date(first); last.setMonth(last.getMonth()+1,0);
  return {first:isoDate(first), last:isoDate(last)};
}

async function fetchSlotRange(start,end){
  const r=await fetch(`${RP_BOOKING_API}/slots?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,
    {headers:{Accept:"application/json"}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error||`Availability request failed (HTTP ${r.status})`);
  const data=j.data||{}; delete data.traceId;
  return data;
}

async function loadSlots(){
  if(rpState.slotsLoading) return;
  rpState.slotsLoading=true; rpState.slotsError=""; render();
  try{
    const today=centralDateKey();
    const windowEnd=addDaysKey(today,60);            // worker's booking window
    const thisMonth=monthBounds(today);
    const nextKey=addDaysKey(thisMonth.last,1);
    const nextMonth=monthBounds(nextKey);

    const ranges=[
      {start:today, end:thisMonth.last<windowEnd?thisMonth.last:windowEnd}
    ];
    if(nextKey<=windowEnd){
      ranges.push({start:nextKey, end:nextMonth.last<windowEnd?nextMonth.last:windowEnd});
    }

    let merged={}, firstError=null;
    for(const rg of ranges){
      try{ merged=Object.assign(merged, await fetchSlotRange(rg.start,rg.end)); }
      catch(e){ if(!firstError) firstError=e; }
    }
    if(!Object.keys(merged).length && firstError) throw firstError;
    rpState.availableSlots=merged;
  }catch(e){
    rpState.slotsError=(e.message||"Availability temporarily unavailable.")
      +" Take their preferred day, tell them you'll confirm by text shortly, and book it in GHL \u2014 don't guess at a time.";
  }
  rpState.slotsLoading=false; render();
}



async function submitBooking(){
  if(rpState.bookingSubmitting) return;
  if(!rpState.selectedStartTime){
    rpState.bookingError="Pick a date and time above first.";
    render();
    return;
  }
  rpState.bookingSubmitting=true; rpState.bookingError=""; render();
  const parts=rpState.fullName.trim().split(/\s+/);
  try{
    const r=await fetch(`${RP_BOOKING_API}/book`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        firstName:parts[0]||"", lastName:parts.slice(1).join(" ")||"",
        email:rpState.email, phone:normalizePhone(rpState.phone),
        address1:rpState.address1, city:rpState.city, state:"OK", postalCode:rpState.postalCode,
        startTime:rpState.selectedStartTime,
        service:(rpServices[rpState.service]||{}).name||"Cleaning",
        serviceKey:rpState.service,
        estimate:rpIsCustomQuoteOnly()?0:rpFinalPrice(),
        bedrooms:rpState.bedrooms, bathrooms:rpState.bathrooms,
        specialInstructions:rpState.specialInstructions,
        notes:jobDetails(),
        /* Round 21: this object used to carry NINE fields while /book sent
           roughly sixty, so a phone booking arrived in GHL with no
           guarantee type, no move-out tier, no add-on prices and no
           questionnaire answers — any workflow branching on those fired
           wrong on every phone-booked job. rpBuildSharedDetails() is the
           same builder /book uses; the CSR-specific fields below are the
           only things that legitimately differ. */
        details:{
          ...rpBuildSharedDetails(),
          source:"RPC Call Console", business:"Red Prairie Cleaning",
          booking_channel:"phone_csr", csr_name:rpState.csrName,
          csr_lead_source:rpState.csrLeadSource||"N/A", csr_call_notes:rpState.csrCallNotes||"",
          condition:rpState.condition||"N/A",
          condition_adjustment_percent:Math.round(rpConditionMultiplier()*100),
          custom_quote_required:rpIsCustomQuoteOnly()?"Yes":"No",
          /* Round 25 (found while auditing /book vs /call): /book has
             sent this field on every booking for a while now; it never
             existed here, so a phone-booked handyman lead never reached
             GHL at all. Same field name as /book's payload so nothing
             downstream needs a second branch to read it. */
          handyman_interest:rpState.handymanInterest?"Yes":"No",
          /* Overrides the shared "Yes"/"No" with the CSR-verified state —
             Liz ticking "I asked and they confirmed" is a different fact
             from the website's self-serve checkbox. */
          military_discount:rpState.militaryDiscount?(rpState.militaryVerified?"Yes (confirmed)":"Yes (unconfirmed)"):"No",
          military_discount_verified:rpState.militaryVerified?"Yes":"No",
          special_instructions:rpState.specialInstructions||"",
          submitted_at:new Date().toISOString(),
          job_details:jobDetails()
        },
        companyWebsite:"", dryRun:false
      })
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.ok===false) throw new Error(j.error||`Booking failed (HTTP ${r.status})`);
    rpState.bookingSubmitting=false; rpState.step="done"; render();
  }catch(e){
    rpState.bookingSubmitting=false;
    rpState.bookingError=(e.message||"Unknown error")+" \u2014 don't hang up. Take the details down and book it in GHL manually.";
    render();
  }
}

/* ---------- Custom Quote fallback: no booking, just a logged lead ---------- */
async function submitCustomLead(){
  if(rpState.customLeadSaving) return;
  rpState.customLeadSaving=true; rpState.customLeadError=""; render();
  try{
    const r=await fetch(`${RP_BOOKING_API}/lead`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        source:"RPC Call Console", booking_channel:"phone_csr", lead_status:"custom_quote_requested",
        call_outcome:"Custom quote requested", csr_name:rpState.csrName,
        csr_lead_source:rpState.csrLeadSource||"N/A", csr_call_notes:rpState.csrCallNotes||"",
        full_name:rpState.fullName, phone:normalizePhone(rpState.phone), email:rpState.email,
        service:"Custom Quote / Something Else",
        quoted_price:"No quote given \u2014 requires in-person visit or photos",
        details:[
          `CUSTOM QUOTE REQUEST`,
          `What they need: ${rpState.customNotes||"(not captured)"}`,
          `Address: ${rpState.address1}, ${rpState.city}, ${rpState.state} ${rpState.postalCode}`,
          rpState.specialInstructions?`Notes: ${rpState.specialInstructions}`:""
        ].filter(Boolean).join("\n"),
        submitted_at:new Date().toISOString()
      })
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    rpState.customLeadSaving=false; rpState.step="done"; render();
  }catch(e){
    rpState.customLeadSaving=false;
    rpState.customLeadError=(e.message||"Unknown error")+" \u2014 don't hang up. Take the details down and pass them to the office manually.";
    render();
  }
}

/* ---------- Outcome logging for calls that don't book ---------- */
async function logOutcome(outcome){
  rpState.csrDisposition=outcome;
  const n=el("outNotes"); if(n) rpState.csrCallNotes=n.value;
  const st=el("outStatus"); st.textContent="Saving\u2026"; st.style.color="";
  try{
    const r=await fetch(`${RP_BOOKING_API}/lead`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        source:"RPC Call Console", booking_channel:"phone_csr", lead_status:"no_booking",
        call_outcome:outcome, csr_name:rpState.csrName,
        csr_lead_source:rpState.csrLeadSource||"N/A", csr_call_notes:rpState.csrCallNotes||"",
        full_name:rpState.fullName, phone:normalizePhone(rpState.phone), email:rpState.email,
        service:rpState.service?(rpServices[rpState.service]||{}).name:"Not selected",
        quoted_price:(rpState.service&&!rpIsCustomQuoteOnly()&&rpFinalPrice()>0)?"$"+rpFinalPrice().toFixed(2):"No quote given",
        /* Round 21: a lost call is the lead most worth re-working, and it
           was going to GHL as a text blob only. The structured fields
           (tier, guarantee, add-ons with prices, questionnaire answers,
           the exact number Liz quoted) are what make a follow-up
           campaign targetable rather than a manual read-through. Only
           spread when a service was actually picked — rpBuildSharedDetails
           reads rpState.service and would report "N/A" across the board
           on a hangup at step one. */
        ...(rpState.service ? rpBuildSharedDetails() : {}),
        details:jobDetails(), submitted_at:new Date().toISOString()
      })
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    st.textContent=`Logged: ${outcome}. Starting a fresh call\u2026`; st.style.color="var(--green)";
    setTimeout(resetCall,1100);
  }catch(e){
    st.innerHTML=`<b>Not saved to CRM (${esc(e.message)}).</b> Copy the name, number and notes into GHL manually before the next call \u2014 don't lose this lead.`;
    st.style.color="var(--red)";
  }
}

load(); render();
if(rpState.step==="calendar" && !Object.keys(rpState.availableSlots||{}).length) loadSlots();


/* ---------- Boot ---------- */
load();
render();
if(rpState.step==="calendar" && !Object.keys(rpState.availableSlots||{}).length) loadSlots();
