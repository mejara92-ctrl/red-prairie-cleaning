    <div class="f"><label for="nm">Caller name</label>
      <input id="nm" value="${esc(rpState.fullName)}" placeholder="First and last" autocomplete="off" oninput="set('fullName',this.value)"></div>
    <div class="f"><label for="ph">Best callback number</label>
      <input id="ph" type="tel" inputmode="numeric" value="${esc(rpState.phone)}" placeholder="(580) 000-0000" autocomplete="off" oninput="set('phone',this.value)"></div>
    <div class="f"><label for="src">How did they hear about us? (optional)</label>
      <select id="src" onchange="set('csrLeadSource',this.value)"><option value="">—</option>
      ${["Google / Search","Referral","Repeat customer","Facebook / Social","Property manager / Realtor","Drove by / Sign","Other"]
        .map(o=>`<option ${rpState.csrLeadSource===o?"selected":""}>${o}</option>`).join("")}</select></div>`;

  /* Merged: bedrooms + bathrooms + the three hard-stop checks. */
  if(s==="home"){
    const isMoveout = ["moveout","moveoutrefresh"].includes(rpState.service);
    const yn=(field,label)=>`<div class="grp">
        <div class="grp-h">${label}</div>
        <div class="opts two">
          ${opt("Yes",`pick('${field}',true)`,rpState[field]===true)}
          ${opt("No",`pick('${field}',false)`,rpState[field]===false)}
        </div></div>`;
    return `
      <div class="grp"><div class="grp-h">Bedrooms</div>
        <div class="opts five">${[1,2,3,4,5].map(n=>opt(`${n}${n===5?"+":""}`,`pick('bedrooms',${n})`,rpState.bedrooms===n,null,null)).join("")}</div></div>
      <div class="grp"><div class="grp-h">Full bathrooms</div>
        <div class="opts five">${[1,2,3,4].map(n=>opt(`${n}${n===4?"+":""}`,`pick('bathrooms',${n})`,rpState.bathrooms===n)).join("")}</div></div>
      ${isMoveout ? `
      <div class="grp"><div class="grp-h">Quick checks <em>— any “no” and you don't quote</em></div></div>
      ${yn("moveoutWaterOn","Is the water on?")}
      ${yn("moveoutAcOn","Is the air conditioning working?")}
      ${yn("moveoutMoldPests","Any signs of mold or pests?")}` : ""}`;
  }

  if(s==="tiers"){
    const irPrice=rpMoveoutTierBasePrice("moveout"), rfPrice=rpMoveoutTierBasePrice("moveoutrefresh");
    const fmt=p=>p===null?"Custom":`$${p.toFixed(0)}`;
    const chosen = rpState.moveoutTierChosen ? rpState.service : null;
    return `
      <div class="grp"><div class="grp-h">Why are they moving? <em>— decides which one you lead with</em></div>
        <div class="opts two">
          ${opt("Renting","pick('moveoutRentalOrSelling','renting')",rpState.moveoutRentalOrSelling==="renting")}
          ${opt("Selling","pick('moveoutRentalOrSelling','selling')",rpState.moveoutRentalOrSelling==="selling")}
        </div></div>
      <div class="opts">
        ${opt("Inspection Ready",`chooseMoveoutTier('moveout')`,chosen==="moveout",
          "Protects the deposit. Oven, fridge, cabinets and the full Detail Pass all in this price.", fmt(irPrice))}
        ${opt("Move-Out Express",`chooseMoveoutTier('moveoutrefresh')`,chosen==="moveoutrefresh",
          "Satisfaction Guaranteed, no deposit guarantee. Oven, fridge, cabinets addable next.", fmt(rfPrice))}
      </div>
      <div class="f" style="margin-top:12px"><label for="pmName">Property manager or realtor (optional)</label>
        <input id="pmName" value="${esc(rpState.moveoutPmOrRealtor)}" placeholder="Name or company" autocomplete="off" oninput="set('moveoutPmOrRealtor',this.value)"></div>`;
  }

  if(s==="frequency") return `<div class="opts two">${["One-Time","Weekly","Bi-Weekly","Monthly"]
    .map(f=>opt(f,`pick('frequency','${f}')`,rpState.frequency===f)).join("")}</div>`;

  if(s==="rooms") return `
    <div class="grp"><div class="grp-h">Carpeted rooms <em>— two-room minimum</em></div>
      <div class="opts three">${[2,3,4,5,6,7].map(n=>opt(`${n} rooms`,`pick('carpetRooms',${n})`,Number(rpState.carpetRooms)===n)).join("")}</div></div>
    <div class="opts">${opt(`Pet enzyme treatment`,`toggle('addonPetEnzyme')`,rpState.addonPetEnzyme,
      `Breaks down odour at the source`, `+$${RP_PET_ENZYME_RATE}/room`)}</div>`;

  if(s==="hourly") return `
    <div class="grp"><div class="grp-h">Cleaners <em>— $${HOURLY_RATE_PER_CLEANER}/hr each</em></div>
      <div class="opts five">${[1,2,3,4].map(n=>opt(`${n}`,`pick('cleanerCount',${n})`,rpState.cleanerCount===n)).join("")}</div></div>
    <div class="grp"><div class="grp-h">Hours <em>— ${HOURLY_MIN_HOURS}-hour minimum</em></div>
      <div class="opts five">${Array.from({length:HOURLY_MAX_HOURS-HOURLY_MIN_HOURS+1},(_,i)=>i+HOURLY_MIN_HOURS)
        .map(n=>opt(`${n}`,`pick('hourCount',${n})`,rpState.hourCount===n)).join("")}</div></div>`;

  if(s==="customDetails") return `
    <div class="f"><label for="cd">What do they need?</label>
      <textarea id="cd" placeholder="Commercial space, specialty request, rough size, anything unusual…" oninput="set('customNotes',this.value)">${esc(rpState.customNotes)}</textarea></div>`;

  if(s==="addons"){
    const list=rpServiceAddons[rpState.service]||[];
    let h="";
    if(list.includes("carpet")) h+=`<div class="grp"><div class="grp-h">Carpet cleaning <em>— +$${rpAddonCatalog.carpet.bundlePrice}/room</em></div>
      <div class="opts five">${[0,1,2,3,4,5].map(n=>opt(n===0?"None":`${n}`,`pick('addonCarpetRooms',${n})`,Number(rpState.addonCarpetRooms)===n)).join("")}</div>
      ${Number(rpState.addonCarpetRooms)>0?`<div class="opts" style="margin-top:7px">${opt("Pet enzyme treatment",`toggle('addonCarpetPetEnzyme')`,rpState.addonCarpetPetEnzyme,null,`+$${Number(rpState.addonCarpetRooms)*RP_PET_ENZYME_RATE}`)}</div>`:""}</div>`;
    if(list.includes("laundry")) h+=`<div class="grp"><div class="grp-h">Laundry <em>— +$${rpAddonCatalog.laundry.pricePerLoad}/load</em></div>
      <div class="opts five">${[0,1,2,3,4].map(n=>opt(n===0?"None":`${n}`,`pick('laundryLoads',${n})`,Number(rpState.laundryLoads)===n)).join("")}</div></div>`;
    if(list.includes("extraHours")){
      const anchorHrs = rpState.service==="deep" ? RP_DEEP_ANCHOR_HOURS : RP_BASIC_ANCHOR_HOURS;
      h+=`<div class="grp"><div class="grp-h">Extra time <em>— includes ${anchorHrs}hrs, +$${RP_EXTRA_HOUR_RATE}/hr beyond</em></div>
        <div class="opts five">${[0,1,2,3,4].map(n=>opt(n===0?"None":`+${n}`,`pick('addonExtraHours',${n})`,Number(rpState.addonExtraHours)===n)).join("")}</div></div>`;
    }
    const rows=[];
    if(list.includes("windows")){
      rows.push(opt("Exterior windows — basic",`pick('windowsTier', rpState.windowsTier==='basic'?null:'basic')`,rpState.windowsTier==="basic",null,`+$${rpAddonCatalog.windows.basic}`));
      rows.push(opt("Exterior windows — premium",`pick('windowsTier', rpState.windowsTier==='premium'?null:'premium')`,rpState.windowsTier==="premium","Screens included",`+$${rpAddonCatalog.windows.premium}`));
    }
    if(list.includes("garage")) rows.push(opt("Garage floor wash",`toggle('garageWash')`,rpState.garageWash,"Garage must be empty",`+$${rpAddonCatalog.garage.price}`));
    if(list.includes("fridge")) rows.push(opt("Refrigerator interior",`toggle('fridgeAddon')`,rpState.fridgeAddon,null,`+$${rpAddonCatalog.fridge.price}`));
    if(list.includes("oven")) rows.push(opt("Oven interior",`toggle('ovenAddon')`,rpState.ovenAddon,null,`+$${rpAddonCatalog.oven.price}`));
    if(list.includes("cabinets")) rows.push(opt("Inside cabinets & closets",`toggle('cabinetsAddon')`,rpState.cabinetsAddon,null,`+$${rpAddonCatalog.cabinets.price}`));
    if(list.includes("detailPass")) rows.push(opt("Detail Pass",`toggle('detailPassAddon')`,rpState.detailPassAddon,"Baseboards, windows, walls, fans, vents, lights",`+$${rpDetailPassPrice()}`));
    if(list.includes("secondCleaner")) rows.push(opt("Additional cleaner",`toggle('addonSecondCleaner')`,rpState.addonSecondCleaner,`For the full ${rpSecondCleanerHours()}hrs booked`,`+$${rpSecondCleanerPrice()}`));
    if(rows.length) h+=`<div class="grp"><div class="opts">${rows.join("")}</div></div>`;

    const quoted=[];
    if(list.includes("junk")) quoted.push(opt("Junk or trash to haul away",`pick('junkSize', rpState.junkSize==='yes'?null:'yes')`,rpState.junkSize==="yes","Quoted separately — not in the total"));
    quoted.push(opt("Small handyman repairs",`toggle('handymanInterest')`,rpState.handymanInterest,"Quoted separately — not in the total"));
    h+=`<div class="grp"><div class="grp-h">Quoted separately</div><div class="opts">${quoted.join("")}</div></div>`;

    h+=`<div class="grp"><div class="grp-h">Ask before you say the price</div><div class="opts">
      ${chk("militaryDiscount",`Military or first responder`,`${RP_MSG.military().pct}% off, max $${RP_MSG.military().cap} — offer it, don't wait to be asked`)}
      ${rpState.militaryDiscount?chk("militaryVerified","I asked and they confirmed it"):""}
    </div></div>`;
    return h;
  }

  if(s==="quote"){
    const custom=rpIsCustomQuoteOnly();
    const switchTo = rpState.service==="moveout" ? "moveoutrefresh" : "moveout";
    const tierSwitch = (["moveout","moveoutrefresh"].includes(rpState.service) && !custom)
      ? `<div class="opts" style="margin-bottom:12px">${opt(
          rpState.service==="moveout" ? "Switch to Move-Out Express" : "Switch to Inspection Ready",
          `switchMoveoutTier('${switchTo}')`, false,
          rpState.service==="moveout" ? "Drops the deposit guarantee" : "Adds Defend Your Deposit",
          fmtTierPrice(switchTo))}</div>` : "";
    const dropNotice = rpState.addonDropNotice
      ? `<div class="guard info"><span class="ic">•</span><div><b>Removed — already in this tier</b>${esc(rpState.addonDropNotice)}</div></div>` : "";
    return `${tierSwitch}${dropNotice}
      ${custom?"":closersHtml()}
      <div class="opts" style="margin-top:12px">${chk("quotedAloud","I gave them this quote and they're ready to book")}</div>`;
  }

  if(s==="contact") return `
    <div class="f"><label for="a1">Service address</label>
      <input id="a1" value="${esc(rpState.address1)}" placeholder="123 Main St" autocomplete="off" oninput="set('address1',this.value)"></div>
    <div class="f-row">
      <div class="f"><label for="ct">City</label>
        <input id="ct" value="${esc(rpState.city)}" placeholder="Lawton" autocomplete="off" oninput="set('city',this.value)"></div>
      <div class="f"><label for="zp">ZIP</label>
        <input id="zp" inputmode="numeric" value="${esc(rpState.postalCode)}" placeholder="73505" autocomplete="off" oninput="set('postalCode',this.value)"></div></div>
    <div class="f"><label for="em">Email (for the confirmation)</label>
      <input id="em" type="email" value="${esc(rpState.email)}" placeholder="name@email.com" autocomplete="off" oninput="set('email',this.value)"></div>
    <div class="f"><label for="si">Access / special instructions</label>
      <textarea id="si" placeholder="Gate code, lockbox, pets, parking…" oninput="set('specialInstructions',this.value)">${esc(rpState.specialInstructions)}</textarea></div>
    <div class="opts">${chk("addressReadBack","I read the address back and they confirmed it")}</div>`;

  if(s==="calendar") return calendarHtml();

  if(s==="done") return `
    <div class="guard win"><span class="ic">✓</span><div><b>${isCustomService()?"Request logged":"Booked"}</b>${
      isCustomService()
        ? "No appointment yet — the office follows up to schedule a walkthrough or request photos, then confirms a quote."
        : `${rpState.bookedAt?`Confirmed for ${esc(rpState.bookedAt)}. `:""}A confirmation text goes out automatically.`}</div></div>
    <div class="f" style="margin-top:14px"><label for="csrDone">Not you? Update your name</label>
      <input id="csrDone" value="${esc(rpState.csrName)}" placeholder="Liz" autocomplete="off" oninput="setCsrIdentity(this.value)">
      <span class="note">Saved on this device for the next call.</span></div>
    <button class="o center on" type="button" style="margin-top:12px;justify-content:center" onclick="resetCall()">Start next call</button>`;
  return "";
}

function fmtTierPrice(svc){
  const p = rpMoveoutTierBasePrice(svc);
  return p===null ? "Custom" : `$${p.toFixed(0)}`;
}

/* The quote screen's closers. 1.0 also reprinted four full objections here,
   which is roughly 200 words she has to read past while a customer waits on
   the other end of a silence she is supposed to be holding. Those live in
   Lookup now — one keypress, searchable, all sixteen of them. */
function closersHtml(){
  const urgency = quoteUrgencyLine();
  return `
    ${urgency?`<div class="guard warn"><span class="ic">◷</span><div><b>Real scarcity — say it</b>${urgency}</div></div>`:""}
    <div class="grp" style="margin-top:12px"><div class="grp-h">Then close</div>
      ${QUOTE_CLOSERS.map(c=>`<p style="margin:0 0 7px;font-family:Newsreader,Georgia,serif;font-size:17px;line-height:1.4">${c}</p>`).join("")}
    </div>
    <p class="note">Pushback? Hit <b>Look up</b> (or press <b>/</b>) and type a word — “expected”, “less”, “spouse”, “deposit”.</p>`;
}

/* =========================================================================
   RENDER
   ========================================================================= */
let coachOpen = false;
try{ coachOpen = localStorage.getItem("rpCallConsole.coachOpen")==="1"; }catch(e){}
function toggleCoach(){
  coachOpen = !coachOpen;
  try{ localStorage.setItem("rpCallConsole.coachOpen", coachOpen?"1":"0"); }catch(e){}
  render();
}

function render(){
  if(!isAuthed()){ renderAuthGate(); return; }
  if(!rpState.csrName){ renderSetup(); return; }
  KEYMAP = [];

  const t = TITLES[rpState.step]||["",""];
  const line = lineFor(rpState.step);
  const guards = guardrails();
  const body = screenHtml();          // must run before the dock so KEYMAP is filled

  el("main").innerHTML = `
    ${line?`<div class="say">
      <div class="say-label"><span>Say</span><span class="spacer"></span>
        <button class="coach-btn" type="button" aria-expanded="${coachOpen}" onclick="toggleCoach()">Coach</button></div>
      <p>${line.say}</p>
      <div class="coach" ${coachOpen?"":"hidden"}>${line.coach}</div>
    </div>`:""}
    <div class="card">
      <h2>${t[0]}</h2>${t[1]?`<p class="sub">${t[1]}</p>`:""}
      ${body}
      ${guards.map(g=>`<div class="guard ${g.level==="stop"?"stop":g.level}"><span class="ic">${g.level==="stop"?"■":g.level==="warn"?"▲":"•"}</span><div><b>${g.title}</b>${g.body}</div></div>`).join("")}
      ${rpState.bookingError?`<div class="guard stop"><span class="ic">■</span><div><b>Booking didn't go through</b>${esc(rpState.bookingError)}</div></div>`:""}
      ${rpState.customLeadError?`<div class="guard stop"><span class="ic">■</span><div><b>Couldn't save</b>${esc(rpState.customLeadError)}</div></div>`:""}
      ${rpState.slotsError&&rpState.step==="calendar"?`<div class="guard warn"><span class="ic">▲</span><div><b>Availability unavailable</b>${esc(rpState.slotsError)}</div></div>`:""}
    </div>`;

  renderStrip(); renderSide(); renderTop(); renderDock();
  save();
}

function renderTop(){
  el("whoName").textContent = rpState.fullName || "Call Console";
  el("whoSub").textContent = rpState.fullName
    ? (phoneOk(rpState.phone) ? fmtPhone(rpState.phone) : "no number yet")
    : "Internal tool";
  const custom = rpIsCustomQuoteOnly() || isCustomService();
  const m = el("money");
  m.classList.toggle("is-custom", custom);
  m.innerHTML = custom
    ? `<b>Custom</b><small>Don't quote</small>`
    : `<b>${rpFinalPrice()>0?rpFormatMoneyDisplay(rpFinalPriceCents()):"—"}</b><small>Total</small>`;
}

function renderStrip(){
  const f=flow(), i=stepIdx();
  el("strip").innerHTML = f.map((s,n)=>
    `<button type="button" class="chip ${n===i?"now":n<i?"done":""}" onclick="jumpToStep('${s}')">${SHORT[s]||s}</button>`
  ).join("");
  const now = el("strip").querySelector(".now");
  if(now) now.scrollIntoView({inline:"center", block:"nearest"});
}

/* The side panel is a live recap of what she has captured — the thing she
   reads back at the end, and the thing that tells her at a glance what the
   number is built from.

   Round 35 adds the compare rail underneath it (see comparePanels()). The
   round-30 rule that emptied this column still stands and is worth
   restating, because it is what keeps the rail from sliding back into
   wallpaper: nothing goes in here that is merely reference. 1.0's eight
   scope bullets are still in Lookup, where they are searchable and appear
   only when someone actually asks. What lives here instead is the class of
   thing a search box handles badly — a side-by-side, computed from this
   caller's own answers. */
function renderSide(){
  const rows=[];
  if(rpState.service) rows.push(["Service", isCustomService()?"Custom quote":(rpServices[rpState.service]||{}).name]);
  if(rpState.bedrooms) rows.push(["Bedrooms", rpState.bedrooms]);
  if(rpState.bathrooms) rows.push(["Bathrooms", rpState.bathrooms]);
  if(rpState.frequency) rows.push(["Frequency", rpState.frequency]);
  if(rpState.service && !rpIsCustomQuoteOnly() && rpDisplayBasePrice()>0) rows.push(["Base", rpFormatMoneyDisplay(rpToCents(rpDisplayBasePrice()))]);
  rpAddonLineItems().forEach(r=>rows.push([r.label, r.quoted?"quoted":`+$${r.price.toFixed(0)}`]));
  if(rpState.militaryDiscount && rpMilitaryDiscountAmount()>0) rows.push(["Military discount", "−"+rpFormatMoneyDisplay(rpMilitaryDiscountCents()), true]);
  if(rpState.bookedAt) rows.push(["Scheduled", rpState.bookedAt]);

  const area = rpServiceAreaStatus();
  const areaCard = (area.status==="core"||area.status==="unknown") ? "" : `
    <div class="guard ${area.status==="outside"?"stop":"warn"}"><span class="ic">▲</span><div>
      <b>${area.status==="outside"?"Outside the service area":"Edge of the service area"}</b>
      ${area.status==="outside"
        ? "Book it, but tell them the office confirms coverage and any travel before the date. Note it."
        : `${esc(area.area)} — extra drive time. Fine to book; the office sees the flag.`}</div></div>`;

  el("side").innerHTML = `
    ${rows.length?`<div class="recap">
      <div class="recap-h">On this call</div>
      ${rows.map(r=>`<div class="recap-row ${r[2]?"neg":""}"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("")}
    </div>`:""}
    ${areaCard}
    ${comparePanels()}`;
}

/* =========================================================================
   COMPARE RAIL (round 35)
   =========================================================================
   Round 30 emptied this column deliberately: 1.0 printed the same eight
   scope bullets on all twelve steps, the rail became wallpaper, and the
   fix was to move reference into Lookup where it appears only when asked
   for. That reasoning still holds on a phone.

   It does not hold on the desktop this console is actually worked on. A
   300px column sits empty for the whole call, and the question it could be
   answering is the one a search box handles worst: "what's the difference
   between the two?" is not a search result, it is two columns side by
   side, and on a move-out call it is the most common question there is.

   So the rule for anything that goes in here: it must be a COMPARISON, and
   it must be about THIS call. "$499 against $249 for the 3-bedroom you're
   talking to" gets read. The full price ladder is wallpaper again.

   Everything below computes from the engine and rp-messages.js. The rail
   cannot contradict the quote she is about to give, or the website the
   caller very likely has open while they talk.
   ========================================================================= */

/* Open/closed state lives in localStorage, not rpState — it is how Liz
   likes the tool set up, not a fact about this caller, so it survives
   "Start next call" the same way her name does. */
let cmpOpen = { alacarte:true, scope:false, recurring:true, services:true, tiers:true,
                basicdeep:true, objections:true, tiernums:false, cleannums:false };
try{
  const raw = localStorage.getItem("rpCallConsole.cmpOpen");
  if(raw) Object.assign(cmpOpen, JSON.parse(raw));
}catch(e){}
function toggleCmp(key){
  cmpOpen[key] = !cmpOpen[key];
  try{ localStorage.setItem("rpCallConsole.cmpOpen", JSON.stringify(cmpOpen)); }catch(e){}
  renderSide();
}

const cmpMoney = n => (n===null||n===undefined||isNaN(n)) ? "—" : rpFormatMoneyDisplay(rpToCents(n));
/* Four-figure numbers only show up on the recurring card's annual value, and
   "$5760" reads as $576 at a glance. Comma them. */
const cmpBigMoney = n => "$" + Math.round(Number(n)||0).toLocaleString("en-US");

function cmpCard(key, title, body){
  if(!body) return "";
  const open = !!cmpOpen[key];
  return `<section class="cmp">
    <button class="cmp-h" type="button" aria-expanded="${open}" onclick="toggleCmp('${key}')">
      <span>${esc(title)}</span><span class="cmp-chev" aria-hidden="true">${open?"−":"+"}</span>
    </button>
    ${open?`<div class="cmp-b">${body}</div>`:""}
  </section>`;
}
function cmpRow(label, a, b, o){
  o = o||{};
  const cls = ["cmp-row", o.head?"head":"", o.big?"big":""].filter(Boolean).join(" ");
  return `<div class="${cls}"><span>${o.raw?label:esc(label)}</span>`
       + `<b class="${o.pick==="a"?"pick":""}">${o.raw?a:esc(a)}</b>`
       + `<b class="${o.pick==="b"?"pick":""}">${o.raw?b:esc(b)}</b></div>`;
}
function cmpItem(label, value, o){
  o = o||{};
  const cls = ["cmp-item", o.sum?"sum":"", o.on?"on":""].filter(Boolean).join(" ");
  return `<div class="${cls}"><span>${esc(label)}${o.tag?`<span class="tag">${esc(o.tag)}</span>`:""}</span><b>${esc(value)}</b></div>`;
}
function cmpSay(text){
  return `<div class="cmp-say"><span class="k">Say</span>“${esc(text)}”</div>`;
}
function cmpVerdict(html, level){
  return `<div class="cmp-verdict ${level||""}">${html}</div>`;
}

/* ---- 1. Inspection Ready vs Express -------------------------------------
   The reason this rail exists. Both real prices for this home, the gap
   between them, what the cheaper one leaves out, and what each of those
   costs to add back. */
/* A block of collapsible detail inside a card. Used for "the numbers" —
   present, one click away, not the first thing in the column. */
function cmpFold(key, label, body){
  if(!body) return "";
  const open = !!cmpOpen[key];
  return `<div class="cmp-fold">
    <button type="button" class="cmp-fold-h" aria-expanded="${open}" onclick="toggleCmp('${key}')">
      <span>${esc(label)}</span><span class="cmp-chev" aria-hidden="true">${open?"−":"+"}</span>
    </button>
    ${open?`<div class="cmp-fold-b">${body}</div>`:""}
  </div>`;
}

/* The line she says, then the question that decides it. This is the whole
   point of the card — everything below it is backup. */
function cmpScript(say, ask, answers){
  return `<div class="cmp-say"><span class="k">Say</span>${esc(say)}</div>
    <div class="cmp-ask"><span class="k">Then ask</span>“${esc(ask)}”</div>
    ${answers.map(a=>`<div class="cmp-branch"><span>${esc(a[0])}</span><b>${esc(a[1])}</b></div>`).join("")}`;
}

function cmpTiers(){
  if(!["moveout","moveoutrefresh"].includes(rpState.service)) return "";

  const ir = rpMoveoutTierBasePrice("moveout");
  const ex = rpMoveoutTierBasePrice("moveoutrefresh");

  /* Blocked questionnaire or an off-ladder home: the console's own guard
     already says don't quote. Repeating a number here would undo it. */
  if(ir===null || ex===null){
    return cmpCard("tiers","Inspection Ready vs Express",
      cmpVerdict("<b>Don't quote either tier on this call.</b> This home doesn't price on the ladder — take the details and log it as a callback.","stop"));
  }

  const beds = Number(rpState.bedrooms||0);
  const known = beds>0 && ir>0 && ex>0;
  const pick = rpState.service==="moveout" ? "a" : "b";
  const irMath = RP_MSG.crewMath("moveout") || {};
  const exMath = RP_MSG.crewMath("moveoutrefresh") || {};

  /* Round 37: script first. Her job the second someone asks "what's the
     difference" is to SAY something, not to read a table and translate it
     into a sentence while the caller waits. The table is still here, one
     click down, because "how many people come out?" is a real question --
     it just isn't the first thing in the column any more. */
  let h = cmpScript(
    RP_MSG.tiers.spoken,
    RP_MSG.tiers.spokenAsk,
    known
      ? [["Yes, or not sure  →  Inspection Ready", cmpMoney(ir)],
         ["A firm no  →  Express", cmpMoney(ex)]]
      : [["Yes, or not sure  →", "Inspection Ready"],
         ["A firm no  →", "Express"]]
  );

  if(known){
    h += `<div class="cmp-gap"><b>${cmpMoney(ir-ex)}</b> apart — that's the whole decision.</div>`;
    /* The deposit anchor for THIS home. The number that reframes a caller
       who is comparing us against a cheaper cleaner. */
    const d = RP_MSG.deposit.for(beds);
    if(d) h += `<div class="cmp-line"><b>On the line: ${esc(d.amount)}</b> — ${esc(d.subject.toLowerCase())} around here.</div>`;
  } else {
    h += `<div class="cmp-line">Ask bedrooms and both prices land here.</div>`;
  }

  /* The numbers, folded. With bedrooms unknown this used to open with the
     entire three-row ladder -- a wall of prices for a home nobody had
     described yet. */
  let nums = "";
  if(known){
    nums += cmpRow(`${beds} bedroom${beds===1?"":"s"}`, "INSPECTION", "EXPRESS", {head:true, pick});
    nums += cmpRow("Price", cmpMoney(ir), cmpMoney(ex), {pick});
  } else {
    nums += cmpRow("Any size", "INSPECTION", "EXPRESS", {head:true});
    RP_MOVEOUT_BEDROOM_TIERS.forEach((t,i)=>{
      const e = RP_MOVEOUT_REFRESH_BEDROOM_TIERS[i];
      nums += cmpRow(t.label, cmpMoney(t.base), cmpMoney(e?e.base:null));
    });
  }
  nums += cmpRow("Cleaners", String(irMath.crew||3), String(exMath.crew||2));
  nums += cmpRow("On site", rpMoveoutTierHours("moveout"), rpMoveoutTierHours("moveoutrefresh"));
  if(irMath.lo && exMath.lo){
    nums += cmpRow("Hours of work", `${irMath.lo}–${irMath.hi}`, `${exMath.lo}–${exMath.hi}`);
  }
  nums += cmpRow("Deposit backed", "Yes", "No", {pick});
  nums += `<div class="cmp-line">Both come back free within ${esc(RP_MSG.guarantee.window)}. Only Inspection Ready is sold as protecting a deposit — ${esc(RP_MSG.guarantee.depositName)}.</div>`;
  h += cmpFold("tiernums", "The numbers", nums);

  return cmpCard("tiers","Saying the difference", h);
}

/* Basic vs Deep — asked for directly, and previously absent. Same shape as
   the tier card: the sentence, the question, then the numbers folded. */
function cmpBasicDeep(){
  if(!["deep","maintenance"].includes(rpState.service)) return "";
  const pick = rpState.service==="deep" ? "b" : "a";
  let h = cmpScript(
    RP_MSG.cleans.spoken,
    RP_MSG.cleans.spokenAsk,
    [[`${RP_MSG.cleans.basicWhen}  →  Basic`, cmpMoney(RP_BASIC_ANCHOR_PRICE)],
     [`${RP_MSG.cleans.deepWhen}  →  Deep`, cmpMoney(RP_DEEP_ANCHOR_PRICE)]]
  );
  let nums = cmpRow("", "BASIC", "DEEP", {head:true, pick});
  nums += cmpRow("Price", cmpMoney(RP_BASIC_ANCHOR_PRICE), cmpMoney(RP_DEEP_ANCHOR_PRICE), {pick});
  nums += cmpRow("Hours included", `${RP_BASIC_ANCHOR_HOURS}h`, `${RP_DEEP_ANCHOR_HOURS}h`);
  nums += cmpRow("Extra time", cmpMoney(RP_EXTRA_HOUR_RATE)+"/h", cmpMoney(RP_EXTRA_HOUR_RATE)+"/h");
  nums += cmpRow("Inside the oven", "No", "Yes");
  nums += `<div class="cmp-line">Both are flat whatever the size, and both carry the ${esc(RP_MSG.guarantee.window)} come-back-free promise. Neither is sold as protecting a deposit — that's the move-out tier.</div>`;
  h += cmpFold("cleannums", "The numbers", nums);
  return cmpCard("basicdeep","Basic vs Deep", h);
}

/* ---- 2. Express + add-ons vs just upgrading ------------------------------
   The pricing engine has an invariant: buying back everything Express
   leaves out must always cost MORE than paying the tier gap outright, so
   a la carte is never the cheaper route to the full checklist. That
   invariant is checked in the engine's comments at every price change,
   and it has been broken and repaired once already (round 26 -> 27).

   Liz has no way to see it. This card is that invariant, rendered live:
   what Express leaves out, what each costs, what she's added so far, and
   whether this caller has now spent past the point where switching is the
   better deal. */
function cmpAlaCarte(){
  if(rpState.service!=="moveoutrefresh") return "";
  const ir = rpMoveoutTierBasePrice("moveout");
  const ex = rpMoveoutTierBasePrice("moveoutrefresh");
  if(ir===null || ex===null || !rpState.bedrooms || ir<=0 || ex<=0) return "";

  const beds = Number(rpState.bedrooms);
  /* Same list the guardrail uses — see rpExpressBuyBackItems() in the
     engine for why this must not be rpAddonsTotal(). */
  const BUYBACK = rpExpressBuyBackItems(beds);
  const gap  = ir - ex;
  const all  = BUYBACK.reduce((a,r)=>a+r.price,0);
  const on   = BUYBACK.filter(r=>r.selected);
  const spent= rpExpressBuyBackTotal(beds);
  const now  = ex + spent;
  const diff = now - ir;   // positive = Express has passed Inspection Ready
  /* Carpet, windows, garage and junk cost the same on either tier, so they
     are excluded from the comparison above and called out separately —
     otherwise the rail would repeat the bug it was written to catch. */
  const carried = rpTierNeutralAddonTotal();

  /* Conclusion first. This card is tall, and on a laptop the bottom of it
     is below the fold — putting the itemised list on top meant the one
     line she actually needs to act on was the one she could not see. The
     running numbers and the verdict lead; the priced list underneath is
     reference for quoting each item. */
  let h = "";
  /* Labelled explicitly rather than "this caller is at", because when the
     quote also carries carpet or a garage wash this figure is deliberately
     LOWER than the running total in the header — those cost the same on
     either tier and would cancel out of the comparison. A vague label here
     reads as the two disagreeing. */
  h += cmpItem(`Express + these ${on.length===1?"one":on.length===4?"four":on.length}`, cmpMoney(now), {sum:true});
  h += cmpItem("Inspection Ready", cmpMoney(ir));

  if(spent===0){
    h += cmpVerdict(`All four cost <b>${cmpMoney(all)}</b>. Paying the gap costs <b>${cmpMoney(gap)}</b>. Adding everything back is <b>${cmpMoney(all-gap)} worse</b> than just switching — and it still isn't guaranteed.`);
  } else if(diff > 0){
    h += cmpVerdict(`<b>${cmpMoney(diff)} past Inspection Ready</b> — and this one isn't deposit-backed. Switch it.`,"stop")
       + cmpSay(`Actually, at that point Inspection Ready is the cheaper one — ${cmpMoney(ir)} instead of ${cmpMoney(now)}, and it's the one we guarantee. Want me to just put you on that?`);
  } else if(diff === 0){
    /* Reachable, and not rare: at 1-2 bedrooms any one flat buy-back plus a
       Detail Pass is $200, which is exactly the tier gap. Without this branch
       it fell into "$X under" and rendered "$0 under Inspection Ready. One
       more add-on and switching is cheaper" — nonsense on its face, and it
       contradicted the guardrail, which fires at >= the gap and was telling
       her to offer the switch on the very same screen. */
    h += cmpVerdict(`<b>Exactly level with Inspection Ready</b> — same price, less scope, no deposit backing. Switch it.`,"stop")
       + cmpSay(`At that point it's the same money either way — ${cmpMoney(ir)} — so let me put you on Inspection Ready instead. You get the whole checklist and it's the one we guarantee.`);
  } else if(diff > -50){
    h += cmpVerdict(`<b>${cmpMoney(Math.abs(diff))} under Inspection Ready.</b> One more add-on and switching is cheaper.`,"warn")
       + cmpSay(`One more of those and you're past what the full one costs — for ${cmpMoney(ir - now)} more than where you are now I can put you on Inspection Ready and it's guaranteed.`);
  } else {
    h += cmpVerdict(`<b>${cmpMoney(Math.abs(diff))} under Inspection Ready.</b> Room for ${on.length<4?"more":"no more"} before switching wins.`);
  }
  if(carried>0) h += `<div class="cmp-sub">The ${cmpMoney(carried)} of carpet, windows, garage or junk on this quote isn't in that comparison — it costs the same on either tier and carries over whichever they book.</div>`;

  h += `<div class="cmp-split">What Express leaves out</div>`;
  BUYBACK.forEach(r=>{
    h += cmpItem(r.label, (r.selected?"":"+")+cmpMoney(r.price), {on:r.selected, tag:r.selected?"added":""});
  });
  h += `<div class="cmp-sub">Detail Pass is baseboards, interior windows, walls, ceiling fans, vents and light fixtures. All four are already in Inspection Ready's base price.</div>`;
  return cmpCard("alacarte","Adding on vs upgrading", h);
}

/* ---- 3. Which service is this? ------------------------------------------
   Callers describe a situation, not a product. The split that actually
   matters is not move-out vs deep clean, it's "is anyone inspecting this
   place after you leave" — one question that routes the whole call. */
function cmpServices(){
  if(rpState.service && rpState.step!=="service") return "";
  if(isCustomService()) return "";
  /* Airbnb and anything else that is custom-quote-only sits under an
     explicit "Do not quote a price" guardrail. Printing the move-out and
     deep ladders in the rail on that same screen directly contradicts it,
     and a number on screen during a do-not-quote call is exactly how a
     number ends up said out loud. */
  if(rpIsCustomQuoteOnly() || !rpServiceIsPublic(rpState.service || "moveout")) return "";
  const irLo = RP_MOVEOUT_BEDROOM_TIERS[0].base;
  const irHi = RP_MOVEOUT_BEDROOM_TIERS[RP_MOVEOUT_BEDROOM_TIERS.length-1].base;

  let h = cmpRow("", "MOVE-OUT", "DEEP", {head:true});
  h += cmpRow("Price", `${cmpMoney(irLo)}–${cmpMoney(irHi)}`, cmpMoney(RP_DEEP_ANCHOR_PRICE));
  h += cmpRow("Home", "Empty", "Lived in");
  h += cmpRow("Time", rpMoveoutTierHours("moveout"), `${RP_DEEP_ANCHOR_HOURS}h`);
  h += cmpRow("Deposit backed", "Yes", "No");
  h += `<div class="cmp-line">Deep is a flat ${cmpMoney(RP_DEEP_ANCHOR_PRICE)} whatever the size; move-out is priced by bedrooms. Basic is ${cmpMoney(RP_BASIC_ANCHOR_PRICE)} for ${RP_BASIC_ANCHOR_HOURS} hours and is for an already-tidy home.</div>`;
  h += cmpSay("Before I price it — is a landlord, property manager or housing office going to walk through and check the place after you're out?");
  h += `<div class="cmp-line">Yes, or they're not sure → a move-out tier. A firm no and they still live there → deep or basic.</div>`;
  return cmpCard("services","Which service is this?", h);
}

/* ---- 4. One-time vs recurring -------------------------------------------
   Move-out is a one-shot business: every customer is acquired once and
   never returns by design. Basic Cleaning is the only service on the
   ladder that can become a repeat account, and the discount ladder is
   already built — she just has never had the per-visit numbers in front
   of her while the caller is deciding. Percentages and visit counts come
   from rpFrequencyPlans, and the per-visit figure uses the engine's own
   rounding so this rail can never quote a cent the estimate won't. */
function cmpRecurring(){
  if(rpState.service!=="maintenance") return "";
  const base = RP_BASIC_ANCHOR_PRICE;
  const order = ["One-Time","Monthly","Biweekly","Weekly"];
  let h = "";
  order.forEach(name=>{
    const plan = rpFrequencyPlans[name];
    if(!plan) return;
    const per = Math.round(base * (1 - plan.discount));
    const chosen = rpState.frequency===name;
    const pct = plan.discount ? ` −${Math.round(plan.discount*100)}%` : "";
    h += cmpItem(name+pct, cmpMoney(per)+" / visit", {on:chosen, tag:chosen?"chosen":""});
  });
  const wk = rpFrequencyPlans["Weekly"];
  const wkPer = Math.round(base * (1 - wk.discount));
  const wkYear = wkPer * wk.visitsPerMonth * 12;
  h += cmpItem("A weekly account is worth", cmpBigMoney(wkYear)+" / year", {sum:true});
  h += `<div class="cmp-sub">Internal — that's ${wk.visitsPerMonth * 12} visits at ${cmpMoney(wkPer)}, against ${cmpMoney(base)} for a one-time. Minimum on any recurring plan is ${cmpMoney(RP_RECURRING_MIN_PER_VISIT)} a visit.</div>`;
  if(!rpState.frequency || rpState.frequency==="One-Time"){
    h += cmpSay(`Most people start every-other-week — it's ${cmpMoney(Math.round(base*(1-rpFrequencyPlans["Biweekly"].discount)))} a visit instead of ${cmpMoney(base)}, and you can change or stop it any time.`);
    h += cmpVerdict("Offer it once, plainly. If they hesitate, book One-Time — they can switch later, a lost booking can't.","warn");
  }
  return cmpCard("recurring","One-time vs recurring", h);
}

/* ---- 5. What's in the price ---------------------------------------------
   "Does that include the oven?" is the most common question on the phone
   and it is a scope question, not a price question. rpIncludes is the same
   list /book renders, so the answer she gives matches the page they're
   reading. */
function cmpScope(){
  const svc = rpState.service && rpIncludes[rpState.service];
  if(!svc) return "";
  const name = (rpServices[rpState.service]||{}).name || "";
  let h = `<div class="cmp-line"><b>${esc(name)}</b></div>`;
  h += `<ul class="cmp-list">` + (svc.items||[]).map(i=>`<li class="yes">${esc(i)}</li>`).join("") + `</ul>`;
  if(svc.fineprint) h += `<ul class="cmp-list"><li class="no">${esc(svc.fineprint)}</li></ul>`;
  return cmpCard("scope","What's in the price", h);
}

/* =========================================================================
   OBJECTIONS IN THE RAIL (round 37)
   =========================================================================
   "Liz needs to be able to handle objections quicker."

   Lookup was the only route: press "/", type, read, close. Right for the
   long tail, too slow for the five she hears every day — it is a
   full-screen context switch mid-sentence.

   These are the same OBJECTIONS entries, filtered to the current step and
   rendered as chips in the rail. One click opens the words in place. The
   search box keeps everything, including these; this is just the fast path
   for the ones that are predictable.

   Matching is by keyword against the objection's own title, not by index,
   so editing or re-ordering OBJECTIONS cannot quietly point a step at the
   wrong answer. A step whose keywords match nothing renders no card at
   all, rather than a card full of chips for objections nobody is making. */
const MOVEOUT = ["moveout","moveoutrefresh"];
/* Each entry: the keyword that finds the objection in OBJECTIONS, the SHORT
   label for the chip, and optionally the services it applies to.

   The short label is written here rather than derived from the question,
   because a chip is scanned, not read -- the first pass at this cut the
   titles mechanically and produced "Can't I just add the oven and fridge to
   Express instead of paying for Inspection Ready?" as a chip, which is a
   paragraph pretending to be a button.

   The service scope matters just as much: without it, a Deep Cleaning call
   was offering her the Express add-on objection, which cannot come up. */
const CMP_OBJECTIONS_BY_STEP = {
  service:  [{k:"how much", s:"How much?"}, {k:"legit", s:"Are you legit?"}],
  caller:   [{k:"legit", s:"Are you legit?"}],
  home:     [{k:"need to be there", s:"Do I need to be there?"}],
  tiers:    [{k:"actually different", s:"What's the difference?", svc:MOVEOUT},
             {k:"deposit back", s:"Will I get my deposit back?", svc:MOVEOUT},
             {k:"add the oven", s:"Just add the oven instead?", svc:["moveoutrefresh"]}],
  addons:   [{k:"add the oven", s:"Just add the oven instead?", svc:["moveoutrefresh"]},
             {k:"three people", s:"Why so many cleaners?", svc:MOVEOUT},
             {k:"how much", s:"How much?"}],
  quote:    [{k:"more than i expected", s:"More than I expected"},
             {k:"quoted me less", s:"Someone quoted less"},
             {k:"do better on price", s:"Can you do better?"},
             {k:"think about it", s:"Need to think about it"},
             {k:"do you need a deposit", s:"How do I pay?"}],
  contact:  [{k:"need to be there", s:"Do I need to be there?"},
             {k:"move date", s:"If my date changes"}],
  calendar: [{k:"today or tomorrow", s:"Can you come today?"},
             {k:"this week", s:"I need it this week"},
             {k:"move date", s:"If my date changes"}],
  frequency:[{k:"think about it", s:"Need to think about it"}],
  rooms:    [{k:"how much", s:"How much?"}],
  hourly:   [{k:"how much", s:"How much?"}, {k:"not happy", s:"What if I'm not happy?"}]
};

let cmpOpenObjection = null;
function toggleObjection(i){
  cmpOpenObjection = (cmpOpenObjection === i) ? null : i;
  renderSide();
}

function cmpObjections(){
  const keys = CMP_OBJECTIONS_BY_STEP[rpState.step];
  if(!keys || !keys.length) return "";

  const all = OBJECTIONS.map((o,i)=>({ o, i, title:String(o.q||"").toLowerCase() }));
  const picked = [];
  keys.forEach(entry=>{
    if(entry.svc && !entry.svc.includes(rpState.service)) return;
    const hit = all.find(x => x.title.includes(entry.k) && !picked.some(p=>p.i===x.i));
    if(hit) picked.push({ ...hit, short: entry.s });
  });
  if(!picked.length) return "";

  const chips = picked.map(x=>
    `<button type="button" class="cmp-obj ${cmpOpenObjection===x.i?"is-open":""}"
       aria-expanded="${cmpOpenObjection===x.i}" onclick="toggleObjection(${x.i})">${esc(x.short)}</button>`
  ).join("");

  let body = `<div class="cmp-obj-row">${chips}</div>`;

  const open = picked.find(x=>x.i===cmpOpenObjection);
  if(open){
    const a = typeof open.o.a==="function" ? open.o.a() : open.o.a;
    const n = typeof open.o.n==="function" ? open.o.n() : open.o.n;
    body += `<div class="cmp-obj-answer">
      <div class="cmp-say"><span class="k">Say</span>${esc(String(a).replace(/^[“"]|[”"]$/g,""))}</div>
      ${n?`<div class="cmp-sub">${esc(n)}</div>`:""}
    </div>`;
  } else {
    body += `<div class="cmp-sub">Tap one for the words. Everything else is in Look up (/).</div>`;
  }
  return cmpCard("objections","If they push back", body);
}

/* Mobile keeps round 30's screen: everything above collapses into one
   closed disclosure so the phone layout is unchanged until she asks. */
function comparePanels(){
  /* Ordered by what she needs THIS second, not by a fixed list. Once a
     caller has started adding things onto Express, "are they about to buy a
     worse deal than the upgrade" outranks the tier explainer she has already
     read to them. The rail is tall enough that first position is the only
     position that reliably gets seen. */
  const buyingBack = rpState.service==="moveoutrefresh"
    && (rpState.ovenAddon || rpState.fridgeAddon || rpState.cabinetsAddon || rpState.detailPassAddon);
  /* Round 37: objections lead on the steps where somebody pushes back --
     the quote screen above all -- because at that moment the difference
     between the two tiers is settled and what she needs is a reply. On
     every other step the articulation card leads and objections sit under
     it, still one click from open. */
  const objectionsFirst = ["quote","contact","calendar"].includes(rpState.step);
  let order;
  if(objectionsFirst){
    order = [cmpObjections(), cmpAlaCarte(), cmpTiers(), cmpBasicDeep(), cmpServices(), cmpRecurring(), cmpScope()];
  } else if(buyingBack){
    order = [cmpAlaCarte(), cmpTiers(), cmpBasicDeep(), cmpObjections(), cmpServices(), cmpRecurring(), cmpScope()];
  } else {
    order = [cmpTiers(), cmpBasicDeep(), cmpObjections(), cmpAlaCarte(), cmpServices(), cmpRecurring(), cmpScope()];
  }
  const cards = order.filter(Boolean).join("");
  if(!cards) return "";
  const desktop = !window.matchMedia || window.matchMedia("(min-width:1000px)").matches;
  return desktop ? cards
    : `<details class="cmp-mobile"><summary>Compare &amp; reference</summary>${cards}</details>`;
}

/* The sticky offset has to clear the real header, which changes height with
   the safe-area inset and the name length. Measured once, then on resize. */
function cmpSyncTopVar(){
  const top = document.querySelector(".top");
  if(top) document.documentElement.style.setProperty("--top-h", Math.round(top.getBoundingClientRect().height)+"px");
}
let cmpResizeTimer = null;
window.addEventListener("resize", function(){
  clearTimeout(cmpResizeTimer);
  cmpResizeTimer = setTimeout(function(){ cmpSyncTopVar(); renderSide(); }, 160);
});

function renderDock(){
  const d = el("dock");
  if(rpState.step==="done"){ d.hidden = true; return; }
  d.hidden = false;
  const i = stepIdx();
  el("backBtn").style.visibility = i>0 ? "visible" : "hidden";
  const busy = rpState.bookingSubmitting || rpState.customLeadSaving;
  const label = rpState.step==="calendar"
      ? (rpState.bookingSubmitting?"Booking…":"Confirm booking")
    : (rpState.step==="contact" && isCustomService())
      ? (rpState.customLeadSaving?"Saving…":"Submit request")
    : stepValid() ? "Next" : "Next — skip for now";
  el("goLabel").textContent = label;
  el("goBtn").disabled = !!busy;
}

/* Jumping around is normal on a real call — a caller volunteers the address
   before you've asked for it. Any step in the current flow, one tap. */
function jumpToStep(step){
  if(!flow().includes(step)) return;
  rpState.step=step; render();
  if(step==="calendar" && !Object.keys(rpState.availableSlots||{}).length) loadSlots();
}

/* =========================================================================
   LOOKUP — the feature that let the rail and the objection drawer go away
   =========================================================================
   1.0 answered "does that include the oven?" by printing eight scope
   bullets permanently in the rail, and answered "will I get my deposit
   back?" by making Liz open a drawer and eyeball sixteen entries. One is
   always on screen and rarely needed; the other is needed instantly and
   buried. Both are the same problem: reference material with no index.

   This builds the index fresh on every keystroke, so every price in it is
   the engine's live number — it cannot go stale the way a written cheat
   sheet does.
   ========================================================================= */
function lookupIndex(){
  const out=[];
  const money = n => `$${Number(n).toFixed(0)}`;

  OBJECTIONS.forEach(o=>out.push({
    kind:"Say this", say:true,
    title:o.q,
    answer: typeof o.a==="function"?o.a():o.a,
    why: typeof o.n==="function"?o.n():o.n
  }));

  const svc = rpState.service && rpIncludes[rpState.service];
  if(svc){
    (svc.items||[]).forEach(i=>out.push({
      kind:"Included", title:i,
      answer:`Yes — included in ${(rpServices[rpState.service]||{}).name} at no extra charge.`
    }));
    if(svc.fineprint) out.push({kind:"Not included", title:"What's NOT in the base price", answer:svc.fineprint});
  }

  const ir=RP_MOVEOUT_BEDROOM_TIERS, ex=RP_MOVEOUT_REFRESH_BEDROOM_TIERS;
  out.push({kind:"Price", title:"Inspection Ready move-out",
    answer: ir.map(t=>`${t.label} ${money(t.base)}`).join(" · ") + " — bathrooms included, no square-footage charge."});
  out.push({kind:"Price", title:"Move-Out Express",
    answer: ex.map(t=>`${t.label} ${money(t.base)}`).join(" · ") + " — no deposit guarantee; oven, fridge, cabinets and Detail Pass addable."});
  out.push({kind:"Price", title:"Deep cleaning", answer:`Flat ${money(RP_DEEP_ANCHOR_PRICE)} for ${RP_DEEP_ANCHOR_HOURS} hours. Extra time ${money(RP_EXTRA_HOUR_RATE)}/hour.`});
  out.push({kind:"Price", title:"Basic cleaning", answer:`Flat ${money(RP_BASIC_ANCHOR_PRICE)} for ${RP_BASIC_ANCHOR_HOURS} hours. Recurring saves 20% weekly, 15% biweekly, 10% monthly.`});
  out.push({kind:"Price", title:"Carpet cleaning", answer:`${money(rpAddonCatalog.carpet.bundlePrice)} per room, two-room minimum. Pet enzyme ${money(RP_PET_ENZYME_RATE)}/room.`});
  out.push({kind:"Price", title:"Hourly cleaning", answer:`${money(HOURLY_RATE_PER_CLEANER)} per cleaner per hour, ${HOURLY_MIN_HOURS}-hour minimum. Booking our time, not a finished checklist — the deposit guarantee doesn't apply.`});

function renderLookup(){
  const q = (el("lookupInput").value||"").trim().toLowerCase();
  const idx = lookupIndex();
  const terms = q.split(/\s+/).filter(Boolean);

  /* Rank, don't just filter. Typing "oven" has to surface "the oven costs
     $50 on Express" before it surfaces a long objection whose coaching note
     happens to contain the word. Title beats answer beats note, and among
     equals the shorter entry wins — a one-line answer is faster to read out
     than a paragraph. */
  const score = item => {
    const t=item.title.toLowerCase(), a=String(item.answer).toLowerCase(), w=String(item.why||"").toLowerCase();
    let n=0;
    for(const term of terms){
      if(!t.includes(term) && !a.includes(term) && !w.includes(term)) return -1;
      if(t.includes(term)) n+=10;
      if(a.includes(term)) n+=4;
      if(w.includes(term)) n+=1;
      if(t.split(/\W+/).includes(term)) n+=6;   // whole-word title hit
    }
    return n - Math.min(4, (t.length+a.length)/400);
  };
  const hits = !terms.length ? idx
    : idx.map(i=>({i, s:score(i)})).filter(x=>x.s>=0).sort((a,b)=>b.s-a.s).map(x=>x.i);

  el("lookupResults").innerHTML = hits.length
    ? `<p class="sheet-hint">${terms.length?`${hits.length} match${hits.length===1?"":"es"} \u2014 best first`:`Everything, live from the pricing engine. Type to narrow \u2014 try <b>oven</b>, <b>deposit</b>, <b>pay</b>, <b>home</b>, <b>spouse</b>.`}</p>`
      + hits.map((h,n)=>`<div class="hit ${n===0&&terms.length?"open":""}" onclick="this.classList.toggle('open')">
          <span class="hit-k ${h.say?"say":""}">${h.kind}</span>
          <h3>${h.title}</h3>
          <p class="${h.say?"quote":""}">${h.answer}</p>
          ${h.why?`<p class="why">${h.why}</p><span class="more">Tap for the note</span>`:""}
        </div>`).join("")
    : `<p class="sheet-empty">Nothing matches \u201c${esc(q)}\u201d.<br>Try a single word \u2014 \u201coven\u201d, \u201cdeposit\u201d, \u201cinsured\u201d, \u201clate\u201d.</p>`;
}

/* =========================================================================
   KEYBOARD — for the half of her shifts she's at a laptop
   ========================================================================= */
function typingInAField(t){
  return t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.tagName==="SELECT" || t.isContentEditable);
}
document.addEventListener("keydown", e=>{
  const lookupOpen = !el("lookupSheet").hidden;
  const endOpen = !el("endSheet").hidden;
  if(e.key==="Escape"){
    if(lookupOpen) return closeSheet("lookupSheet");
    if(endOpen) return closeSheet("endSheet");
    return;
  }
  if(lookupOpen || endOpen) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/" && !typingInAField(e.target)){ e.preventDefault(); return openLookup(); }
  if(e.key==="?" && !typingInAField(e.target)){ e.preventDefault(); return toggleCoach(); }
  if(typingInAField(e.target)){
    /* Enter still advances from a text field — that's the whole point of a
       form — but not from a textarea, where Enter is a new line. */
    if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); next(); }
    return;
  }
  /* A focused button owns its own Enter. Without this the global shortcut
     runs instead, so tabbing to Back and pressing Enter moves the call
     FORWARD, and tabbing to a step chip and pressing Enter advances rather
     than jumping to that step. Pre-existing — reproduced identically on the
     round-34 build — but round 35 put three more focusable buttons in the
     rail, which makes it far easier to land on. The dock's Go button is
     deliberately excluded: Enter advancing the call is its documented job,
     and it carries the ⏎ badge that says so. */
  const focusEl = document.activeElement;
  const focusOwnsEnter = focusEl && focusEl !== el("goBtn") &&
    (focusEl.tagName === "BUTTON" || focusEl.tagName === "SUMMARY" ||
     focusEl.getAttribute("role") === "button");
  if(e.key==="Enter"){
    if(focusOwnsEnter) return;              // let the browser click it
    e.preventDefault(); if(!el("goBtn").disabled) next(); return;
  }
  if(e.key==="Backspace"){ e.preventDefault(); back(); return; }
  if(/^[1-9]$/.test(e.key)){
    const fn = KEYMAP[Number(e.key)-1];
    if(fn){ e.preventDefault(); new Function(fn)(); }
  }
});

/* ---------- Calendar ----------
      show the same bookable window. */
function slotsForDate(dateKey){
  const raw=rpState.availableSlots?.[dateKey]?.slots || [];
  return raw.filter(slot=>{
    const m=String(slot).match(/T(\d{2}):/);
    const hour=m?Number(m[1]):NaN;
    return Number.isFinite(hour) && hour>=9 && hour<=17;
  });
}
function availableDateKeys(){
  return Object.keys(rpState.availableSlots||{}).filter(k=>slotsForDate(k).length>0).sort();
}
function bookingBounds(){
  const start=centralDateKey();
  return {start, end:addDaysKey(start,60)};
}
function monthKeyFromDateKey(k){ return `${String(k).slice(0,7)}-01`; }
function clampCalendarMonth(monthKey){
  const bounds=bookingBounds();
  const minMonth=monthKeyFromDateKey(bounds.start);
  const maxMonth=monthKeyFromDateKey(bounds.end);
  if(!monthKey||monthKey<minMonth) return minMonth;
  if(monthKey>maxMonth) return maxMonth;
  return monthKey;
}
function canMoveCalendarMonth(delta){
  const current=clampCalendarMonth(rpState.calendarMonth||monthKeyFromDateKey(centralDateKey()));
  const target=clampCalendarMonth(addDaysKey(monthBounds(current).first, delta>0?32:-1));
  return target!==current;
}
function changeCalendarMonth(delta){
  const current=clampCalendarMonth(rpState.calendarMonth||monthKeyFromDateKey(centralDateKey()));
  const target=addDaysKey(monthBounds(current).first, delta>0?32:-1);
  rpState.calendarMonth=clampCalendarMonth(monthKeyFromDateKey(target));
  render();
}
function formatMonthTitle(monthKey){
  return new Intl.DateTimeFormat("en-US",{month:"long",year:"numeric"}).format(dateFromKey(monthKey));
}
function calendarGridHtml(monthKey){
  const bounds=bookingBounds();
  const first=dateFromKey(monthKey);
  const year=first.getFullYear(), month=first.getMonth();
  const firstDow=new Date(year,month,1,12).getDay();
  const daysInMonth=new Date(year,month+1,0,12).getDate();
  const today=bounds.start;
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(`<span class="cal-blank" aria-hidden="true"></span>`);
  for(let day=1;day<=daysInMonth;day++){
    const dateKey=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const inWindow=dateKey>=bounds.start && dateKey<=bounds.end;
    const count=inWindow?slotsForDate(dateKey).length:0;
    const avail=inWindow && count>0;
    const isToday=dateKey===today;
    const isSel=rpState.selectedDay===dateKey;
    const cls=["cal-day",avail?"avail":"full",isToday?"today":"",isSel?"sel":""].filter(Boolean).join(" ");
    cells.push(`<button type="button" class="${cls}" ${avail?`onclick="pick('selectedDay','${dateKey}')"`:"disabled"}>
      <span>${day}</span>${avail?`<small>${count}</small>`:""}
    </button>`);
  }
  return cells.join("");
}
function calendarHtml(){
  if(rpState.slotsLoading) return `<p class="sub">Loading availability\u2026</p>`;
  if(rpState.slotsError) return `<div class="guard warn"><b>Availability unavailable</b>${esc(rpState.slotsError)}
    <div style="margin-top:8px"><button class="btn" onclick="loadSlots()">Try again</button></div></div>`;
  if(!Object.keys(rpState.availableSlots||{}).length) return `<p class="sub">No open slots returned.</p><button class="btn" onclick="loadSlots()">Reload</button>`;

  const monthKey=clampCalendarMonth(rpState.calendarMonth||monthKeyFromDateKey(centralDateKey()));
  rpState.calendarMonth=monthKey;
  const daysWithSlots=availableDateKeys();
  const sel=(rpState.selectedDay && slotsForDate(rpState.selectedDay).length>0) ? rpState.selectedDay : "";
  const slots=sel?slotsForDate(sel):[];

  return `<div class="cal-nav">
      <button type="button" onclick="changeCalendarMonth(-1)" ${canMoveCalendarMonth(-1)?"":"disabled"} aria-label="Previous month">\u2039</button>
      <strong>${formatMonthTitle(monthKey)}</strong>
      <button type="button" onclick="changeCalendarMonth(1)" ${canMoveCalendarMonth(1)?"":"disabled"} aria-label="Next month">\u203a</button>
    </div>
    <div class="cal-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div class="cal-grid">${calendarGridHtml(monthKey)}</div>
    <div class="cal-key"><span><i class="avail"></i>Open (number = slots)</span><span><i class="today"></i>Today</span></div>
    ${!daysWithSlots.some(d=>monthKeyFromDateKey(d)===monthKey) ? `<p class="sub">Nothing open this month \u2014 try the other month.</p>` : ""}
    ${sel ? `<p class="sub" style="margin-top:2px"><b>${fmtDay(sel)}</b> \u2014 tap a time:</p>
      <div class="slots">${slots.length?slots.map(t=>opt(fmtTime(t),`pickSlot('${t}')`,rpState.selectedStartTime===t)).join("")
        :`<p class="sub">Nothing open that day \u2014 offer another.</p>`}</div>` : ""}
    ${rpState.bookingError?`<div class="guard stop" style="margin-top:10px"><b>Booking failed</b>${esc(rpState.bookingError)}</div>`:""}
    ${rpState.bookingSubmitting?`<p class="sub" style="margin-top:10px">Booking\u2026</p>`:""}`;
}
function fmtDay(d){ return new Date(d+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"}); }
/* Explicit America/Chicago, same as /book's rpFormatTime() — without
   this, a device set to a different timezone shows the wrong time. */
function fmtTime(t){
  return new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",timeZone:"America/Chicago"}).format(new Date(t));
}
function pickSlot(t){ rpState.selectedStartTime=t;
  rpState.bookedAt=`${fmtDay(rpState.selectedDay)} at ${fmtTime(t)}`; render(); }

/* Date helpers — must match /book exactly. The booking worker expects
   date-only keys (YYYY-MM-DD) in America/Chicago, NOT ISO timestamps.
   Sending a full .toISOString() gets rejected as "Invalid date range".
   /book also requests one MONTH at a time (start/end clamped to a single
   month, within a 60-day booking window), so we do the same and merge two
   months — otherwise a call late in the month shows almost no dates. */
function centralDateKey(date=new Date()){
  const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",
    year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date)
    .reduce((a,x)=>{ if(x.type!=="literal") a[x.type]=x.value; return a; },{});
  return `${p.year}-${p.month}-${p.day}`;
}
function isoDate(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateFromKey(k){ return new Date(`${k}T12:00:00`); }
function addDaysKey(key,days){ const d=dateFromKey(key); d.setDate(d.getDate()+days); return isoDate(d); }
/* Inclusive first/last day of the month containing `key`. */
function monthBounds(key){
  const first=dateFromKey(key); first.setDate(1);
  const last=new Date(first); last.setMonth(last.getMonth()+1,0);
  return {first:isoDate(first), last:isoDate(last)};
}

async function fetchSlotRange(start,end){
  const r=await fetch(`${RP_BOOKING_API}/slots?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`,
    {headers:{Accept:"application/json"}});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.ok) throw new Error(j.error||`Availability request failed (HTTP ${r.status})`);
  const data=j.data||{}; delete data.traceId;
  return data;
}

async function loadSlots(){
  if(rpState.slotsLoading) return;
  rpState.slotsLoading=true; rpState.slotsError=""; render();
  try{
    const today=centralDateKey();
    const windowEnd=addDaysKey(today,60);            // worker's booking window
    const thisMonth=monthBounds(today);
    const nextKey=addDaysKey(thisMonth.last,1);
    const nextMonth=monthBounds(nextKey);

    const ranges=[
      {start:today, end:thisMonth.last<windowEnd?thisMonth.last:windowEnd}
    ];
    if(nextKey<=windowEnd){
      ranges.push({start:nextKey, end:nextMonth.last<windowEnd?nextMonth.last:windowEnd});
    }

    let merged={}, firstError=null;
    for(const rg of ranges){
      try{ merged=Object.assign(merged, await fetchSlotRange(rg.start,rg.end)); }
      catch(e){ if(!firstError) firstError=e; }
    }
    if(!Object.keys(merged).length && firstError) throw firstError;
    rpState.availableSlots=merged;
  }catch(e){
    rpState.slotsError=(e.message||"Availability temporarily unavailable.")
      +" Take their preferred day, tell them you'll confirm by text shortly, and book it in GHL \u2014 don't guess at a time.";
  }
  rpState.slotsLoading=false; render();
}



async function submitBooking(){
  if(rpState.bookingSubmitting) return;
  if(!rpState.selectedStartTime){
    rpState.bookingError="Pick a date and time above first.";
    render();
    return;
  }
  rpState.bookingSubmitting=true; rpState.bookingError=""; render();
  const parts=rpState.fullName.trim().split(/\s+/);
  try{
    const r=await fetch(`${RP_BOOKING_API}/book`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        firstName:parts[0]||"", lastName:parts.slice(1).join(" ")||"",
        email:rpState.email, phone:normalizePhone(rpState.phone),
        address1:rpState.address1, city:rpState.city, state:"OK", postalCode:rpState.postalCode,
        startTime:rpState.selectedStartTime,
        service:(rpServices[rpState.service]||{}).name||"Cleaning",
        serviceKey:rpState.service,
        estimate:rpIsCustomQuoteOnly()?0:rpFinalPrice(),
        bedrooms:rpState.bedrooms, bathrooms:rpState.bathrooms,
        specialInstructions:rpState.specialInstructions,
        notes:jobDetails(),
        /* Round 21: this object used to carry NINE fields while /book sent
           roughly sixty, so a phone booking arrived in GHL with no
           guarantee type, no move-out tier, no add-on prices and no
           questionnaire answers — any workflow branching on those fired
           wrong on every phone-booked job. rpBuildSharedDetails() is the
           same builder /book uses; the CSR-specific fields below are the
           only things that legitimately differ. */
        details:{
          ...rpBuildSharedDetails(),
          source:"RPC Call Console", business:"Red Prairie Cleaning",
          booking_channel:"phone_csr", csr_name:rpState.csrName,
          csr_lead_source:rpState.csrLeadSource||"N/A", csr_call_notes:rpState.csrCallNotes||"",
          condition:rpState.condition||"N/A",
          condition_adjustment_percent:Math.round(rpConditionMultiplier()*100),
          custom_quote_required:rpIsCustomQuoteOnly()?"Yes":"No",
          /* Round 25 (found while auditing /book vs /call): /book has
             sent this field on every booking for a while now; it never
             existed here, so a phone-booked handyman lead never reached
             GHL at all. Same field name as /book's payload so nothing
             downstream needs a second branch to read it. */
          handyman_interest:rpState.handymanInterest?"Yes":"No",
          /* Overrides the shared "Yes"/"No" with the CSR-verified state —
             Liz ticking "I asked and they confirmed" is a different fact
             from the website's self-serve checkbox. */
          military_discount:rpState.militaryDiscount?(rpState.militaryVerified?"Yes (confirmed)":"Yes (unconfirmed)"):"No",
          military_discount_verified:rpState.militaryVerified?"Yes":"No",
          special_instructions:rpState.specialInstructions||"",
          submitted_at:new Date().toISOString(),
          job_details:jobDetails()
        },
        companyWebsite:"", dryRun:false
      })
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.ok===false) throw new Error(j.error||`Booking failed (HTTP ${r.status})`);
    rpState.bookingSubmitting=false; rpState.step="done"; render();
  }catch(e){
    rpState.bookingSubmitting=false;
    rpState.bookingError=(e.message||"Unknown error")+" \u2014 don't hang up. Take the details down and book it in GHL manually.";
    render();
  }
}

/* =========================================================================
   PARTIAL LEAD CAPTURE (round 36)
   =========================================================================
   Measured before this existed: a caller gives a name and a number, hears
   the price, and hangs up — and nothing reaches the CRM. logOutcome() was
   the only capture path for a call that doesn't book, and it fires only
   when Liz opens the End-call sheet and picks a disposition. A dropped
   call, a closed tab, or a rushed "Start next call" lost the lead
   completely.

   /book has had the answer since the contact gate shipped: post a partial
   the moment you have a name and a number, fire-and-forget, and let the
   real booking or the disposition enrich it later. GHL matches on phone,
   so the partial and whatever follows land on one contact. This is that,
   for the phone.

   Fires at most once per call. rpState.partialLeadSent persists with the
   rest of the call state, so a refresh mid-call doesn't re-post. */
function rpCallPartialPayload(reason){
  return {
    source:"RPC Call Console", booking_channel:"phone_csr",
    lead_status:"phone_partial",
    call_outcome:reason||"Partial — captured mid-call, call not yet resolved",
    csr_name:rpState.csrName||"",
    csr_lead_source:rpState.csrLeadSource||"N/A",
    csr_call_notes:rpState.csrCallNotes||"",
    full_name:rpState.fullName, phone:normalizePhone(rpState.phone), email:rpState.email||"",
    service:rpState.service?((rpServices[rpState.service]||{}).name||"Not selected"):"Not selected",
    quoted_price:(rpState.service && !rpIsCustomQuoteOnly() && rpFinalPrice()>0)
      ? "$"+rpFinalPrice().toFixed(2) : "No quote given yet",
    details:[
      "PARTIAL LEAD FROM A LIVE CALL — the call had not finished when this was captured.",
      "Treat as a callback unless a booking or an outcome follows on the same number.",
      `Reached step: ${rpState.step}`,
      rpState.service?`Service so far: ${(rpServices[rpState.service]||{}).name}`:"Service not chosen yet",
      rpState.bedrooms?`Bedrooms: ${rpState.bedrooms}${rpState.bathrooms?` | Bathrooms: ${rpState.bathrooms}`:""}`:""
    ].filter(Boolean).join("\n"),
    submitted_at:new Date().toISOString()
  };
}

/* Never let a capture attempt block or break the call. Everything here is
   fire-and-forget; a failure is silent by design, because the End-call
   sheet is still there as the deliberate path and it reports its own
   errors loudly. */
function rpSendCallPartialLead(reason){
  if(rpState.partialLeadSent) return;
  if(!rpState.fullName || rpState.fullName.trim().length<2) return;
  if(!phoneOk(rpState.phone)) return;
  rpState.partialLeadSent = true;
  save();
  try{
    fetch(`${RP_BOOKING_API}/lead`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      keepalive:true, body:JSON.stringify(rpCallPartialPayload(reason))
    }).catch(()=>{});
  }catch(e){ /* offline, blocked, whatever — the End sheet still works */ }
}

/* The tab going away is the case the disposition sheet cannot cover, because
   by definition nobody clicked anything. sendBeacon is the only request that
   reliably survives it. */
window.addEventListener("pagehide", function(){
  if(rpState.partialLeadSent) return;
  if(!rpState.fullName || rpState.fullName.trim().length<2) return;
  if(!phoneOk(rpState.phone)) return;
  if(rpState.step==="done") return;              // already booked or logged
  try{
    const body = JSON.stringify(rpCallPartialPayload("Partial — console closed before the call was resolved"));
    if(navigator.sendBeacon){
      navigator.sendBeacon(`${RP_BOOKING_API}/lead`, new Blob([body],{type:"application/json"}));
      rpState.partialLeadSent = true; save();
    }
  }catch(e){}
});

/* ---------- Custom Quote fallback: no booking, just a logged lead ---------- */
async function submitCustomLead(){
  if(rpState.customLeadSaving) return;
  rpState.customLeadSaving=true; rpState.customLeadError=""; render();
  try{
    const r=await fetch(`${RP_BOOKING_API}/lead`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        source:"RPC Call Console", booking_channel:"phone_csr", lead_status:"custom_quote_requested",
        call_outcome:"Custom quote requested", csr_name:rpState.csrName,
        csr_lead_source:rpState.csrLeadSource||"N/A", csr_call_notes:rpState.csrCallNotes||"",
        full_name:rpState.fullName, phone:normalizePhone(rpState.phone), email:rpState.email,
        service:"Custom Quote / Something Else",
        quoted_price:"No quote given \u2014 requires in-person visit or photos",
        details:[
          `CUSTOM QUOTE REQUEST`,
          `What they need: ${rpState.customNotes||"(not captured)"}`,
          `Address: ${rpState.address1}, ${rpState.city}, ${rpState.state} ${rpState.postalCode}`,
          rpState.specialInstructions?`Notes: ${rpState.specialInstructions}`:""
        ].filter(Boolean).join("\n"),
        submitted_at:new Date().toISOString()
      })
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    rpState.customLeadSaving=false; rpState.step="done"; render();
  }catch(e){
    rpState.customLeadSaving=false;
    rpState.customLeadError=(e.message||"Unknown error")+" \u2014 don't hang up. Take the details down and pass them to the office manually.";
    render();
  }
}

/* ---------- Outcome logging for calls that don't book ---------- */
async function logOutcome(outcome){
  rpState.csrDisposition=outcome;
  const n=el("outNotes"); if(n) rpState.csrCallNotes=n.value;
  const st=el("outStatus"); st.textContent="Saving\u2026"; st.style.color="";
  try{
    const r=await fetch(`${RP_BOOKING_API}/lead`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        source:"RPC Call Console", booking_channel:"phone_csr", lead_status:"no_booking",
        call_outcome:outcome, csr_name:rpState.csrName,
        csr_lead_source:rpState.csrLeadSource||"N/A", csr_call_notes:rpState.csrCallNotes||"",
        full_name:rpState.fullName, phone:normalizePhone(rpState.phone), email:rpState.email,
        service:rpState.service?(rpServices[rpState.service]||{}).name:"Not selected",
        quoted_price:(rpState.service&&!rpIsCustomQuoteOnly()&&rpFinalPrice()>0)?"$"+rpFinalPrice().toFixed(2):"No quote given",
        /* Round 21: a lost call is the lead most worth re-working, and it
           was going to GHL as a text blob only. The structured fields
           (tier, guarantee, add-ons with prices, questionnaire answers,
           the exact number Liz quoted) are what make a follow-up
           campaign targetable rather than a manual read-through. Only
           spread when a service was actually picked — rpBuildSharedDetails
           reads rpState.service and would report "N/A" across the board
           on a hangup at step one. */
        ...(rpState.service ? rpBuildSharedDetails() : {}),
        details:jobDetails(), submitted_at:new Date().toISOString()
      })
    });
    if(!r.ok) throw new Error("HTTP "+r.status);
    st.textContent=`Logged: ${outcome}. Starting a fresh call\u2026`; st.style.color="var(--green)";
    setTimeout(resetCall,1100);
  }catch(e){
    st.innerHTML=`<b>Not saved to CRM (${esc(e.message)}).</b> Copy the name, number and notes into GHL manually before the next call \u2014 don't lose this lead.`;
    st.style.color="var(--red)";
  }
}

/* ---------- Boot ---------- */
load();
cmpSyncTopVar();
render();
if(rpState.step==="calendar" && !Object.keys(rpState.availableSlots||{}).length) loadSlots();

</script>
