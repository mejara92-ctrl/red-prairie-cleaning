<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Call Console — Internal</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* ==========================================================================
   RPC CALL CONSOLE 2.0
   --------------------------------------------------------------------------
   Design rule for this file, and the reason for the rewrite: a phone console
   has exactly two jobs — show the words to SAY, and capture the answer in one
   tap. Everything else is reference. Reference is one keystroke away, never
   permanently on screen.

   Console 1.0 broke that rule. Measured on a live move-out call, the quote
   screen carried 541 words and put the Next button 1,268px down the page, so
   Liz scrolled while she talked. The add-ons screen told her to "ask by name"
   four separate times, in four different boxes. The right rail printed the
   same eight scope bullets on all twelve steps.

   So: three fixed zones that never scroll away — the line to say, the thing
   to tap, and the dock. Coaching collapses. Reference moves into one search.
   ========================================================================== */
:root{
  --bg:#eef0f4;
  --panel:#ffffff;
  --panel-2:#f6f7fa;
  --sunk:#e6e9ef;
  --ink:#14171c;
  --ink-2:#3d4551;
  --muted:#6b7482;
  --line:#d8dde5;
  --line-2:#c2c9d4;
  --red:#a4202a;
  --red-ink:#a4202a;
  --red-wash:#fbeef0;
  --green:#186b4d;
  --green-wash:#e8f3ee;
  --amber:#8a5a12;
  --amber-wash:#fbf2e3;
  --blue:#28517f;
  --blue-wash:#e9eff7;
  --focus:#28517f;
  --shadow:0 1px 2px rgba(16,20,26,.06), 0 10px 28px -16px rgba(16,20,26,.28);
  --dock-h:68px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1216; --panel:#181c22; --panel-2:#1e232a; --sunk:#131720;
    --ink:#eaedf2; --ink-2:#c3cad4; --muted:#8b95a3;
    --line:#2a3039; --line-2:#3a424e;
    --red:#c8323d; --red-ink:#f2969c; --red-wash:#2a1719;
    --green:#5cbd95; --green-wash:#132420;
    --amber:#dfae63; --amber-wash:#241d12;
    --blue:#8fb5e2; --blue-wash:#151d29;
    --focus:#8fb5e2;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -16px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:6px}

/* ── Zone 1: top bar. Caller, elapsed, money, escape hatches. ───────── */
.top{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:8px 12px calc(8px) 12px; padding-top:calc(8px + env(safe-area-inset-top));
  background:var(--panel); border-bottom:1px solid var(--line);
}
.who{min-width:0; flex:1 1 auto; line-height:1.2}
/* The caller's name is the page's heading — the console had no <h1>
   at all. An earlier fix put one here and a later re-assembly dropped
   it, so the rule below styles h1 and b identically and both files
   carry the markup. */
.who b, .who h1{display:block; margin:0; font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who span{display:block; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.top-actions{display:flex; align-items:center; gap:7px; flex:0 0 auto}
.clock{
  font-variant-numeric:tabular-nums; font-size:13px; font-weight:700; color:var(--muted);
  padding:0 2px; letter-spacing:.02em;
}
.money{
  display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
  min-height:44px; padding:4px 12px; border-radius:10px;
  background:var(--sunk); border:1px solid var(--line);
}
.money b{font-size:20px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.money small{font-size:9px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px}
.money.is-custom b{font-size:15px; color:var(--amber)}
.tbtn{
  min-height:44px; min-width:44px; padding:0 12px; border-radius:10px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--line-2); color:var(--ink);
  font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.tbtn:hover{background:var(--sunk)}
.tbtn.danger{background:var(--red); border-color:var(--red); color:#fff}
.tbtn kbd{
  font:600 10px/1 "Public Sans",sans-serif; padding:2px 4px; border-radius:3px;
  background:rgba(125,135,150,.22); color:var(--muted);
}
@media (max-width:560px){ .tbtn .lbl{display:none} .tbtn kbd{display:none} .clock{display:none} }

/* ── Step strip. Skipping around is normal on a real call. ──────────── */
.strip{
  position:sticky; top:0; z-index:30;
  display:flex; gap:5px; overflow-x:auto; padding:7px 12px;
  background:var(--panel-2); border-bottom:1px solid var(--line);
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 12px; border-radius:99px; cursor:pointer; white-space:nowrap;
  background:transparent; border:1px solid var(--line-2); color:var(--muted);
  font-size:11.5px; font-weight:700; letter-spacing:.01em; min-height:34px;
}
.chip.done{color:var(--ink-2); border-color:var(--line-2); background:var(--panel)}
.chip.now{background:var(--red); border-color:var(--red); color:#fff}

/* ── Zone 2: the line. The one thing she reads. ─────────────────────── */
.wrap{max-width:1180px; margin:0 auto; padding:16px 14px calc(var(--dock-h) + 26px)}
@media (min-width:1000px){ .wrap{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start} }
.col-main{min-width:0}

.say{
  background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--red);
  border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); margin-bottom:14px;
}
.say-label{
  display:flex; align-items:center; gap:8px; margin-bottom:8px;
  font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--red-ink);
}
.say-label .spacer{flex:1}
.say p{
  margin:0; font-family:Newsreader,Georgia,serif; font-weight:400;
  font-size:clamp(20px,2.6vw,25px); line-height:1.38; letter-spacing:-.005em; color:var(--ink);
  text-wrap:pretty;
}
.coach-btn{
  cursor:pointer; background:transparent; border:1px solid var(--line-2); color:var(--muted);
  border-radius:99px; padding:6px 12px; font-size:10px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; min-height:34px;
}
.coach-btn[aria-expanded="true"]{background:var(--blue-wash); border-color:var(--blue); color:var(--blue)}
.coach{
  margin-top:12px; padding-top:11px; border-top:1px dashed var(--line-2);
  font-size:14px; line-height:1.55; color:var(--ink-2);
}
.coach[hidden]{display:none}
.coach b{color:var(--ink)}

/* ── Zone 3: capture. One tap, numbered for the keyboard. ───────────── */
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:15px 16px 16px; box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}
.card h2{margin:0 0 3px; font-size:19px; font-weight:800; letter-spacing:-.015em}
.card .sub{margin:0 0 12px; font-size:13.5px; color:var(--muted); line-height:1.45}
.grp{margin-bottom:13px}
.grp:last-child{margin-bottom:0}
.grp-h{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; margin-bottom:6px;
  font-size:11px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
}
.grp-h em{font-style:normal; font-weight:600; letter-spacing:0; text-transform:none; font-size:12px; color:var(--muted)}

.opts{display:grid; grid-template-columns:1fr; gap:7px}
.opts.two{grid-template-columns:1fr 1fr}
.opts.three{grid-template-columns:repeat(3,1fr)}
/* Single-character choices (bedrooms, baths, hours, room counts) stay five
   across even on a phone — at 390px that's a 68px button, comfortably over
   the touch minimum, and it keeps the merged "About the home" screen down to
   one thumb-scroll instead of four rows of near-empty buttons. */
.opts.five{grid-template-columns:repeat(5,1fr)}
.opts.five .o{justify-content:center; text-align:center; padding-inline:6px; font-size:16px}
.opts.five .o .key{display:none}
@media (max-width:330px){ .opts.five{grid-template-columns:repeat(4,1fr)} }
.o{
  position:relative; display:flex; align-items:center; gap:9px; text-align:left; cursor:pointer;
  min-height:48px; padding:9px 12px 9px 10px; border-radius:9px;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink);
  font-size:15px; font-weight:600; line-height:1.3; width:100%;
}
.o:hover{border-color:var(--muted)}
.o.on{background:var(--red-wash); border-color:var(--red); color:var(--red-ink); font-weight:700}
.o .key{
  flex:0 0 auto; width:20px; height:20px; border-radius:4px; display:grid; place-items:center;
  background:var(--sunk); border:1px solid var(--line-2); color:var(--muted);
  font-size:10.5px; font-weight:800; font-variant-numeric:tabular-nums;
}
.o.on .key{background:var(--red); border-color:var(--red); color:#fff}
@media (max-width:560px){ .o .key{display:none} .o{padding-left:12px} }
.o .txt{min-width:0}
.o .txt small{display:block; margin-top:2px; font-size:12.5px; font-weight:500; color:var(--muted); line-height:1.4}
.o.on .txt small{color:var(--red-ink); opacity:.85}
.o .amt{margin-left:auto; flex:0 0 auto; font-weight:800; font-variant-numeric:tabular-nums; font-size:14.5px}
.o.center{justify-content:center; text-align:center}

/* Fields */
.f{margin-bottom:11px}
.f:last-child{margin-bottom:0}
.f label{display:block; margin-bottom:4px; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.f input,.f select,.f textarea{
  width:100%; min-height:48px; padding:11px 12px; border-radius:9px;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink); font-size:16px;
}
.f textarea{min-height:76px; resize:vertical; line-height:1.45}
.f-row{display:grid; grid-template-columns:1fr 110px; gap:10px}

/* Guardrails: conditional, so they earn their space. */
.guard{
  display:flex; gap:9px; margin-top:11px; padding:11px 13px; border-radius:9px;
  font-size:13.5px; line-height:1.5; border:1px solid;
}
.guard b{display:block; margin-bottom:2px; font-size:13px; font-weight:800}
.guard .ic{flex:0 0 auto; font-size:14px; line-height:1.4}
.guard.stop{background:var(--red-wash); border-color:var(--red); color:var(--ink)}
.guard.stop b{color:var(--red-ink)}
.guard.warn{background:var(--amber-wash); border-color:var(--amber); color:var(--ink)}
.guard.warn b{color:var(--amber)}
.guard.info{background:var(--blue-wash); border-color:var(--blue); color:var(--ink)}
.guard.info b{color:var(--blue)}
.guard.win{background:var(--green-wash); border-color:var(--green); color:var(--ink)}
.guard.win b{color:var(--green)}

/* ── Zone 4: the dock. Never scrolls away. ──────────────────────────── */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:45;
  display:flex; gap:10px; align-items:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:var(--panel); border-top:1px solid var(--line);
  box-shadow:0 -6px 20px -12px rgba(16,20,26,.35);
}
.dock .back{
  min-height:48px; min-width:56px; padding:0 15px; border-radius:10px; cursor:pointer;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink-2); font-weight:700;
}
.dock .go{
  flex:1; min-height:48px; border-radius:10px; cursor:pointer; border:0;
  background:var(--red); color:#fff; font-size:16px; font-weight:800; letter-spacing:.01em;
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
}
.dock .go:disabled{opacity:.55; cursor:default}
.dock .go kbd{font:700 10px/1 "Public Sans",sans-serif; padding:3px 5px; border-radius:3px; background:rgba(255,255,255,.22)}
@media (max-width:560px){ .dock .go kbd{display:none} }

/* ── Side panel (desktop) / stacked (mobile): live recap only. ───────── */
.side{display:flex; flex-direction:column; gap:12px}
@media (max-width:999px){ .side{margin-top:12px} }
.recap{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
.recap-h{
  padding:9px 14px; background:var(--sunk); border-bottom:1px solid var(--line);
  font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.recap-row{display:flex; justify-content:space-between; gap:12px; padding:8px 14px; border-bottom:1px solid var(--line); font-size:13.5px}
.recap-row:last-child{border-bottom:0}
.recap-row span{color:var(--muted)}
.recap-row b{font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.recap-row.neg b{color:var(--green)}

/* ── Compare rail (round 35): the desktop column, earning its space. ──
   Sticky, because it is reference read WHILE talking — a rail that
   scrolls away at the moment she needs it is the same as no rail. Scrolls
   internally rather than growing the page. */
@media (min-width:1000px){
  .side{
    position:sticky; top:calc(var(--top-h, 60px) + 10px);
    max-height:calc(100vh - var(--top-h, 60px) - var(--dock-h) - 26px);
    overflow-y:auto; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:var(--line-2) transparent;
  }
  .side::-webkit-scrollbar{width:9px}
  .side::-webkit-scrollbar-thumb{background:var(--line-2); border-radius:9px; border:3px solid var(--bg)}
  .side::-webkit-scrollbar-track{background:transparent}
}
/* More room on a real monitor. 300px cannot hold two price columns and a
   label without wrapping every row. */
@media (min-width:1280px){ .wrap{grid-template-columns:minmax(0,1fr) 372px} }

.cmp{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
.cmp-h{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:9px 14px; background:var(--sunk); border-bottom:1px solid var(--line);
  font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
  text-align:left;
}
button.cmp-h{border:0; border-bottom:1px solid var(--line); cursor:pointer; font-family:inherit; min-height:36px}
button.cmp-h:hover{color:var(--ink-2)}
.cmp-h .cmp-chev{margin-left:auto; font-size:14px; font-weight:700; line-height:1; color:var(--muted)}
.cmp-b{padding:4px 0 10px}

/* The comparison table. Three columns: what, tier A, tier B. */
.cmp-row{
  display:grid; grid-template-columns:minmax(0,1fr) 78px 78px; gap:8px; align-items:baseline;
  padding:6px 14px; font-size:13px;
}
.cmp-row span{color:var(--muted); min-width:0}
.cmp-row b{font-weight:700; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
.cmp-row.head{padding-top:9px; padding-bottom:7px; border-bottom:1px solid var(--line); margin-bottom:3px}
.cmp-row.head span{font-weight:800; color:var(--ink-2); text-transform:none; letter-spacing:0}
.cmp-row.head b{font-size:9.5px; font-weight:800; letter-spacing:.08em; color:var(--muted)}
.cmp-row.big b{font-size:18px; font-family:Newsreader,Georgia,serif; font-weight:500}
.cmp-row b.pick{color:var(--red-ink)}
.cmp-row.head b.pick{color:var(--red-ink)}

.cmp-gap{
  margin:5px 10px 7px; padding:6px 12px; border-radius:8px; background:var(--panel-2);
  font-size:12.5px; line-height:1.45; color:var(--ink-2);
}
.cmp-gap b{color:var(--ink); font-weight:800}

/* Full-width lines: the conclusion, not the data. */
.cmp-line{padding:7px 14px; font-size:12.5px; line-height:1.5; color:var(--ink-2)}
.cmp-line b{color:var(--ink)}
.cmp-verdict{
  margin:7px 10px 3px; padding:9px 12px; border-radius:9px; font-size:13px; line-height:1.5;
  background:var(--green-wash); color:var(--ink); border:1px solid transparent;
}
.cmp-verdict.warn{background:var(--amber-wash)}
.cmp-verdict.stop{background:var(--red-wash)}
.cmp-verdict b{font-weight:800}
.cmp-say{
  margin:8px 10px 3px; padding:10px 12px; border-radius:9px;
  background:var(--red-wash); border-left:3px solid var(--red);
  font-family:Newsreader,Georgia,serif; font-size:14.5px; line-height:1.45; color:var(--ink);
}
.cmp-say .k{
  display:block; margin-bottom:4px; font-family:"Public Sans",sans-serif;
  font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--red-ink);
}

/* Scope list: what's in the price, what isn't. */
.cmp-list{margin:0; padding:2px 14px 0; list-style:none; font-size:12.5px; line-height:1.5}
.cmp-list li{position:relative; padding:3px 0 3px 17px; color:var(--ink-2)}
.cmp-list li::before{position:absolute; left:0; top:3px; font-weight:800; color:var(--green)}
.cmp-list li.yes::before{content:"✓"}
.cmp-list li.no::before{content:"✗"; color:var(--red)}
.cmp-sub{padding:3px 14px 0; font-size:11.5px; line-height:1.45; color:var(--muted)}

.cmp-split{
  margin:10px 0 2px; padding:7px 14px 3px; border-top:1px solid var(--line);
  font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}

/* Priced rows inside a card (the Express buy-back list, recurring plans). */
.cmp-item{
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  padding:5px 14px; font-size:13px;
}
.cmp-item span{color:var(--ink-2)}
.cmp-item b{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.cmp-item.sum{border-top:1px solid var(--line); margin-top:4px; padding-top:8px}
.cmp-item.sum span, .cmp-item.sum b{color:var(--ink); font-weight:800}
.cmp-item.on span{color:var(--ink); font-weight:600}
.cmp-item .tag{
  font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--red-ink); margin-left:6px;
}

/* Script-first cards (round 37): the words she says, then the question
   that decides it, then each answer wired to a real price. */
.cmp-ask{
  margin:8px 10px 2px; padding:9px 12px; border-radius:9px;
  background:var(--panel-2); border-left:3px solid var(--line-2);
  font-family:Newsreader,Georgia,serif; font-size:14.5px; line-height:1.4; color:var(--ink);
}
.cmp-ask .k, .cmp-say .k{
  display:block; margin-bottom:4px; font-family:"Public Sans",sans-serif;
  font-size:9px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
}
.cmp-ask .k{color:var(--muted)}
.cmp-branch{
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  padding:5px 14px; font-size:12.5px; color:var(--ink-2);
}
.cmp-branch b{font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}

/* A fold inside a card — "the numbers", present but not first. */
.cmp-fold{margin-top:8px; border-top:1px solid var(--line)}
.cmp-fold-h{
  display:flex; align-items:center; gap:8px; width:100%; min-height:38px;
  padding:8px 14px; background:transparent; border:0; cursor:pointer; text-align:left;
  font:800 10px/1.2 "Public Sans",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.cmp-fold-h:hover{color:var(--ink-2)}
.cmp-fold-b{padding-bottom:4px}

/* Objection chips: the five she hears every day, one click from the words. */
.cmp-obj-row{display:flex; flex-wrap:wrap; gap:6px; padding:8px 12px 4px}
.cmp-obj{
  flex:0 0 auto; max-width:100%; padding:7px 11px; border-radius:99px; cursor:pointer;
  background:var(--panel-2); border:1px solid var(--line-2); color:var(--ink-2);
  font:700 12px/1.25 "Public Sans",sans-serif; text-align:left; min-height:34px;
}
.cmp-obj:hover{border-color:var(--red); color:var(--red-ink)}
.cmp-obj.is-open{background:var(--red); border-color:var(--red); color:#fff}
.cmp-obj-answer{padding-top:2px}

/* Mobile keeps round 30's lean screen: one collapsed disclosure, closed. */
.cmp-mobile{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow)}
.cmp-mobile > summary{
  padding:12px 14px; cursor:pointer; min-height:44px; display:flex; align-items:center;
  font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
}
.cmp-mobile[open] > summary{border-bottom:1px solid var(--line)}
.cmp-mobile .cmp{border:0; border-radius:0; box-shadow:none; border-bottom:1px solid var(--line)}
.cmp-mobile .cmp:last-child{border-bottom:0}

/* ── Lookup: one search over everything she used to hunt for. ───────── */
.sheet{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column;
  background:var(--bg);
}
.sheet[hidden]{display:none}
.sheet-top{
  display:flex; gap:9px; align-items:center; padding:12px 14px;
  padding-top:calc(12px + env(safe-area-inset-top));
  background:var(--panel); border-bottom:1px solid var(--line);
}
.sheet-top input{
  flex:1; min-height:48px; padding:11px 14px; border-radius:10px; font-size:17px;
  background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink);
}
.sheet-body{flex:1; overflow-y:auto; padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
.hit{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px 15px; margin-bottom:9px}
.hit-k{
  display:inline-block; margin-bottom:6px; padding:2px 7px; border-radius:3px;
  font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  background:var(--sunk); color:var(--muted);
}
.hit-k.say{background:var(--red-wash); color:var(--red-ink)}
.hit h3{margin:0 0 5px; font-size:15px; font-weight:800; line-height:1.35}
.hit p{margin:0 0 6px; font-size:14.5px; line-height:1.55; color:var(--ink-2)}
.hit p:last-child{margin-bottom:0}
.hit .quote{font-family:Newsreader,Georgia,serif; font-size:16.5px; line-height:1.45; color:var(--ink)}
/* The coaching note is useful once she's found the right card and useless
   while she's still scanning, so it stays clamped until the card is tapped.
   The top hit for a real query opens itself. */
.hit{cursor:pointer}
.hit .why{
  font-size:13px; color:var(--muted); border-top:1px dashed var(--line-2);
  padding-top:6px; margin-top:7px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.hit.open .why{-webkit-line-clamp:unset; overflow:visible}
.hit .more{display:block; margin-top:5px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--blue)}
.hit.open .more{display:none}
.sheet-empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14.5px}
.sheet-hint{padding:0 2px 10px; font-size:12px; color:var(--muted)}
.sheet-hint b{color:var(--ink-2)}

/* End-call sheet reuses .sheet */
.out-btn{
  display:block; width:100%; text-align:left; margin-bottom:8px; cursor:pointer;
  min-height:56px; padding:11px 14px; border-radius:10px;
  background:var(--panel); border:1.5px solid var(--line-2); color:var(--ink); font-size:15px; font-weight:700;
}
.out-btn small{display:block; font-weight:500; font-size:12.5px; color:var(--muted); margin-top:2px}
.out-btn:hover{border-color:var(--muted)}

/* Calendar (logic unchanged from 1.0; restyled to the new tokens) */
.cal-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.cal-nav button{min-height:44px; min-width:44px; border-radius:8px; cursor:pointer; background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink); font-weight:800; font-size:18px}
.cal-nav button:disabled{opacity:.4; cursor:default}
.cal-nav strong{font-weight:800; font-size:15px}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px}
.cal-weekdays span{text-align:center; font-size:10px; font-weight:800; letter-spacing:.06em; color:var(--muted)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.cal-blank{display:block}
.cal-day{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  aspect-ratio:1; min-height:42px; border-radius:8px; border:1.5px solid transparent;
  background:transparent; color:var(--muted); font-size:14px; font-weight:600;
  cursor:default; font-variant-numeric:tabular-nums;
}
.cal-day.avail{background:var(--panel-2); border-color:var(--line-2); color:var(--ink); cursor:pointer}
.cal-day.avail:hover{border-color:var(--muted)}
.cal-day small{font-size:9.5px; font-weight:800; color:var(--green); line-height:1}
.cal-day.sel{background:var(--red); border-color:var(--red); color:#fff}
.cal-day.sel small{color:#fff; opacity:.85}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--amber)}
.cal-day.full{opacity:.42}
.cal-key{display:flex; flex-wrap:wrap; gap:14px; margin:10px 0 4px; font-size:11.5px; color:var(--muted)}
.cal-key span{display:flex; align-items:center; gap:5px}
.cal-key i{width:10px; height:10px; border-radius:3px; display:inline-block}
.cal-key i.avail{background:var(--panel-2); border:1.5px solid var(--line-2)}
.cal-key i.today{background:var(--panel-2); box-shadow:0 0 0 2px var(--amber)}
.slots{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:7px; margin-top:6px}
@media (max-width:360px){
  /* Seven columns can't drop to six, so at the narrowest phone width the
     cells shrink instead of the page scrolling sideways. */
  .cal-grid,.cal-weekdays{gap:3px}
  .cal-day{min-height:36px; font-size:13px}
  .card{padding-left:11px; padding-right:11px}
  .wrap{padding-left:9px; padding-right:9px}
}
.sub{margin:6px 0; font-size:13.5px; color:var(--muted); line-height:1.45}
.btn{min-height:44px; padding:0 15px; border-radius:9px; cursor:pointer; background:var(--panel-2); border:1.5px solid var(--line-2); color:var(--ink); font-weight:700}

.note{display:block; font-size:12.5px; color:var(--muted); line-height:1.45; margin-top:3px}
.setup-wrap{max-width:460px; margin:16vh auto 0; padding:0 18px}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }

<body>

<header class="top">
  <div class="who"><h1 id="whoName">Call Console</h1><span id="whoSub">Internal tool</span></div>
  <div class="top-actions">
    <span class="clock" id="clock" title="Time on this call">0:00</span>
    <div class="money" id="money"><b>—</b><small>Total</small></div>
    <button class="tbtn" type="button" id="lookupBtn" onclick="openLookup()" aria-label="Look something up">
      <span aria-hidden="true">🔍</span><span class="lbl">Look up</span><kbd>/</kbd>
    </button>
    <button class="tbtn danger" type="button" onclick="openSheet('endSheet')">End</button>
  </div>
</header>

<nav class="strip" id="strip" aria-label="Call steps"></nav>

<div class="wrap">
  <div class="col-main" id="main" aria-live="polite"></div>
  <aside class="side" id="side"></aside>
</div>

<div class="dock" id="dock" hidden>
  <button class="back" type="button" id="backBtn" onclick="back()">Back</button>
  <button class="go" type="button" id="goBtn" onclick="next()"><span id="goLabel">Next</span><kbd>↵</kbd></button>
</div>

<!-- Lookup: replaces the always-on scope rail AND the 16-item objection drawer -->
<section class="sheet" id="lookupSheet" hidden aria-label="Look something up">
  <div class="sheet-top">
    <input id="lookupInput" type="search" placeholder="oven, deposit, pay, carpet, not home…" autocomplete="off" oninput="renderLookup()">
    <button class="tbtn" type="button" onclick="closeSheet('lookupSheet')">Close</button>
  </div>
  <div class="sheet-body"><div id="lookupResults"></div></div>
</section>

<section class="sheet" id="endSheet" hidden aria-label="End the call">
  <div class="sheet-top">
    <div class="who" style="flex:1"><b>How did the call end?</b><span>Logs the lead so it can be worked again</span></div>
    <button class="tbtn" type="button" onclick="closeSheet('endSheet')">Close</button>
  </div>
  <div class="sheet-body">
    <div class="f"><label for="outNotes">Anything worth noting</label>
      <textarea id="outNotes" placeholder="What they said, what to try next time…"></textarea></div>
    <div id="outList"></div>
    <p id="outStatus" class="note" style="margin-top:10px"></p>
    <button class="out-btn" type="button" onclick="closeSheet('endSheet')" style="margin-top:14px;text-align:center;font-weight:700">Never mind — back to the call</button>
  </div>
</section>

<script src="../js/rp-messages.js"></script>
<script src="../js/rp-pricing-engine.js"></script>
<script>
/* =========================================================================
   CSR CALL CONSOLE
   All pricing math comes from /js/rp-pricing-engine.js — the same file
   /book uses. Never hardcode a price here; change it in the engine so a
   phone quote and a web quote can never disagree.
   ========================================================================= */
const RP_BOOKING_API = "https://rpc-booking-api.aged-breeze-c9a5.workers.dev";
const LS_KEY = "rpCallConsole.v1";

/* The engine reads this global. Field names match /book's rpState. */
const rpState = {
  step:"service", service:null, moveoutTierChosen:false,
  sqft:null, bedrooms:null, bathrooms:null, condition:null, frequency:null,
  cleanerCount:null, hourCount:null,
  carpetRooms:0, addonCarpetRooms:0, addonCarpetPetEnzyme:false, windowsTier:null,
  garageWash:false, laundryLoads:0, fridgeAddon:false, ovenAddon:false, cabinetsAddon:false, detailPassAddon:false, junkSize:null, handymanInterest:false, addonDropNotice:"",
  militaryDiscount:false, militaryVerified:false,
  noAC:false, moldConcern:false, petWasteConcern:false, hazardConcern:false,
  heavySoil:false, petOdor:false,
  /* Below: fields the shared engine (rp-pricing-engine.js) reads that
     this console's own rpState never declared. Missing entirely (not
     just unset) matters here — rpMoveoutQuestionnaireAnswered() checks
     `!== null`, and a genuinely undefined property still passes that
     check, which would have silently treated an unanswered questionnaire
     as complete. Declaring them explicitly as null/0/false closes that. */
  addonExtraHours:0, addonSecondCleaner:false, addonPetEnzyme:false,
  moveoutWaterOn:null, moveoutAcOn:null, moveoutMoldPests:null,
  moveoutRentalOrSelling:null, moveoutPmOrRealtor:"",
  fullName:"", phone:"", email:"", address1:"", city:"", state:"OK", postalCode:"",
  specialInstructions:"", addressReadBack:false,
  customNotes:"",
  csrName:"", csrLeadSource:null, csrCallNotes:"", csrDisposition:null,
  quotedAloud:false,
  selectedDay:null, selectedStartTime:null, bookedAt:null, calendarMonth:null,
  availableSlots:{}, slotsLoading:false, slotsError:"",
  bookingSubmitting:false, bookingError:"", customLeadSaving:false, customLeadError:"",
  /* Round 36: true once a partial lead has been posted for THIS call, so a
     re-render, a step back, or a mid-call refresh can't post a second. */
  partialLeadSent:false
};


/* =========================================================================
   FLOW — 12 steps became 9.
   =========================================================================
   1.0 gave every question its own screen, so a move-out call was twelve
   screen transitions, several of them a single tap: bedrooms, then
   bathrooms, then three yes/no questions, then renting-or-selling. Each
   transition costs a beat of dead air on the phone.

   "home" merges bedrooms + bathrooms + the three hard-stop checks into one
   screen — they are all just facts about the property, they all fit
   without scrolling, and it is the block Liz reads out as one breath.
   "intent" (renting vs selling) moved onto the tier screen, because that
   is the only place it changes what she does: it decides which tier she
   leads with. "hourly" merges cleaners + hours for the same reason.

   Step ORDER is unchanged in every way that matters: contact is still
   captured before any price is spoken, and the hard-stop checks still
   land before the tier screen shows a number.
   ========================================================================= */
const FLOWS = {
  moveout:        ["service","caller","home","tiers","addons","quote","contact","calendar","done"],
  moveoutrefresh: ["service","caller","home","tiers","addons","quote","contact","calendar","done"],
  deep:           ["service","caller","addons","quote","contact","calendar","done"],
  maintenance:    ["service","caller","frequency","addons","quote","contact","calendar","done"],
  carpet:         ["service","caller","rooms","quote","contact","calendar","done"],
  hourly:         ["service","caller","hourly","addons","quote","contact","calendar","done"],
  airbnb:         ["service","caller","home","quote","contact","calendar","done"],
  custom:         ["service","caller","customDetails","contact","done"]
};

function flow(){ return rpState.service ? FLOWS[rpState.service] : ["service"]; }
function isCustomService(){ return rpState.service==="custom"; }
function stepIdx(){ const i = flow().indexOf(rpState.step); return i < 0 ? 0 : i; }


/* =========================================================================
   CALL SCRIPT
   say    — words to use, spoken naturally. Not read verbatim.
   listen — what to capture from their answer.
   watch  — the trap at this step. These protect margin and stop the crew
            being sent to a mispriced job.
   ========================================================================= */
/* =========================================================================
   SERVICE PSYCHOLOGY
   =========================================================================
   What actually motivates the purchase is different per service — a
   move-out customer is protecting a deposit, a recurring customer is
   buying back their time, an Airbnb host is protecting their rating.
   Using the generic "move-out" pitch on a recurring-cleaning caller (or
   vice versa) undersells the thing they actually care about.

   Language note: avoid assuming every caller is military/PCS-related.
   Plenty of Lawton-area movers are civilian. "Moving season" lands with
   everyone; "PCS" only lands with people who already know the acronym.
   ========================================================================= */
const SERVICE_ANGLES = {
  /* Round 19 -- Move-Out is now two services, not one service with a
     billing-mode branch. "moveout" is the guaranteed tier (Inspection
     Ready); "moveoutrefresh" is the new lighter tier. Both are plain
     strings now -- the old rpIsMoveoutHourly() function-wrapper trick
     is gone along with hourly move-out billing. */
  moveout: {
    value: "that covers the whole interior \u2014 inside the oven and fridge, inside cabinets, everything \u2014 so nothing gets flagged at the walkthrough",
    addon: "Landlords often check carpets and windows specifically at move-out, so those are worth asking about by name.",
    objection: "Most people booking a move-out are trying to protect their deposit \u2014 this is what it takes to pass a landlord's inspection.",
    urgencyNoun: "move-out slots",
    seasonNote: "our busiest moving season"
  },
  moveoutrefresh: {
    /* Ask the qualifying question FIRST on this one -- if it turns out
       there IS a landlord/PM inspection, steer them to moveout instead
       before quoting, the same way the old hourly carve-out steered
       people toward the guaranteed tier. */
    value: "that's the fast, affordable option when there's no landlord walkthrough to answer to \u2014 kitchen, bathrooms, floors, surfaces wiped down",
    addon: "If they mention a landlord or property manager checking the place afterward, stop and ask before quoting \u2014 that's Inspection Ready, not Express.",
    objection: "This one's priced lighter because it skips the deep-clean items a landlord inspection checks for \u2014 oven and fridge interiors, inside cabinets, baseboards. If there's any inspection at all, Inspection Ready is the one that protects the deposit \u2014 if something's flagged, we come back and fix it free.",
    urgencyNoun: "move-out slots",
    seasonNote: "our busiest moving season"
  },
  deep: {
    value: "that's a full top-to-bottom reset \u2014 inside the oven, baseboards, everything \u2014 not just a surface clean",
    addon: "Since everything's already getting a deep clean, a lot of people knock out carpets or windows in the same visit rather than scheduling it separately.",
    objection: "A deep clean is meant to reset the whole house at once \u2014 that's the difference between this and a regular cleaning.",
    urgencyNoun: "openings this week",
    seasonNote: "a busy stretch for deep cleans"
  },
  maintenance: {
    value: "that keeps the whole house consistently handled \u2014 kitchens, bathrooms, floors \u2014 on whatever schedule works for you",
    addon: "A lot of recurring customers add windows or laundry once they see how much time the regular visits actually free up.",
    objection: "Once this is on a schedule it's genuinely one less thing on your plate every week \u2014 that's really what you're paying for, not just the cleaning itself.",
    urgencyNoun: "recurring slots",
    seasonNote: "filling up our regular schedule"
  },
  carpet: {
    value: "that's real hot-water extraction with pre-treatment, not a rental machine or a quick surface pass",
    addon: "",
    objection: "A proper hot-water extraction gets out what a rental machine or a regular vacuum physically can't \u2014 that's the difference the price reflects.",
    urgencyNoun: "openings this week",
    seasonNote: "a busy week for carpet jobs"
  },
  hourly: {
    value: "that's our time on your priority list, in the order you set it \u2014 whatever we reach in those hours gets done right",
    addon: "",
    objection: "You're not paying for rooms you don't want touched \u2014 the whole booking goes to what you actually care about.",
    urgencyNoun: "openings this week",
    seasonNote: "a busy week",
    /* ASK THIS FIRST. Living-in-it \u2192 book Hourly Cleaning, easy. Moving out
       \u2192 be straight about the guarantee before booking. Some upgrade on the
       spot; the ones who don't were never paying the full ticket anyway, and a booked
       slot beats a lost call. */
    qualifier: "Is this a move-out, or a house you're living in?",
    guaranteeWarning: "MOVING OUT? SAY THIS: \"I can absolutely do that hourly \u2014 but I want to be straight with you: partial cleans are where deposits get lost, and only the full reset is backed by our deposit-protection guarantee. If you want it inspection-backed, that's Inspection Ready Move-Out.\"",
    scopeWarning: "GET THE PRIORITY LIST BEFORE YOU QUOTE. Most important first. Type it into notes verbatim \u2014 the crew works it in that order. Never promise the list gets finished."
  },
  airbnb: {
    value: "that's a full guest-ready turnover \u2014 kitchens, bathrooms, floors \u2014 ready before your next check-in",
    addon: "A lot of hosts add laundry or restocking once they see how tight same-day turnovers can get.",
    objection: "One bad review from a rushed turnover costs a lot more than this \u2014 that's really what you're protecting.",
    urgencyNoun: "turnover slots",
    seasonNote: "a busy stretch of back-to-back bookings"
  }
};
function angle(){ return SERVICE_ANGLES[rpState.service] || {}; }

function quoteSayLine(){
  /* Round 28 cleanup: the sqft-tier bit this used to prepend for
     moveout/moveoutrefresh/deep/maintenance was already fully dead --
     all four dropped square footage from their pricing entirely
     (moveout/moveoutrefresh in round 24, deep/maintenance back in round
     12), so rpState.sqft is never set for any of them and rpSqftTier()
     always returned null here. Removed rather than left as a silent
     no-op, since a future reader would otherwise assume it still did
     something. */
  /* This string is read OUT LOUD, verbatim, to a paying customer, so it
     has to be grammatical. It used to build "for a 3 bedrooms, 2
     bathrooms" -- pluralised nouns behind the article "a". Rendered as
     an attributive phrase instead: "for a 3-bedroom, 2-bath home". */
  const bits=[];
  if(rpState.bedrooms) bits.push(`${rpState.bedrooms}-bedroom`);
  if(rpState.bathrooms) bits.push(`${rpState.bathrooms}-bath`);
  const desc = bits.length ? `for a ${bits.join(", ")} home` : "for this job";
  const price = rpIsCustomQuoteOnly() ? "a custom quote \u2014 I'll have the office confirm the exact number before your date" : rpFormatMoneyDisplay(rpFinalPriceCents());
  const rawVal = angle().value;
  const val = (typeof rawVal === "function" ? rawVal() : rawVal) || RP_MSG.price.promiseSpoken;
  return `\u201cSo ${desc}, your total is ${price} \u2014 ${val}.\u201d`;
}
function addonsSayLine(){
  const base = "\u201cCouple things people often add \u2014 any carpet that needs professional cleaning? Junk or old furniture to haul off? Exterior windows washed? Garage floor?\u201d";
  const a = angle().addon;
  return a ? `${base} ${a}` : base;
}
function calendarSayLine(){
  const days=availableDateKeys();
  const total=days.reduce((n,d)=>n+slotsForDate(d).length,0);
  const noun=angle().urgencyNoun || "openings";
  let dayPhrase;
  if(days.length>=2) dayPhrase=`${fmtDay(days[0])} or ${fmtDay(days[1])}`;
  else if(days.length===1) dayPhrase=fmtDay(days[0]);
  else dayPhrase="a couple options coming up";
  if(total>0 && total<=6){
    return `\u201cI've got ${dayPhrase} open \u2014 and we're honestly down to just a few ${noun} this week, so if either works for you I'd grab it now.\u201d`;
  }
  return `\u201cI've got ${dayPhrase} open \u2014 which works better for you?\u201d`;
}
/* Service-aware calendar WATCH \u2014 "ask when they have to be out" is real,
   good advice for a move-out, but doesn't apply to a maintenance signup or
   a carpet job with no deadline. */
function calendarWatchLine(){
  if(["moveout","moveoutrefresh"].includes(rpState.service)) return "Move-outs are deadline-driven. Ask when they have to be out by, and work backward from there.";
  if(rpState.service==="deep" || rpState.service==="maintenance") return "Ask if there's an event or date they're working around \u2014 otherwise just offer your two soonest openings.";
  return "Offer your two soonest real openings \u2014 no deadline to work around here, so don't invent one.";
}
function csrGreetingName(){ return rpState.csrName || "the team"; }
function doneSayLine(){
  if(isCustomService()) return `\u201cThanks for the details \u2014 we'll follow up shortly to schedule a look or request some photos, and get you a firm quote.\u201d`;
  return `\u201cYou're all set for ${rpState.bookedAt||"the time we picked"}. You'll get a text confirmation in just a second \u2014 and if anything comes up before then, have them call back and ask for ${csrGreetingName()}.\u201d`;
}


/* =========================================================================
   WHAT SHE SAYS, AND ONE LINE ABOUT IT
   =========================================================================
   1.0 split coaching three ways — SAY / LISTEN / WATCH — and LISTEN and
   WATCH were not a real distinction; both meant "coaching," so under
   pressure there was no way to know which box held the thing you needed.
   Worse, the same instruction was often printed three or four times on one
   screen. On the add-ons screen, "ask them by name" appeared as the
   subtitle, in LISTEN, inside a 100-word WATCH paragraph, AND in a
   guardrail box.

   Now: `say` is the line, verbatim, and it is the only thing on screen by
   default. `coach` is one short paragraph, collapsed, one keypress away.
   Anything conditional — do not quote this job, the address read-back, the
   tier-switch math — stays in guardrails(), which only fire when they
   actually apply, so they keep earning their space.
   ========================================================================= */
const LINES = {
  service:{
    say:()=>`“Thanks for calling Red Prairie Cleaning, this is ${csrGreetingName()} — what can we help you with today?”`,
    coach:"Let them describe it in their own words first — people move for all kinds of reasons, so don't assume military and don't assume not. <b>If it's a move-out, ask now, before anything else: is a landlord, property manager or inspector going to walk through and check the place against a list?</b> You're noting the lean, not picking a tier — real numbers come three screens from now."
  },
  caller:{
    say:"“Happy to help with that — let me grab your name and a good number in case we get cut off.”",
    coach:"The most important screen in the console. If the call drops after this you still have a lead you can call back. If it drops before, you have nothing."
  },
  home:{
    say:"“Let me get a couple of quick details on the place — how many bedrooms, and how many full bathrooms?”",
    coach:"Bedrooms only — an office counts if <em>they'd</em> call it a bedroom. Full baths only; “two and a half” is 2, and half-baths aren't priced separately so don't make a thing of it. Then the three checks: water, A/C, mold or pests. If any of them fail, the job can't be booked as normal and you do not quote a price."
  },
  tiers:{
    say:()=>{
      const ir=rpMoveoutTierBasePrice("moveout"), rf=rpMoveoutTierBasePrice("moveoutrefresh");
      const fmt=p=>p===null?"a custom quote":`$${p.toFixed(0)}`;
      return `“For a home like that I can do it two ways — Inspection Ready at ${fmt(ir)}, which protects your deposit if anyone inspects afterward, or Move-Out Express at ${fmt(rf)} if nobody's checking. Which sounds like the fit?”`;
    },
    /* Round 33: the deposit figure for THIS home, handed to her at the
       moment she recommends a tier. It is the argument that reframes a
       price-sensitive caller, and it only renders once bedrooms are known. */
    coach:()=>{
      const d = RP_MSG.deposit.for(rpState.bedrooms);
      const lead = d
        ? `<b>On this home the deposit is usually ${d.amount}.</b> Say that before the price if they sound price-sensitive — it reframes the whole call. `

/* Hourly is the one service where a CSR can create real downstream risk —
   a partial clean sold to someone who then fails a move-out inspection. The
   qualifier and the guarantee carve-out get forced into the line itself at
   the steps where they matter, same as 1.0 did. */
function lineFor(step){
  const e = LINES[step];
  if(!e) return null;
  const out = {
    say: typeof e.say==="function" ? e.say() : e.say,
    coach: typeof e.coach==="function" ? e.coach() : e.coach
  };
  const a = angle();
  if(rpState.service==="hourly"){
    if(step==="hourly" && a.qualifier) out.say = `“${a.qualifier}” — then: ` + out.say;
    if(step==="hourly" && a.guaranteeWarning) out.coach = `<b>${a.guaranteeWarning}</b> ` + out.coach;
    if((step==="contact"||step==="quote") && a.scopeWarning) out.coach = `<b>${a.scopeWarning}</b> ` + out.coach;
  }
  return out;
}

/* =========================================================================
   GUARDRAILS — the dummy-proofing layer. "stop" blocks the Next button.
   ========================================================================= */
function guardrails(){
  const g=[], s=rpState.step;
  if(rpIsCustomQuoteOnly() && ["quote","contact","calendar"].includes(s))
    g.push({level:"stop",title:"Do not quote a price",
      body:"This job is custom-quote only. Book the visit, tell them the office confirms pricing before the cleaning date, and do NOT say a dollar amount out loud \u2014 even a rough one. A number said on the phone is the number they expect."});
  if(["home","tiers","addons","quote"].includes(s) && rpMoveoutBlocked())
    g.push({level:"stop",title:"Do not give a price on this call",
      body:`${rpMoveoutBlockReasons().join(", ")}. Tell the customer we need to sort this out before we can book \u2014 take their name and number, log the call as a custom quote / callback needed, and have the office follow up. Do not continue toward a quote.`});
  if(rpState.militaryDiscount && !rpState.militaryVerified)
    g.push({level:"warn",title:"Military discount not confirmed",
      body:"Ask: \u201cAre you active duty, retired, or a first responder?\u201d then tick the confirm box. Don't apply it just because they're calling from Lawton."});
  if(s==="contact" && rpState.address1 && !rpState.addressReadBack)
    g.push({level:"warn",title:"Read the address back",
      body:"Say the full address out loud and have them confirm before continuing. Wrong address is the #1 cause of a wasted crew trip."});
  /* Console 2.0: the "Say it, then stop" and "Ask all three by name" info
     guardrails that used to live here are gone. Both are unconditional
     advice about the current step, and both are now the first sentence of
     that step's Coach line -- printing them a second time in a coloured box
     was exactly the duplication this rewrite exists to remove. Guardrails
     are for things that are only true SOMETIMES: this job can't be quoted,
     the address wasn't read back, the tier maths just flipped.  */
  /* Round 25 (direct instruction: "I need to make money and the
     expectations need to be clear" -- and the pricing itself was built so
     buying every excluded-scope add-on on Express always costs MORE than
     switching tiers outright, by design; see rpDetailPassPrice()'s
     comment in the engine). Nothing used to say this out loud, so a
     caller could stack fridge + oven + cabinets + Detail Pass on Express
     and end up paying more than Inspection Ready for LESS scope and no
     guarantee -- worse for them, and it undersells the tier that's
     actually the better fit. Computed live off the same base-price
     function /book and /pricing use, so it can't drift out of sync with
     the real numbers. */
  /* Round 35b: this used to test rpAddonsTotal() — EVERY add-on. Only the
     four buy-backs (oven, fridge, cabinets, Detail Pass) are scope
     Inspection Ready already includes; carpet, windows, garage and junk
     cost the same on both tiers and travel with the customer through a
     switch. On a 3-bedroom carrying $300 of carpet and garage the old test
     fired and told the CSR that Inspection Ready was "$499 for the same
     home" when the real figure was $799. Basis is now
     rpExpressBuyBackTotal(), and the body names the carried-over add-ons
     so the number said out loud is the number they would actually pay. */
  if(["addons","quote"].includes(s) && rpState.service==="moveoutrefresh" && !rpIsCustomQuoteOnly()){
    const irPrice=rpMoveoutTierBasePrice("moveout"), rfPrice=rpMoveoutTierBasePrice("moveoutrefresh");
    const buyBacks=rpExpressBuyBackTotal(), carried=rpTierNeutralAddonTotal();
    if(irPrice!==null && rfPrice!==null && irPrice>rfPrice && buyBacks>=(irPrice-rfPrice)){
      const nowAt=rfPrice+buyBacks+carried, switched=irPrice+carried;
      const carriedNote = carried>0
        ? ` The other $${carried.toFixed(0)} of add-ons costs the same either way, so it carries over.`
        : "";
      g.push({level:"info",title:"Inspection Ready is now the better deal",
        body:`Express with these comes to $${nowAt.toFixed(0)}. The same home on Inspection Ready is $${switched.toFixed(0)} — fully guaranteed, nothing left out.${carriedNote} Worth saying: “At this point Inspection Ready actually comes out even or cheaper, and it's backed by Defend Your Deposit — want me to switch it?”`});
    }
  }
  return g;
}

/* ---------- Validation ---------- */
function normalizePhone(v){ return String(v||"").replace(/\D/g,"").slice(0,10); }
function phoneOk(v){ return normalizePhone(v).length===10; }
function emailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim()); }


/* ---------- Validation (merged steps) ---------- */
function stepValid(){
  switch(rpState.step){
    case "caller":    return rpState.fullName.trim().length>1 && phoneOk(rpState.phone);
    case "service":   return !!rpState.service;
    case "home":      return !!rpState.bedrooms && !!rpState.bathrooms
                        && (["moveout","moveoutrefresh"].includes(rpState.service) ? rpMoveoutQuestionnaireAnswered() : true);
    case "tiers":     return !!rpState.moveoutTierChosen;
    case "frequency": return !!rpState.frequency;
    case "rooms":     return Number(rpState.carpetRooms)>0;
    case "hourly":    return !!rpState.cleanerCount && !!rpState.hourCount;
    case "addons":    return true;
    case "quote":     return rpState.quotedAloud;
    case "contact":   return rpState.address1.trim().length>2 && rpState.city.trim().length>1
                        && /^\d{5}$/.test(rpState.postalCode.trim())
                        && (rpState.email==="" || emailOk(rpState.email))
                        && rpState.addressReadBack;
    case "calendar":  return !!rpState.selectedStartTime;
    default:          return true;
  }
}
