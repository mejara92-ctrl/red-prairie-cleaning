<style>
:root {
  --red: #9f2027;
  --red-bright: #bd3036;
  --red-dark: #6f1118;
  --ink: #181512;
  --ink-soft: #37312b;
  --muted: #71685f;
  --faint: #9d9287;
  --paper: #f7f1e7;
  --paper-deep: #eadfce;
  --surface: #fffdf9;
  --surface-strong: #ffffff;
  --line: rgba(70, 52, 37, .14);
  --line-strong: rgba(70, 52, 37, .25);
  --gold: #c6a164;
  --gold-soft: #eee0c4;
  --sage: #6f806f;
  --green: #2f7448;
  --header-h: 62px;
  --radius-lg: 26px;
  --radius-md: 18px;
  --shadow-lg: 0 28px 80px rgba(48, 32, 19, .18);
  --shadow-md: 0 14px 34px rgba(48, 32, 19, .10);
  --shadow-sm: 0 7px 18px rgba(48, 32, 19, .07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 12%, rgba(198,161,100,.24), transparent 30%),
    radial-gradient(circle at 88% 85%, rgba(159,32,39,.14), transparent 34%),
    linear-gradient(135deg, #ece4d7 0%, #ddd1c0 100%);
  line-height: 1.45;
  overflow: hidden;
  position: fixed;
  inset: 0;
  width: 100%;
  font-synthesis-weight: none;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.10'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}
a { text-decoration: none; color: inherit; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(159,32,39,.24);
  outline-offset: 3px;
}

/* ============ APP SHELL ============ */
.rp-app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 610px;
  margin: 0 auto;
  background: var(--paper);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.rp-app::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(680px 420px at 115% -8%, rgba(198,161,100,.20), transparent 64%),
    radial-gradient(620px 500px at -18% 112%, rgba(159,32,39,.10), transparent 67%);
}
@media (min-width: 670px) {
  .rp-app {
    height: calc(100dvh - 36px);
    margin: 18px auto;
    border: 1px solid rgba(255,255,255,.62);
    border-radius: 34px;
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.65);
  }
}

/* Header */
.rp-head {
  height: var(--header-h);
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  z-index: 20;
  background: rgba(247,241,231,.84);
  border-bottom: 1px solid rgba(70,52,37,.08);
  backdrop-filter: blur(18px) saturate(1.25);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
}
.rp-head-btn {
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.50);
  border: 1px solid rgba(70,52,37,.10);
  border-radius: 14px;
  transition: background .18s, opacity .2s, transform .18s;
}
.rp-head-btn:active { background: var(--surface); transform: scale(.95); }
.rp-head-btn.is-hidden { opacity: 0; pointer-events: none; }
.rp-wordmark { height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.rp-wordmark img { width: 30px; height: 30px; display: block; border-radius: 9px; box-shadow: 0 5px 12px rgba(159,32,39,.18); }
.rp-wordmark span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.rp-wordmark strong { font-size: 13px; font-weight: 800; letter-spacing: .075em; color: var(--ink); white-space: nowrap; }
.rp-wordmark strong b { color: var(--red); }
.rp-wordmark small { margin-top: 4px; font-size: 7px; font-weight: 800; letter-spacing: .28em; color: var(--muted); }
.rp-head-text {
  font-size: 12px; font-weight: 800; letter-spacing: .02em;
  color: var(--red);
  padding: 9px 11px;
  border-radius: 12px;
  border: 1px solid rgba(159,32,39,.14);
  background: rgba(255,255,255,.45);
  transition: background .18s, transform .18s;
}
.rp-head-text:active { background: var(--surface); transform: scale(.96); }

/* Progress */
.rp-progress {
  position: relative;
  z-index: 21;
  height: 4px;
  margin: 0;
  background: rgba(70,52,37,.09);
  overflow: hidden;
}
.rp-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--red-dark), var(--red-bright) 72%, #df765f);
  box-shadow: 0 0 18px rgba(189,48,54,.46);
  transition: width .48s cubic-bezier(.22,.8,.25,1);
}

/* Screens */
.rp-screens { flex: 1; position: relative; overflow: hidden; }
.rp-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background:
    radial-gradient(620px 400px at 108% -8%, rgba(198,161,100,.14), transparent 62%),
    radial-gradient(620px 420px at -12% 110%, rgba(159,32,39,.07), transparent 63%),
    linear-gradient(180deg, #fbf7f0 0%, var(--paper) 100%);
}
.rp-screen-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 22px 26px 30px;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(159,32,39,.22) transparent;
}
.rp-screen-scroll::-webkit-scrollbar { width: 5px; }
.rp-screen-scroll::-webkit-scrollbar-thumb { background: rgba(159,32,39,.22); border-radius: 99px; }
.rp-center { margin-block: auto; width: 100%; max-width: 510px; align-self: center; }
.rp-screen-footer {
  position: relative;
  z-index: 5;
  padding: 12px 26px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(247,241,231,1) 76%, rgba(247,241,231,.92) 86%, rgba(247,241,231,0));
}
.rp-screen-footer::before {
  content: "";
  position: absolute;
  left: 26px; right: 26px; top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(70,52,37,.12), transparent);
}

@media (prefers-reduced-motion: no-preference) {
  .rp-screen.enter-forward { animation: rpInFwd .42s cubic-bezier(.22,.86,.28,1) both; }
  .rp-screen.exit-forward  { animation: rpOutFwd .34s cubic-bezier(.4,0,.6,1) both; }
  .rp-screen.enter-back    { animation: rpInBack .42s cubic-bezier(.22,.86,.28,1) both; }
  .rp-screen.exit-back     { animation: rpOutBack .34s cubic-bezier(.4,0,.6,1) both; }
  .rp-screen.enter-forward .rp-center > *,
  .rp-screen.enter-back .rp-center > * { animation: rpRise .46s cubic-bezier(.22,.86,.28,1) both; }
  .rp-screen.enter-forward .rp-center > *:nth-child(2), .rp-screen.enter-back .rp-center > *:nth-child(2) { animation-delay: .035s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(3), .rp-screen.enter-back .rp-center > *:nth-child(3) { animation-delay: .07s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(4), .rp-screen.enter-back .rp-center > *:nth-child(4) { animation-delay: .105s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(5), .rp-screen.enter-back .rp-center > *:nth-child(5) { animation-delay: .14s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(n+6), .rp-screen.enter-back .rp-center > *:nth-child(n+6) { animation-delay: .175s; }
  .rp-primary::after { transition: transform .22s ease; }
  .rp-primary:hover::after { transform: translateX(4px); }
}
@keyframes rpInFwd  { from { transform: translate3d(34px,0,0) scale(.985); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes rpOutFwd { from { transform: none; opacity: 1; } to { transform: translate3d(-18px,0,0) scale(.992); opacity: 0; } }
@keyframes rpInBack { from { transform: translate3d(-34px,0,0) scale(.985); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes rpOutBack{ from { transform: none; opacity: 1; } to { transform: translate3d(18px,0,0) scale(.992); opacity: 0; } }
@keyframes rpRise   { from { transform: translateY(13px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ============ TYPE ============ */
.rp-eyebrow {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  gap: 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .17em;
  text-transform: uppercase;
  color: var(--red);
  margin: 0 0 11px;
}
.rp-eyebrow::before {
  content: "";
  width: 24px;
  height: 1px;
  background: currentColor;
  opacity: .55;
}
.rp-eyebrow.red { color: #f4c9b6; }
h1, h2 {
  font-family: "DM Serif Display", Georgia, "Times New Roman", serif;
  font-weight: 400;
  color: var(--ink);
  text-wrap: balance;
}
h1 { font-size: clamp(31px, 7vw, 42px); line-height: 1.02; letter-spacing: -.028em; margin: 0 0 14px; }
h2 { font-size: clamp(31px, 7.2vw, 39px); line-height: 1.04; letter-spacing: -.025em; margin: 0 0 9px; }
.rp-sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 20px; max-width: 430px; }
.rp-q-gap { height: 12px; }

/* Icons */
.rp-ic { width: 20px; height: 20px; display: block; }
.rp-ic-chip {
  width: 44px; height: 44px; min-width: 44px;
  border-radius: 15px;
  background: linear-gradient(145deg, #fffdf9, #eee5d8);
  border: 1px solid rgba(70,52,37,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 5px 12px rgba(48,32,19,.06);
  display: flex; align-items: center; justify-content: center;
  color: var(--red);
  transition: transform .2s ease, background .2s ease, color .2s ease;
}
.rp-ic-sm { width: 15px; height: 15px; }

/* Full-bleed photo background */
.rp-screen.has-photo-bg { background: #17120f; }
.rp-bg-photo { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.rp-bg-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.012); }
.rp-bg-photo::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg, rgba(18,13,10,.76) 0%, rgba(18,13,10,.46) 32%, rgba(18,13,10,.14) 55%, rgba(18,13,10,.24) 100%),
    linear-gradient(120deg, rgba(111,17,24,.25), transparent 56%);
}
.rp-bg-photo::after {
  content: "";
  position: absolute; inset: 0;
  z-index: 2;
  background: radial-gradient(circle at 78% 12%, rgba(234,185,123,.22), transparent 34%);
  mix-blend-mode: screen;
}
.rp-screen.has-photo-bg .rp-screen-scroll { position: relative; z-index: 3; padding: 18px 20px 22px; }

.rp-hero-onphoto { padding: 5px 5px 112px; max-width: 500px; }
.rp-hero-onphoto .rp-eyebrow.red { color: #f4d4c5; text-shadow: 0 1px 14px rgba(0,0,0,.34); }
.rp-hero-onphoto h1 { color: #fffaf3; text-shadow: 0 3px 22px rgba(0,0,0,.34); max-width: 480px; }
.rp-hero-onphoto .rp-trust { color: rgba(255,255,255,.94); }
.rp-hero-onphoto .rp-trust span, .rp-hero-onphoto .rp-trust a {
  background: rgba(255,255,255,.13);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid rgba(255,255,255,.24);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.rp-hero-onphoto .rp-trust .rp-ic-sm { color: #fff; }
.rp-hero-onphoto .rp-trust .amber { color: #ffd983; }

.rp-sheet {
  position: relative;
  background: rgba(255,253,249,.97);
  border: 1px solid rgba(255,255,255,.74);
  border-radius: 30px;
  margin: -84px 0 0;
  padding: 18px 16px 16px;
  box-shadow: 0 26px 62px rgba(14,10,7,.26), inset 0 1px 0 #fff;
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
}
.rp-sheet::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(400px 190px at 95% 0%, rgba(198,161,100,.12), transparent 62%);
}
.rp-sheet-handle {
  width: 38px; height: 4px; border-radius: 999px;
  background: linear-gradient(90deg, var(--red), var(--gold));
  margin: 0 auto 14px;
  opacity: .72;
}
.rp-sheet .rp-start-service-q {
  position: relative;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: 20px; font-weight: 400; letter-spacing: -.01em;
  margin: 0 2px 13px;
}

/* Trust line */
.rp-trust {
  display: flex; flex-wrap: wrap; align-items: center;
  column-gap: 7px; row-gap: 7px;
  margin: 0;
  font-size: 10.5px; font-weight: 700; color: var(--muted);
}
.rp-trust span, .rp-trust a {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 9px;
  border-radius: 999px;
}
.rp-trust .amber { color: #d49a24; }
.rp-trust .rp-ic-sm { color: var(--ink); }

/* ============ OPTION ROWS ============ */
.rp-rows { display: grid; gap: 10px; }
.rp-row {
  width: 100%;
  min-height: 66px;
  display: flex; align-items: center; gap: 13px;
  background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(255,252,247,.84));
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 11px 14px;
  text-align: left;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.95);
  transition: border-color .18s, transform .16s, background .18s, box-shadow .18s;
  position: relative;
  overflow: visible;
}
.rp-row::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,.50) 43%, transparent 62%);
  transform: translateX(-120%);
  transition: transform .58s ease;
}
.rp-row:hover { border-color: rgba(159,32,39,.33); box-shadow: 0 13px 28px rgba(48,32,19,.11); transform: translateY(-1px); }
.rp-row:hover::after { transform: translateX(120%); }
.rp-row:hover .rp-ic-chip { transform: scale(1.04); }
.rp-row:active { transform: scale(.982); border-color: var(--red); }
.rp-row.is-featured {
  border-color: rgba(159,32,39,.48);
  background: linear-gradient(145deg, #fffdf9, #fff5f1);
  box-shadow: 0 13px 30px rgba(127,25,31,.11), inset 3px 0 0 var(--red);
}
.rp-row.is-selected {
  border-color: var(--red);
  background: linear-gradient(145deg, #fff9f6, #f9e9e5);
  box-shadow: 0 12px 28px rgba(159,32,39,.13), inset 3px 0 0 var(--red);
}
.rp-row.is-selected .rp-ic-chip { background: linear-gradient(145deg, var(--red-bright), var(--red-dark)); color: white; }
.rp-row-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
.rp-row-title { font-size: 14.5px; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; display: block; }
.rp-row-desc { font-size: 11.5px; color: var(--muted); line-height: 1.38; display: block; margin-top: 2px; }
.rp-row-val { font-size: 15px; font-weight: 800; color: var(--ink); white-space: nowrap; position: relative; z-index: 1; }
.rp-row-val small { display: block; font-size: 10px; font-weight: 800; color: var(--red); text-align: right; }
.rp-row-chev {
  width: 28px; height: 28px; min-width: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--red);
  border-radius: 999px;
  background: rgba(159,32,39,.07);
  position: relative; z-index: 1;
}
.rp-row .badge {
  position: absolute; top: -9px; right: 13px; z-index: 3;
  background: linear-gradient(135deg, var(--ink), #41382f);
  color: #fff8eb;
  border: 1px solid rgba(198,161,100,.45);
  box-shadow: 0 5px 14px rgba(24,21,18,.18);
  font-size: 8.5px; font-weight: 800; letter-spacing: .12em;
  padding: 4px 9px; border-radius: 999px; text-transform: uppercase;
}
.rp-row-sum { font-size: 11.5px; font-weight: 800; color: var(--red); text-align: right; white-space: nowrap; position: relative; z-index: 1; }
.rp-row-sum em { font-style: normal; display: block; color: var(--faint); font-weight: 700; font-size: 9.5px; margin-top: 2px; }

/* Start screen service rows stay compact */
.rp-sheet .rp-rows { gap: 8px; }
.rp-sheet .rp-row { min-height: 61px; padding: 9px 11px; border-radius: 16px; }
.rp-sheet .rp-ic-chip { width: 39px; height: 39px; min-width: 39px; border-radius: 13px; }
.rp-sheet .rp-row-title { font-size: 13.5px; }
.rp-sheet .rp-row-desc { font-size: 10.5px; }

/* Expanded add-on */
.rp-expand {
  border: 1px solid rgba(159,32,39,.42);
  border-radius: 20px;
  overflow: hidden;
  background: rgba(255,253,249,.94);
  box-shadow: 0 14px 34px rgba(48,32,19,.10), inset 3px 0 0 var(--red);
}
.rp-expand-head {
  width: 100%; display: flex; align-items: center; gap: 12px;
  background: none; border: none; padding: 12px 14px; text-align: left;
}
.rp-expand-head .rp-row-title { flex: 1; }
.rp-expand-body { padding: 0 14px 15px; }
.rp-tap-note { font-size: 12.5px; color: var(--muted); margin: 2px 0 11px; }

/* Pills */
.rp-pill-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 8px; }
.rp-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rp-pill {
  background: rgba(255,255,255,.90);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 11px 7px;
  font-weight: 800; font-size: 14px; line-height: 1.3;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.95);
  transition: border-color .15s, transform .12s, background .15s, color .15s;
}
.rp-pill small { display: block; font-weight: 650; font-size: 10.5px; color: var(--muted); }
.rp-pill:active { transform: scale(.96); border-color: var(--red); }
.rp-pill.is-selected { border-color: var(--red); background: linear-gradient(145deg, var(--red-bright), var(--red-dark)); color: #fff; }
.rp-pill.is-selected small { color: rgba(255,255,255,.78); }
.rp-choice-grid .rp-pill { font-size: 13px; padding: 11px 8px; }

/* Checkbox cards */
.rp-checkbox-card {
  display: flex; gap: 12px; align-items: flex-start;
  background: rgba(255,253,249,.88);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 13px 14px;
  cursor: pointer;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.9);
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.rp-checkbox-card:active { border-color: var(--red); transform: scale(.99); }
.rp-checkbox-card input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--red); flex-shrink: 0; }
.rp-checkbox-card strong { display: block; font-size: 14px; line-height: 1.35; }
.rp-checkbox-card span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
.rp-discount-card { border-color: rgba(198,161,100,.45); background: linear-gradient(145deg, #fffdf8, #fbf3df); }
.rp-mt { margin-top: 10px; }

/* Help hint */
.rp-help {
  font-size: 12.5px; color: var(--muted);
  background: rgba(255,255,255,.55);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 13px; margin: 0 0 16px;
}

/* Buttons */
.rp-primary {
  width: 100%; min-height: 54px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, var(--red-bright) 0%, var(--red) 48%, var(--red-dark) 100%);
  color: #fffaf5;
  border: 1px solid rgba(111,17,24,.25);
  border-radius: 17px;
  padding: 15px 20px;
  font-size: 15px; font-weight: 800; letter-spacing: -.01em;
  box-shadow: 0 14px 28px rgba(127,25,31,.27), inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .13s, filter .15s, box-shadow .15s;
  position: relative;
  overflow: hidden;
}
.rp-primary::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(110deg, transparent 15%, rgba(255,255,255,.18) 44%, transparent 68%);
  transform: translateX(-120%);
  transition: transform .65s ease;
}
.rp-primary::after { content: "→"; font-size: 19px; line-height: 1; position: relative; }
.rp-primary:hover { filter: brightness(1.04); box-shadow: 0 17px 35px rgba(127,25,31,.32), inset 0 1px 0 rgba(255,255,255,.22); }
.rp-primary:hover::before { transform: translateX(120%); }
.rp-primary:active { transform: scale(.982); filter: brightness(.96); }
.rp-primary:disabled { opacity: .58; filter: grayscale(.2); }
.rp-footer-note { text-align: center; font-size: 10.5px; color: var(--faint); margin: 9px 0 0; }
.rp-fineprint { position: relative; font-size: 10.5px; color: var(--muted); margin: 12px 3px 0; line-height: 1.45; }
.rp-fineprint a, .rp-footer-note a { color: var(--red); font-weight: 800; }

/* Live estimate */
.rp-live-chip {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11.5px; color: var(--muted); font-weight: 700;
  margin: 0 3px 10px;
}
.rp-live-chip span { display: inline-flex; align-items: center; gap: 7px; }
.rp-live-chip span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sage); box-shadow: 0 0 0 4px rgba(111,128,111,.12); }
.rp-live-chip strong { font-family: "DM Serif Display", Georgia, serif; font-size: 23px; color: var(--ink); font-weight: 400; }

/* ============ ESTIMATE ============ */
.rp-quote-band {
  position: relative;
  margin: -22px -26px 20px;
  padding: 37px 28px 30px;
  border-radius: 0 0 32px 32px;
  background:
    radial-gradient(circle at 82% 12%, rgba(223,163,116,.46), transparent 26%),
    radial-gradient(circle at 13% 88%, rgba(198,161,100,.18), transparent 32%),
    linear-gradient(150deg, #731219 0%, #9f2027 44%, #2b1916 100%);
  overflow: hidden;
  text-align: center;
  box-shadow: 0 19px 44px rgba(90,24,27,.22);
}
.rp-quote-band::before {
  content: "";
  position: absolute; inset: 12px;
  border: 1px solid rgba(255,237,209,.20);
  border-radius: 22px;
  pointer-events: none;
}
.rp-quote-band::after {
  content: "RP";
  position: absolute;
  right: -7px; bottom: -38px;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: 132px;
  line-height: 1;
  color: rgba(255,255,255,.045);
  letter-spacing: -.08em;
}
.rp-quote-hero { position: relative; z-index: 1; padding: 3px 0 0; }
.rp-quote-hero small {
  display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .20em;
  text-transform: uppercase; color: rgba(255,247,236,.64); margin-bottom: 6px;
}
.rp-quote-hero strong {
  display: block;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: clamp(59px, 15vw, 76px);
  font-weight: 400;
  letter-spacing: -.04em;
  line-height: .98;
  color: #fffaf3;
  text-shadow: 0 4px 22px rgba(35,8,9,.22);
}
.rp-quote-hero.is-quote strong { font-size: 39px; padding: 9px 0; letter-spacing: -.02em; }
.rp-quote-hero span { display: block; font-size: 12px; font-weight: 700; color: rgba(255,247,236,.76); margin-top: 8px; }
.rp-guarantee {
  position: relative; z-index: 1;
  width: fit-content;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 10.5px; font-weight: 800; color: #fff5dd;
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 999px;
  padding: 8px 11px;
  margin: 18px auto 0;
  backdrop-filter: blur(8px);
}
.rp-guarantee .rp-ic-sm { color: #f0cf91; }
.rp-invoice {
  background: rgba(255,253,249,.90);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 16px;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.92);
}
.rp-mini-row {
  display: flex; justify-content: space-between; gap: 12px;
  font-size: 12.5px; padding: 10px 0;
  border-bottom: 1px solid rgba(70,52,37,.08);
}
.rp-mini-row:last-child { border-bottom: none; }
.rp-mini-row span { color: var(--muted); }
.rp-mini-row strong { text-align: right; font-weight: 800; }
.rp-discount-row strong { color: var(--green); }
.rp-notice { font-size: 10.5px; color: var(--faint); margin: 13px 2px 0; line-height: 1.55; }
details.rp-includes {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 0 15px;
  margin-top: 10px;
  background: rgba(255,253,249,.72);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
}
details.rp-includes summary {
  font-weight: 800; font-size: 13px; padding: 14px 0; cursor: pointer; list-style: none;
  display: flex; justify-content: space-between; align-items: center;
}
details.rp-includes summary::-webkit-details-marker { display: none; }
details.rp-includes summary::after { content: "+"; color: var(--red); font-size: 21px; font-weight: 400; }
details.rp-includes[open] summary::after { content: "–"; }
details.rp-includes p { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.6; }

/* ============ LEAD FORM ============ */
.rp-lead-form { display: grid; gap: 9px; }
.rp-lead-field label {
  display: block;
  font-size: 9.5px; font-weight: 800; letter-spacing: .10em; text-transform: uppercase;
  margin: 0 0 5px 2px; color: var(--muted);
}
.rp-lead-field input, .rp-lead-field textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 11px 13px;
  font: inherit; font-size: 15px; font-weight: 600;
  color: var(--ink);
  background: rgba(255,253,249,.92);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 5px 13px rgba(48,32,19,.04);
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.rp-lead-field input::placeholder, .rp-lead-field textarea::placeholder { color: #aaa096; font-weight: 500; }
.rp-lead-field input:focus, .rp-lead-field textarea:focus {
  outline: none;
  border-color: rgba(159,32,39,.58);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(159,32,39,.08), inset 0 1px 0 rgba(255,255,255,.9);
}
.rp-lead-field textarea { min-height: 54px; resize: vertical; }
.rp-lead-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 9px; }
.rp-lead-row-contact { grid-template-columns: 1fr 1.05fr; }
.rp-error {
  display: none;
  background: #fbe8e5; color: #8d1d22;
  border: 1px solid rgba(159,32,39,.16);
  font-size: 12px; font-weight: 700;
  border-radius: 14px; padding: 10px 13px; margin-top: 11px;
}
.rp-privacy-note {
  font-size: 10.5px; color: var(--faint); margin: 12px 2px 0;
  display: flex; gap: 6px; align-items: flex-start; line-height: 1.5;
}
.rp-privacy-note .rp-ic-sm { min-width: 15px; margin-top: 1px; color: var(--sage); }

/* Calendar */
.rp-booking-widget {
  margin: 0 -6px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-md);
}
.rp-booking-widget iframe { width: 100%; border: none; min-height: 720px; background: #fff; }

/* Compact-height safeguards */
@media (max-height: 760px) {
  :root { --header-h: 56px; }
  .rp-screen-scroll { padding-top: 12px; padding-bottom: 15px; }
  .rp-screen-footer { padding-top: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  h1 { font-size: 28px; }
  h2 { font-size: 29px; margin-bottom: 6px; }
  .rp-sub { margin-bottom: 13px; line-height: 1.42; }
  .rp-row { min-height: 55px; padding-top: 8px; padding-bottom: 8px; }
  .rp-rows { gap: 7px; }
  .rp-hero-onphoto { padding-bottom: 90px; }
  .rp-sheet { margin-top: -73px; padding-top: 12px; padding-bottom: 12px; }
  .rp-sheet .rp-sheet-handle { margin-bottom: 10px; }
  .rp-sheet .rp-start-service-q { margin-bottom: 10px; font-size: 18px; }
  .rp-sheet .rp-row { min-height: 51px; }
  .rp-sheet .rp-row-desc { display: none; }
  .rp-sheet .rp-fineprint { display: none; }
  .rp-primary { min-height: 50px; padding-top: 12px; padding-bottom: 12px; }
  .rp-live-chip { margin-bottom: 7px; }
  .rp-footer-note { display: none; }
  .rp-quote-band { margin-top: -12px; margin-bottom: 12px; padding: 24px 20px 20px; border-radius: 0 0 25px 25px; }
  .rp-quote-band::before { inset: 8px; }
  .rp-quote-hero strong { font-size: 52px; }
  .rp-quote-hero span { margin-top: 4px; }
  .rp-guarantee { margin-top: 12px; padding: 6px 9px; }
  .rp-invoice { padding: 3px 13px; }
  .rp-mini-row { padding: 7px 0; font-size: 11.5px; }
  details.rp-includes { margin-top: 7px; }
  details.rp-includes summary { padding: 10px 0; }
  .rp-checkbox-card { padding: 10px 12px; }
  .rp-notice { margin-top: 8px; font-size: 9.5px; line-height: 1.4; }
  .rp-lead-form { gap: 6px; }
  .rp-lead-field label { margin-bottom: 3px; }
  .rp-lead-field input, .rp-lead-field textarea { padding: 9px 11px; }
  .rp-lead-field textarea { min-height: 43px; }
  .rp-privacy-note { margin-top: 7px; font-size: 9.5px; }
}
@media (max-width: 390px) {
  .rp-head { padding-inline: 9px; }
  .rp-wordmark { gap: 7px; }
  .rp-wordmark img { width: 28px; height: 28px; }
  .rp-wordmark strong { font-size: 12px; }
  .rp-screen-scroll { padding-left: 20px; padding-right: 20px; }
  .rp-screen-footer { padding-left: 20px; padding-right: 20px; }
  .rp-screen-footer::before { left: 20px; right: 20px; }
  .rp-row { gap: 10px; padding-left: 11px; padding-right: 11px; }
  .rp-row-title { font-size: 14px; }
  .rp-row-desc { font-size: 11px; }
  .rp-sheet { padding-left: 13px; padding-right: 13px; }
  .rp-sheet .rp-row-title { font-size: 13px; }
}

/* ========================================================================
   MASTERPIECE V8 — Red Prairie Atelier consultation system
   Richer choice architecture, custom emblem cards, stage-specific scenery.
   ======================================================================== */
:root{
  --wine:#8f1822;
  --wine-deep:#5c0e15;
  --wine-bright:#c9343d;
  --clay:#c7735c;
  --champagne:#d8b77b;
  --cream:#fffaf1;
  --cream-deep:#f0dfc9;
  --forest:#526451;
}

/* Make every interior step feel like a designed room, not a blank form. */
.rp-screen:not(.step-service){
  background:
    radial-gradient(110% 76% at 94% -8%,rgba(216,183,123,.34),transparent 54%),
    radial-gradient(94% 64% at -15% 104%,rgba(143,24,34,.17),transparent 58%),
    linear-gradient(156deg,#fffaf1 0%,#f7ecdd 48%,#ead7c1 100%);
}
.rp-screen:not(.step-service)::before{
  opacity:1;
  background:
    linear-gradient(180deg,rgba(255,251,244,.85),rgba(250,241,228,.91)),
    url('/images/hero/front-photo-fullbleed-648.webp') center 34%/cover no-repeat;
  filter:saturate(.82) contrast(.96);
}
.rp-screen:not(.step-service)::after{
  inset:0;
  height:auto;
  z-index:-1;
  background:
    radial-gradient(circle at 84% 20%,rgba(255,255,255,.76) 0 8%,transparent 8.5%),
    radial-gradient(circle at 17% 80%,rgba(199,115,92,.11) 0 14%,transparent 14.5%),
    repeating-radial-gradient(ellipse at 110% 112%,transparent 0 45px,rgba(143,24,34,.035) 46px 47px,transparent 48px 86px),
    linear-gradient(168deg,transparent 0 57%,rgba(255,255,255,.40) 57.2% 65%,transparent 65.2%);
  filter:none;
}
.rp-screen.step-bathrooms::after{
  background:
    radial-gradient(circle at 83% 23%,rgba(216,183,123,.20) 0 9%,transparent 9.5%),
    radial-gradient(circle at 92% 33%,rgba(255,255,255,.48) 0 4%,transparent 4.5%),
    radial-gradient(circle at 18% 84%,rgba(111,128,111,.12) 0 14%,transparent 14.5%),
    repeating-radial-gradient(ellipse at 110% 112%,transparent 0 44px,rgba(143,24,34,.035) 45px 46px,transparent 47px 84px);
}
.rp-screen.step-condition::after{
  background:
    radial-gradient(circle at 80% 17%,rgba(199,115,92,.20),transparent 26%),
    radial-gradient(circle at 14% 82%,rgba(82,100,81,.13),transparent 28%),
    repeating-linear-gradient(135deg,transparent 0 34px,rgba(143,24,34,.028) 35px 36px);
}
.rp-screen.step-addons::after{
  background:
    radial-gradient(circle at 88% 10%,rgba(216,183,123,.24),transparent 27%),
    radial-gradient(circle at 6% 88%,rgba(143,24,34,.12),transparent 30%),
    repeating-radial-gradient(circle at 104% 108%,transparent 0 34px,rgba(143,24,34,.032) 35px 36px,transparent 37px 68px);
}
.rp-screen.step-lead::after,.rp-screen.step-calendar::after{
  background:
    radial-gradient(circle at 86% 16%,rgba(216,183,123,.22),transparent 26%),
    radial-gradient(circle at 13% 88%,rgba(82,100,81,.11),transparent 30%),
    linear-gradient(160deg,transparent 0 61%,rgba(255,255,255,.34) 61.2% 69%,transparent 69.2%);
}
.rp-screen:not(.step-service) .rp-screen-scroll{padding:22px 18px 24px;}
.rp-screen:not(.step-service) .rp-center{
  margin-block:auto;
  max-width:520px;
  padding:0;
  background:transparent;
  border:0;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
}
.rp-screen:not(.step-service) .rp-center::before{display:none!important;}

/* Editorial consultation panel */
.rp-consult-panel{
  position:relative;
  overflow:hidden;
  padding:22px 18px 18px;
  border:1px solid rgba(100,67,40,.14);
  border-radius:30px;
  background:
    linear-gradient(145deg,rgba(255,253,248,.94),rgba(250,241,227,.82)),
    rgba(255,250,242,.86);
  box-shadow:
    0 28px 70px rgba(65,40,21,.13),
    0 5px 16px rgba(65,40,21,.06),
    inset 0 1px 0 rgba(255,255,255,.98);
  backdrop-filter:blur(18px) saturate(1.12);
  -webkit-backdrop-filter:blur(18px) saturate(1.12);
}
.rp-consult-panel::before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--wine-deep),var(--wine-bright) 52%,var(--clay) 76%,var(--champagne));
}
.rp-consult-panel::after{
  content:"RP";
  position:absolute;
  right:-12px;
  top:-25px;
  font-family:"DM Serif Display",Georgia,serif;
  font-size:118px;
  line-height:1;
  letter-spacing:-.09em;
  color:rgba(143,24,34,.035);
  pointer-events:none;
}
.rp-panel-ribbon{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0 0 9px;
  color:var(--wine);
  font-size:8.5px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;
}
.rp-panel-ribbon span{display:inline-flex;align-items:center;gap:8px;}
.rp-panel-ribbon span::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,var(--wine),var(--clay));}
.rp-panel-ribbon b{
  color:#7c6e61;
  font-size:8px;
  padding:5px 8px;
  border:1px solid rgba(100,67,40,.10);
  border-radius:999px;
  background:rgba(255,255,255,.55);
}
.rp-consult-panel .rp-eyebrow{margin:0 0 7px;color:#a85b51;font-size:9px;}
.rp-consult-panel .rp-eyebrow::before{display:none;}
.rp-consult-panel h2{position:relative;z-index:2;margin-bottom:7px;font-size:clamp(29px,7.4vw,38px);}
.rp-consult-panel .rp-sub{position:relative;z-index:2;margin-bottom:15px;font-size:12.5px;line-height:1.48;max-width:38ch;}
.rp-consult-note{
  display:flex;align-items:center;gap:7px;
  margin:0 0 13px;
  font-size:10.5px;font-weight:750;color:#75695e;
}
.rp-consult-note i{width:7px;height:7px;border-radius:50%;background:var(--forest);box-shadow:0 0 0 4px rgba(82,100,81,.11);}

/* Rich emblem system */
.rp-emblem{
  position:relative;
  width:52px;height:52px;min-width:52px;
  display:grid;place-items:center;
  border-radius:18px;
  color:var(--wine);
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.96),transparent 33%),
    linear-gradient(145deg,#fffdf8 0%,#f4e5d3 100%);
  border:1px solid rgba(126,84,48,.14);
  box-shadow:
    0 9px 20px rgba(67,40,20,.10),
    inset 0 1px 0 #fff,
    inset 0 -7px 16px rgba(186,126,91,.05);
}
.rp-emblem::before{
  content:"";position:absolute;inset:5px;border-radius:14px;
  border:1px solid rgba(143,24,34,.10);
}
.rp-emblem::after{
  content:"";position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;
  background:linear-gradient(145deg,#f8d79a,#bd8b3d);
  box-shadow:0 0 0 3px rgba(216,183,123,.14);
}
.rp-emblem .rp-ic{width:23px;height:23px;stroke-width:1.65;position:relative;z-index:2;}
.rp-emblem.is-dark{
  color:#fff8ee;
  background:linear-gradient(145deg,var(--wine-bright),var(--wine-deep));
  border-color:rgba(92,14,21,.42);
  box-shadow:0 12px 24px rgba(103,16,23,.22),inset 0 1px 0 rgba(255,255,255,.25);
}
.rp-emblem.is-dark::before{border-color:rgba(255,255,255,.18);}

/* Service menu: outcome-led premium product cards */
.rp-sheet{padding:17px 14px 14px;border-radius:32px;background:rgba(255,251,244,.965);}
.rp-sheet .rp-start-service-q{font-size:20px;margin-bottom:11px;}
.rp-service-stack{display:grid;gap:8px;position:relative;z-index:2;}
.rp-service-card{
  width:100%;min-height:66px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:11px;
  padding:9px 10px;
  text-align:left;
  border:1px solid rgba(103,68,39,.13);
  border-radius:19px;
  background:
    radial-gradient(170px 100px at 103% -10%,rgba(216,183,123,.15),transparent 72%),
    linear-gradient(145deg,rgba(255,255,255,.97),rgba(252,245,235,.92));
  box-shadow:0 10px 24px rgba(54,34,18,.085),inset 0 1px 0 #fff;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.rp-service-card::before{
  content:"";position:absolute;left:0;top:11px;bottom:11px;width:3px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--wine-bright),var(--wine-deep));opacity:.18;
  transition:opacity .18s,width .18s;
}
.rp-service-card:hover,.rp-service-card:focus-visible{
  transform:translateY(-2px);
  border-color:rgba(143,24,34,.36);
  box-shadow:0 16px 32px rgba(54,34,18,.14),0 0 0 3px rgba(143,24,34,.045),inset 0 1px 0 #fff;
}
.rp-service-card:hover::before{opacity:1;width:4px;}
.rp-service-card.is-featured{
  border-color:rgba(143,24,34,.50);
  background:
    radial-gradient(180px 100px at 100% 0%,rgba(199,115,92,.15),transparent 72%),
    linear-gradient(145deg,#fffdf8,#fff1ec);
  box-shadow:0 14px 30px rgba(115,21,28,.13),inset 0 1px 0 #fff;
}
.rp-service-card.is-featured::before{opacity:1;width:4px;}
.rp-service-card .rp-emblem{width:46px;height:46px;min-width:46px;border-radius:16px;}
.rp-service-card .rp-emblem .rp-ic{width:21px;height:21px;}
.rp-service-copy{position:relative;z-index:2;min-width:0;flex:1;display:flex;flex-direction:column;}
.rp-service-copy small{font-size:7.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#a85b51;margin-bottom:2px;}
.rp-service-copy strong{font-size:13px;line-height:1.22;letter-spacing:-.015em;}
.rp-service-copy span{font-size:9.5px;line-height:1.28;color:#75695e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rp-service-action{
  position:relative;z-index:2;
  width:32px;height:32px;min-width:32px;border-radius:50%;display:grid;place-items:center;
  color:var(--wine);background:linear-gradient(145deg,#fff7f4,#f4ddd7);
  border:1px solid rgba(143,24,34,.08);box-shadow:inset 0 1px 0 #fff;
}
.rp-service-action .rp-ic{width:15px;height:15px;}
.rp-service-watermark{
  position:absolute;right:28px;bottom:-18px;color:rgba(143,24,34,.035);transform:rotate(-8deg);pointer-events:none;
}
.rp-service-watermark .rp-ic{width:76px;height:76px;stroke-width:1.1;}
.rp-service-badge{
  position:absolute;right:12px;top:-8px;z-index:5;
  padding:4px 9px;border-radius:999px;
  color:#fff8eb;background:linear-gradient(135deg,#2b2520,#4a3d32);
  border:1px solid rgba(216,183,123,.54);
  box-shadow:0 6px 15px rgba(24,17,12,.19);
  font-size:7.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
}
.rp-live-status{position:relative;overflow:hidden;}
.rp-live-status i{width:7px;height:7px;border-radius:50%;background:#7aa47c;box-shadow:0 0 0 3px rgba(122,164,124,.18);}
.rp-live-status::after{content:"";position:absolute;inset:-100% auto -100% -30%;width:28%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.20),transparent);transform:skewX(-18deg);animation:rpLiveSweep 4.6s ease-in-out infinite;}
@keyframes rpLiveSweep{0%,68%{left:-30%}88%,100%{left:125%}}

/* Luxe decision cards */
.rp-choice-stack{position:relative;z-index:2;display:grid;gap:9px;}
.rp-luxe-card{
  width:100%;min-height:66px;
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:12px;
  padding:9px 10px;
  text-align:left;
  border:1px solid rgba(100,67,40,.13);
  border-radius:20px;
  background:
    radial-gradient(140px 90px at 104% -20%,rgba(216,183,123,.13),transparent 74%),
    linear-gradient(145deg,rgba(255,255,255,.97),rgba(250,242,232,.90));
  box-shadow:0 11px 24px rgba(57,35,18,.085),inset 0 1px 0 #fff;
  transition:transform .17s ease,border-color .17s ease,box-shadow .17s ease,background .17s ease;
}
.rp-luxe-card::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 4px 4px 0;
  background:linear-gradient(180deg,var(--wine-bright),var(--clay));opacity:.20;transition:opacity .17s,width .17s;
}
.rp-luxe-card:hover,.rp-luxe-card:focus-visible{
  transform:translateY(-2px);border-color:rgba(143,24,34,.34);
  box-shadow:0 16px 34px rgba(57,35,18,.13),0 0 0 3px rgba(143,24,34,.045),inset 0 1px 0 #fff;
}
.rp-luxe-card:hover::before{opacity:1;width:4px;}
.rp-luxe-card.is-chosen,.rp-service-card.is-chosen,.rp-bath-card.is-chosen,.rp-condition-card.is-chosen{
  border-color:var(--wine)!important;
  background:linear-gradient(145deg,#fff9f5,#f8dfd8)!important;
  transform:translateY(-1px) scale(.992)!important;
  box-shadow:0 15px 34px rgba(143,24,34,.17),0 0 0 3px rgba(143,24,34,.08),inset 0 1px 0 #fff!important;
}
.rp-luxe-card.is-chosen::before,.rp-service-card.is-chosen::before{opacity:1;width:5px;}
.rp-luxe-card.is-chosen .rp-number-medal,.rp-service-card.is-chosen .rp-emblem{
  color:#fff;background:linear-gradient(145deg,var(--wine-bright),var(--wine-deep));
}
.rp-number-medal{
  width:52px;height:52px;min-width:52px;border-radius:18px;
  display:grid;place-items:center;
  font-family:"DM Serif Display",Georgia,serif;font-size:26px;line-height:1;color:var(--wine);
  background:linear-gradient(145deg,#fffdf8,#f2e0cb);
  border:1px solid rgba(126,84,48,.14);
  box-shadow:0 8px 18px rgba(67,40,20,.09),inset 0 1px 0 #fff;
  transition:background .17s,color .17s;
}
.rp-luxe-copy{position:relative;z-index:2;flex:1;min-width:0;}
.rp-luxe-copy small{display:block;font-size:7.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#a85b51;margin-bottom:2px;}
.rp-luxe-copy strong{display:block;font-size:14px;line-height:1.24;letter-spacing:-.012em;}
.rp-luxe-copy span{display:block;font-size:10px;line-height:1.34;color:#776b61;margin-top:2px;}
.rp-price-seal{
  position:relative;z-index:2;min-width:66px;padding:7px 8px;border-radius:14px;text-align:center;
  background:linear-gradient(145deg,#2c2621,#473a31);color:#fff8ec;
  border:1px solid rgba(216,183,123,.44);box-shadow:0 7px 16px rgba(40,28,19,.15),inset 0 1px 0 rgba(255,255,255,.11);
}
.rp-price-seal small{display:block;font-size:6.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#d9c4a2;}
.rp-price-seal strong{display:block;font-family:"DM Serif Display",Georgia,serif;font-size:18px;font-weight:400;line-height:1.05;margin-top:1px;}
.rp-card-arrow{
  width:28px;height:28px;min-width:28px;border-radius:50%;display:grid;place-items:center;
  color:var(--wine);background:linear-gradient(145deg,#fff5f2,#f3ddd7);border:1px solid rgba(143,24,34,.08);
}
.rp-card-arrow .rp-ic{width:14px;height:14px;}
.rp-card-badge{
  position:absolute;right:9px;top:7px;font-size:6.8px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;
  padding:3px 6px;border-radius:999px;background:#eee0c4;color:#6d4a20;border:1px solid rgba(143,103,52,.12);
}

/* Bathroom gallery tiles */
.rp-bath-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rp-bath-card{
  min-height:114px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  padding:13px;border-radius:22px;text-align:left;
  border:1px solid rgba(100,67,40,.13);
  background:
    radial-gradient(circle at 86% 18%,rgba(216,183,123,.20) 0 13%,transparent 13.5%),
    radial-gradient(circle at 72% 30%,rgba(255,255,255,.84) 0 6%,transparent 6.5%),
    linear-gradient(145deg,rgba(255,255,255,.97),rgba(245,235,222,.91));
  box-shadow:0 12px 26px rgba(57,35,18,.085),inset 0 1px 0 #fff;
  transition:transform .17s,border-color .17s,box-shadow .17s;
}
.rp-bath-card:hover{transform:translateY(-2px);border-color:rgba(143,24,34,.34);box-shadow:0 17px 34px rgba(57,35,18,.13),inset 0 1px 0 #fff;}
.rp-bath-top{display:flex;align-items:flex-start;justify-content:space-between;width:100%;}
.rp-bath-number{font-family:"DM Serif Display",Georgia,serif;font-size:43px;line-height:.9;color:var(--wine);letter-spacing:-.05em;}
.rp-bath-orbs{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:46px;}
.rp-bath-orbs i{width:8px;height:8px;border-radius:50%;background:linear-gradient(145deg,#d59a83,#9f2027);box-shadow:inset 0 1px 0 rgba(255,255,255,.45);}
.rp-bath-copy strong{display:block;font-size:13px;}
.rp-bath-copy span{display:block;font-size:9.5px;color:#786c61;margin-top:2px;}

/* Condition cards — reassuring visual scale, not judgemental photos */
.rp-condition-stack{position:relative;z-index:2;display:grid;gap:10px;}
.rp-condition-card{
  width:100%;min-height:78px;display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:11px;
  position:relative;overflow:hidden;padding:10px 11px;border-radius:21px;text-align:left;
  border:1px solid rgba(100,67,40,.13);
  background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(249,240,229,.91));
  box-shadow:0 11px 25px rgba(57,35,18,.085),inset 0 1px 0 #fff;
  transition:transform .17s,border-color .17s,box-shadow .17s;
}
.rp-condition-card:hover{transform:translateY(-2px);border-color:rgba(143,24,34,.34);box-shadow:0 16px 34px rgba(57,35,18,.13),inset 0 1px 0 #fff;}
.rp-condition-meter{height:52px;border-radius:17px;padding:10px 9px;display:flex;align-items:flex-end;gap:4px;background:linear-gradient(145deg,#fffdf8,#f1dfca);border:1px solid rgba(126,84,48,.13);}
.rp-condition-meter i{width:10px;border-radius:5px 5px 3px 3px;background:#ded2c2;box-shadow:inset 0 1px 0 rgba(255,255,255,.65);}
.rp-condition-meter i:nth-child(1){height:11px}.rp-condition-meter i:nth-child(2){height:20px}.rp-condition-meter i:nth-child(3){height:30px}
.rp-condition-card.level-1 .rp-condition-meter i:nth-child(1),
.rp-condition-card.level-2 .rp-condition-meter i:nth-child(-n+2),
.rp-condition-card.level-3 .rp-condition-meter i{background:linear-gradient(180deg,var(--clay),var(--wine));}
.rp-condition-copy strong{display:block;font-size:14px;line-height:1.2;}
.rp-condition-copy span{display:block;font-size:10px;line-height:1.34;color:#786c61;margin-top:3px;}
.rp-condition-tag{font-size:7px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;padding:5px 7px;border-radius:999px;background:#f0e3d3;color:#80634e;white-space:nowrap;}

/* Add-ons become premium upgrades, not another stack of generic rows. */
.rp-addon-stack{display:grid;gap:8px;position:relative;z-index:2;}
.rp-addon-card{
  width:100%;min-height:64px;position:relative;overflow:hidden;
  display:flex;align-items:center;gap:10px;padding:8px 10px;text-align:left;
  border:1px solid rgba(100,67,40,.13);border-radius:19px;
  background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(249,240,229,.91));
  box-shadow:0 10px 23px rgba(57,35,18,.08),inset 0 1px 0 #fff;
  transition:transform .17s,border-color .17s,box-shadow .17s;
}
.rp-addon-card:hover{transform:translateY(-2px);border-color:rgba(143,24,34,.34);box-shadow:0 15px 32px rgba(57,35,18,.13),inset 0 1px 0 #fff;}
.rp-addon-card .rp-emblem{width:44px;height:44px;min-width:44px;border-radius:15px;}
.rp-addon-card .rp-emblem .rp-ic{width:20px;height:20px;}
.rp-addon-copy{flex:1;min-width:0;}
.rp-addon-copy strong{display:block;font-size:13px;line-height:1.2;}
.rp-addon-copy span{display:block;font-size:9.4px;line-height:1.3;color:#786c61;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rp-addon-price{font-size:8px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#7a5541;padding:6px 7px;border-radius:999px;background:#f2e3d1;border:1px solid rgba(126,84,48,.09);white-space:nowrap;}
.rp-addon-card.is-selected{border-color:rgba(143,24,34,.48);background:linear-gradient(145deg,#fff9f5,#f8e4de);box-shadow:0 13px 28px rgba(143,24,34,.12),inset 4px 0 0 var(--wine);}
.rp-addon-card.is-selected .rp-emblem{color:#fff;background:linear-gradient(145deg,var(--wine-bright),var(--wine-deep));}
.rp-addon-summary{font-size:9px;font-weight:850;color:var(--wine);text-align:right;white-space:nowrap;}
.rp-addon-summary small{display:block;font-size:7px;color:#887a6e;text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.rp-expand{
  border-radius:22px;
  background:linear-gradient(145deg,rgba(255,253,248,.98),rgba(249,237,224,.95));
  border-color:rgba(143,24,34,.40);
  box-shadow:0 17px 38px rgba(80,38,26,.13),inset 4px 0 0 var(--wine),inset 0 1px 0 #fff;
}
.rp-expand-head{padding:11px 12px;}
.rp-expand-head .rp-emblem{width:44px;height:44px;min-width:44px;border-radius:15px;}
.rp-expand-body{padding:0 12px 13px;}
.rp-pill{
  border-radius:15px;
  background:linear-gradient(145deg,#fff,#f7ecdf);
  box-shadow:0 7px 15px rgba(57,35,18,.055),inset 0 1px 0 #fff;
}
.rp-pill.is-selected{background:linear-gradient(145deg,var(--wine-bright),var(--wine-deep));box-shadow:0 10px 19px rgba(107,16,23,.20),inset 0 1px 0 rgba(255,255,255,.20);}

/* Premium checkbox/toggle experiences */
.rp-checkbox-card{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(248,238,225,.91));
  border-radius:20px;border-color:rgba(100,67,40,.13);
  box-shadow:0 10px 23px rgba(57,35,18,.075),inset 0 1px 0 #fff;
}
.rp-checkbox-card::after{content:"";position:absolute;right:-24px;bottom:-28px;width:76px;height:76px;border-radius:50%;border:1px solid rgba(143,24,34,.045);box-shadow:0 0 0 14px rgba(143,24,34,.025);}
.rp-checkbox-card input{appearance:none;-webkit-appearance:none;width:23px;height:23px;border-radius:8px;border:1.5px solid rgba(143,24,34,.32);background:#fff;display:grid;place-items:center;}
.rp-checkbox-card input::after{content:"✓";font-size:14px;font-weight:900;color:#fff;transform:scale(0);transition:transform .15s ease;}
.rp-checkbox-card input:checked{background:linear-gradient(145deg,var(--wine-bright),var(--wine-deep));border-color:var(--wine);}
.rp-checkbox-card input:checked::after{transform:scale(1);}

/* Primary CTA now feels like a premium reservation action. */
.rp-primary{
  min-height:58px;border-radius:19px;
  background:
    radial-gradient(120px 70px at 16% -20%,rgba(255,255,255,.22),transparent 72%),
    linear-gradient(135deg,#d33c45 0%,#a51d28 45%,#6d1018 100%);
  border:1px solid rgba(83,8,14,.44);
  box-shadow:0 16px 34px rgba(103,16,23,.30),0 4px 9px rgba(103,16,23,.14),inset 0 1px 0 rgba(255,255,255,.30),inset 0 -7px 14px rgba(59,5,10,.12);
  text-shadow:0 1px 2px rgba(65,5,10,.24);
}
.rp-primary::before{background:linear-gradient(110deg,transparent 18%,rgba(255,255,255,.24) 44%,transparent 68%);}
.rp-primary::after{
  content:"→";
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);
  font-size:17px;
}
.rp-primary:hover{transform:translateY(-2px);box-shadow:0 20px 40px rgba(103,16,23,.35),0 5px 12px rgba(103,16,23,.15),inset 0 1px 0 rgba(255,255,255,.30);}
.rp-live-chip{padding:0 4px;}
.rp-live-chip strong{color:var(--wine);}

/* Existing estimate and lead screens inherit the stronger wrapper. */
.rp-screen.step-estimate .rp-screen-scroll{padding-top:18px;}
.rp-screen.step-estimate .rp-center{max-width:520px;}
.rp-screen.step-lead .rp-consult-panel{padding-bottom:15px;}
.rp-lead-field input,.rp-lead-field textarea{background:linear-gradient(145deg,#fff,#fbf3e8);border-radius:16px;box-shadow:0 7px 16px rgba(57,35,18,.045),inset 0 1px 0 #fff;}
.rp-privacy-note{padding:8px 10px;border-radius:13px;background:rgba(255,255,255,.45);border:1px solid rgba(100,67,40,.08);}

/* Gentle choice confirmation before the next consultation step. */
@keyframes rpChoiceCheck{0%{transform:scale(.88)}60%{transform:scale(1.025)}100%{transform:scale(.99)}}
.is-chosen{animation:rpChoiceCheck .19s ease both;pointer-events:none;}

@media(max-height:760px){
  .rp-screen:not(.step-service) .rp-screen-scroll{padding:12px 14px 14px;}
  .rp-consult-panel{padding:17px 14px 14px;border-radius:25px;}
  .rp-panel-ribbon{margin-bottom:6px;}
  .rp-consult-panel h2{font-size:28px;margin-bottom:5px;}
  .rp-consult-panel .rp-sub{font-size:11.5px;margin-bottom:11px;line-height:1.38;}
  .rp-choice-stack,.rp-condition-stack{gap:7px;}
  .rp-luxe-card{min-height:57px;padding:7px 8px;border-radius:17px;gap:9px;}
  .rp-number-medal{width:44px;height:44px;min-width:44px;border-radius:15px;font-size:23px;}

<script>
/* =========================================================================
   PRICING ENGINE — copied verbatim from the homepage estimator.
   Do not edit values here without also editing the homepage.
   ========================================================================= */
const rpState = {
  step: "service",
  service: null,
  bedrooms: null,
  bathrooms: null,
  condition: null,
  frequency: null,
  carpetRooms: 0,
  addonCarpetRooms: 0,
  expandedAddon: null,
  windowsTier: null,
  yardTier: null,
  garageWash: false,
  laundryLoads: 0,
  fridgeAddon: false,
  junkSize: null,
  heavySoil: false,
  petOdor: false,
  airbnbLaundry: false,
  airbnbRestocking: false,
  airbnbSameDay: false,
  handymanInterest: false,
  militaryDiscount: false,
  fullName: "",
  phone: "",
  email: "",
  address1: "",
  city: "",
  state: "OK",
  postalCode: "",
  specialInstructions: "",
  estimateSent: false,
  preBookingWebhookSent: false
};

const rpServices = {
  moveout:     { name: "Factory Reset™ Move-Out Clean",     emoji: "🏠" },
  deep:        { name: "Deep Cleaning",                    emoji: "🧼" },
  maintenance: { name: "Maintenance Cleaning",             emoji: "✨" },
  carpet:      { name: "Carpet Cleaning",                  emoji: "🧽" },
  airbnb:      { name: "Airbnb Turnover Cleaning",         emoji: "🛏" }
};

const rpTierPrices = { 1: 199, 2: 299, 3: 399, 4: 499, 5: 599 };

function rpMaintenancePrice(bedrooms, bathrooms) {
  const beds = Number(bedrooms || 1);
  const baths = Number(bathrooms || 1);
  return 149 + Math.max(0, beds - 1) * 25 + Math.max(0, baths - 1) * 25;
}

const rpAddonCatalog = {
  carpet:  { label: "Carpet Cleaning",     unit: "room", bundlePrice: 50 },
  junk:    { label: "Junk Haul",           half: 100, full: 200 },
  windows: { label: "Exterior Windows",    basic: 100, premium: 200 },
  garage:  { label: "Garage Floor Wash",   price: 100 },
  laundry: { label: "Laundry Service",     pricePerLoad: 35 },
  fridge:  { label: "Refrigerator Interior", price: 50 },
  yard:    { label: "Yard Refresh", normal: 100, overgrown: 150, xl: 200, xlOvergrown: 250 }
};

const rpServiceAddons = {
  moveout:     ["carpet", "junk", "windows", "garage", "yard"],
  deep:        ["fridge", "carpet", "laundry", "windows", "garage", "yard"],
  maintenance: ["laundry", "windows", "yard"]
};

const rpIncludes = {
  moveout: {
    paragraph: "A top-to-bottom, inside-and-out clean — appliances, cabinets, every surface, top to bottom, side to side, no add-ons required. Built to get your deposit back at move-out, and just as thorough for getting a home move-in ready. Works best in an empty home — schedule it after you're out, or before you move in."
  },
  deep: {
    paragraph: "A thorough reset that goes past your everyday routine — inside the oven and microwave, every bathroom, floors, and baseboards. Ideal before hosting, after a big mess, or just to hit reset on the whole house."
  },
  maintenance: {
    paragraph: "Consistent upkeep that keeps your home spotless between visits, on whatever schedule fits your life."
  },
  carpet: {
    paragraph: "Professional hot-water extraction that lifts embedded dirt, stains, and odors regular vacuuming can't reach."
  },
  airbnb: {
    paragraph: "A fast, guest-ready reset between every checkout and check-in."
  }
};

/* Funnel flows: same per-service question order as the homepage, minus the
   read-only "includes" screen — that content lives as an expandable
   "What's included" on the estimate screen. */
const rpFlows = {
  moveout:     ["bedrooms", "bathrooms", "condition", "addons", "estimate", "lead", "calendar"],
  deep:        ["bedrooms", "bathrooms", "condition", "addons", "estimate", "lead", "calendar"],
  maintenance: ["bedrooms", "bathrooms", "frequency", "addons", "estimate", "lead", "calendar"],
  carpet:      ["rooms", "carpetdetails", "estimate", "lead", "calendar"],
  airbnb:      ["bedrooms", "bathrooms", "airbnbdetails", "estimate", "lead", "calendar"]
};

function rpCurrentFlow() { return rpFlows[rpState.service] || []; }
function rpStepIndex() { return rpCurrentFlow().indexOf(rpState.step); }

function rpTimeEstimate() {
  if (rpState.service === "moveout" || rpState.service === "movein") return "6–10 hours";
  if (rpState.service === "deep") return "Up to 6 hours";
  if (rpState.service === "maintenance") return "Up to 4 hours";
  if (rpState.service === "airbnb") return "Varies by property size";
  if (rpState.service === "carpet") return "Varies by room count";
  return "";
}
function rpTeamSize() {
  if (rpState.service === "moveout" || rpState.service === "movein") return "2 cleaners";
  if (rpState.service === "deep" || rpState.service === "maintenance") return "1 cleaner";
  if (rpState.service === "airbnb") return "1–2 cleaners";
  if (rpState.service === "carpet") return "1 technician";
  return "";
}

function rpAddonsTotal() {
  let total = 0;
  if (rpState.addonCarpetRooms > 0) total += rpState.addonCarpetRooms * rpAddonCatalog.carpet.bundlePrice;
  if (rpState.junkSize === "half") total += rpAddonCatalog.junk.half;
  if (rpState.junkSize === "full") total += rpAddonCatalog.junk.full;
  if (rpState.windowsTier === "basic") total += rpAddonCatalog.windows.basic;
  if (rpState.windowsTier === "premium") total += rpAddonCatalog.windows.premium;
  if (rpState.garageWash) total += rpAddonCatalog.garage.price;
  if (rpState.laundryLoads > 0) total += rpState.laundryLoads * rpAddonCatalog.laundry.pricePerLoad;
  if (rpState.fridgeAddon) total += rpAddonCatalog.fridge.price;
  if (rpState.yardTier) total += rpAddonCatalog.yard[rpState.yardTier];
  return total;
}

function rpCalculatePrice() {
  if (!rpState.service) return 0;
  if (rpState.service === "airbnb") return 0; // custom quote, no fixed price
  if (rpState.service === "carpet") {
    const rooms = Math.max(2, Number(rpState.carpetRooms || 0)); // 2-room minimum
    return rpState.carpetRooms ? rooms * 75 : 0;
  }
  if (rpState.service === "maintenance") {
    if (!rpState.bedrooms) return 0;
    return rpMaintenancePrice(rpState.bedrooms, rpState.bathrooms) + rpAddonsTotal();
  }
  if (["moveout", "movein", "deep"].includes(rpState.service)) {
    if (!rpState.bedrooms) return 0;
    const base = rpTierPrices[Math.min(Number(rpState.bedrooms), 5)] || rpTierPrices[5];
    return base + rpAddonsTotal();
  }
  return 0;
}

function rpFinalPrice() {
  const subtotal = rpCalculatePrice();
  if (!subtotal) return subtotal;
  if (rpState.service === "airbnb") return subtotal;
  return rpState.militaryDiscount ? Math.round(subtotal * 0.9) : subtotal;
}

function rpPriceLabel() {
  const total = rpFinalPrice();
  if (rpState.service === "airbnb") return "Custom Quote";
  if (!total) return "$0";
  return `$${total}`;
}

/* =========================================================================
   ICONS — small inline SVG set (stroke = currentColor)
   ========================================================================= */
const rpIconPaths = {
  home:    '<path d="M3.5 11 12 4.2 20.5 11"/><path d="M5.5 9.8V20h4.6v-5.4h3.8V20h4.6V9.8"/>',
  droplet: '<path d="M12 3.6C12 3.6 6.6 10 6.6 14a5.4 5.4 0 0 0 10.8 0C17.4 10 12 3.6 12 3.6Z"/>',
  repeat:  '<path d="M4.5 12a7.5 7.5 0 0 1 12.9-5.2L19.5 8.9"/><path d="M19.5 4.4v4.5H15"/><path d="M19.5 12a7.5 7.5 0 0 1-12.9 5.2L4.5 15.1"/><path d="M4.5 19.6v-4.5H9"/>',
  layers:  '<path d="m12 4.2 8.5 4.7L12 13.6 3.5 8.9Z"/><path d="m5.6 12.4 6.4 3.5 6.4-3.5"/><path d="m5.6 15.9 6.4 3.5 6.4-3.5"/>',
  truck:   '<path d="M2.5 7h11.5v9H2.5Z"/><path d="M14 10.2h3.8l2.7 3.2V16H14"/><circle cx="6.6" cy="17.6" r="1.7"/><circle cx="16.8" cy="17.6" r="1.7"/>',
  window:  '<rect x="4.5" y="4.5" width="15" height="15" rx="1.6"/><path d="M12 4.5v15M4.5 12h15"/>',
  car:     '<path d="M4.5 15.5v-2.3l1.9-4.4a2 2 0 0 1 1.8-1.2h7.6a2 2 0 0 1 1.8 1.2l1.9 4.4v2.3"/><path d="M4.5 15.5h15"/><circle cx="8" cy="17.3" r="1.5"/><circle cx="16" cy="17.3" r="1.5"/>',
  washer:  '<rect x="4.8" y="3.5" width="14.4" height="17" rx="2"/><circle cx="12" cy="13.2" r="3.9"/><circle cx="8.2" cy="6.4" r=".2"/>',
  fridge:  '<rect x="6.5" y="3.5" width="11" height="17" rx="1.6"/><path d="M6.5 10.2h11"/><path d="M15 6v2M15 13v3"/>',
  leaf:    '<path d="M5 19C5 10.7 11.6 4.6 19.8 4.6 19.8 12.9 13.3 19 5 19Z"/><path d="M5 19c2.9-4.4 6.8-7.8 10.8-9.8"/>',
  star:    '<path d="m12 3.8 2.3 5.1 5.4.6-4 3.7 1.1 5.4L12 15.9l-4.8 2.7 1.1-5.4-4-3.7 5.4-.6Z"/>',
  shield:  '<path d="M12 3.6 18.8 6v5c0 4.4-2.8 7.6-6.8 9.2-4-1.6-6.8-4.8-6.8-9.2V6Z"/><path d="m8.9 11.7 2.2 2.2 4-4.2"/>',
  zap:     '<path d="M13 3.2 5.4 13.4h5.8L11 20.8l7.6-10.2h-5.8Z"/>',
  check:   '<path d="m5.5 12.5 4.3 4.3L18.5 8"/>',
  chev:    '<path d="m9.5 6 6 6-6 6"/>',
  lock:    '<rect x="5.5" y="10.5" width="13" height="9.5" rx="1.8"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>'
};
function rpIcon(name, cls = "rp-ic") {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${rpIconPaths[name] || ""}</svg>`;
}
function rpChip(name) { return `<span class="rp-ic-chip">${rpIcon(name)}</span>`; }

/* =========================================================================
   FUNNEL ANALYTICS — every screen is measurable.
   ========================================================================= */
let rpScreenEnteredAt = Date.now();
function rpTrack(event, extra = {}) {
  const payload = Object.assign({
    screen: rpState.step,
    service: rpState.service || "none",
    elapsed_ms: Date.now() - rpScreenEnteredAt,
    funnel: "book_v1"
  }, extra);
  try { if (typeof gtag === "function") gtag("event", event, payload); } catch (e) {}
  try { if (window.clarity) window.clarity("event", event + "_" + payload.screen); } catch (e) {}
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
function rpTotalSteps() {
  return 1 + (rpState.service ? rpCurrentFlow().length : 7);
}
function rpStepNumber() {
  if (rpState.step === "service") return 1;
  return 2 + rpStepIndex();
}
function rpStepLabel() {
  if (rpState.step === "calendar") return "Last step";
  return `Step ${rpStepNumber()} of ${rpTotalSteps()}`;
}
function rpUpdateProgress() {
  const fill = document.getElementById("rpProgressFill");
  const backBtn = document.getElementById("rpBackBtn");
  if (fill) fill.style.width = `${Math.round((rpStepNumber() / rpTotalSteps()) * 100)}%`;
  if (backBtn) backBtn.classList.toggle("is-hidden", rpState.step === "service");
}

function rpGoToStep(name, direction = "forward") {
  if (direction === "forward" && rpState.step !== name) rpTrack("screen_continue", { to_screen: name });
  rpState.step = name;
  rpRender(direction);
}
function rpAdvance() {
  const flow = rpCurrentFlow();
  const idx = rpStepIndex();
  const next = flow[idx + 1];
  if (next) rpGoToStep(next, "forward");
}
function rpBack() {
  if (rpState.step === "service") return;
  rpTrack("screen_back");
  const flow = rpCurrentFlow();
  const idx = rpStepIndex();
  if (idx <= 0) { rpState.service = null; rpState.step = "service"; rpRender("back"); return; }
  rpState.step = flow[idx - 1];
  rpRender("back");
}

/* =========================================================================
   SCREENS — one screen, one decision, vertically balanced.
   ========================================================================= */
function rpRowBtn({ onclick, icon, title, desc, val, valNote, featured, badge }) {
  return `
    <button type="button" class="rp-row ${featured ? "is-featured" : ""}" onclick="${onclick}">
      ${badge ? `<span class="badge">${badge}</span>` : ""}
      ${icon ? rpChip(icon) : ""}
      <span class="rp-row-main">
        <span class="rp-row-title">${title}</span>
        ${desc ? `<span class="rp-row-desc">${desc}</span>` : ""}
      </span>
      ${val ? `<span class="rp-row-val">${val}${valNote ? `<small>${valNote}</small>` : ""}</span>` : `<span class="rp-row-chev">${rpIcon("chev","rp-ic rp-ic-sm")}</span>`}
    </button>`;
}
function rpEmblem(icon, dark = false) {
  return `<span class="rp-emblem ${dark ? "is-dark" : ""}">${rpIcon(icon)}</span>`;
}
function rpChoose(button, action) {
  if (!button || button.dataset.committing === "1") return;
  button.dataset.committing = "1";
  button.classList.add("is-chosen");
  try { if (navigator.vibrate) navigator.vibrate(8); } catch (_) {}
  window.setTimeout(action, 175);
}
function rpPanel({eyebrow, label, title, sub = "", note = "", body = ""}) {
  return `<div class="rp-center"><section class="rp-consult-panel">
    <div class="rp-panel-ribbon"><span>${label}</span><b>${rpStepLabel()}</b></div>
    ${eyebrow}
    <h2>${title}</h2>
    ${sub ? `<p class="rp-sub">${sub}</p>` : ""}
    ${note ? `<p class="rp-consult-note"><i></i>${note}</p>` : ""}
    ${body}
  </section></div>`;
}
function rpServiceCard({service, icon, kicker, title, desc, featured = false, badge = ""}) {
  return `<button type="button" class="rp-service-card ${featured ? "is-featured" : ""}" onclick="rpChoose(this,()=>rpSelectService('${service}'))">
    ${badge ? `<span class="rp-service-badge">${badge}</span>` : ""}
    ${rpEmblem(icon, featured)}
    <span class="rp-service-copy"><small>${kicker}</small><strong>${title}</strong><span>${desc}</span></span>
    <span class="rp-service-action">${rpIcon("chev")}</span>
    <span class="rp-service-watermark">${rpIcon(icon)}</span>
  </button>`;
}
function rpNumberChoice({number, label, desc, price = "", kicker = "Home size", badge = "", onclick}) {
  return `<button type="button" class="rp-luxe-card" onclick="rpChoose(this,()=>${onclick})">
    ${badge ? `<span class="rp-card-badge">${badge}</span>` : ""}
    <span class="rp-number-medal">${number}</span>
    <span class="rp-luxe-copy"><small>${kicker}</small><strong>${label}</strong><span>${desc}</span></span>
    ${price ? `<span class="rp-price-seal"><small>Your price</small><strong>${price}</strong></span>` : `<span class="rp-card-arrow">${rpIcon("chev")}</span>`}
  </button>`;
}
function rpBathroomChoice(n) {
  const label = `${n}${n === 4 ? "+" : ""} bathroom${n > 1 ? "s" : ""}`;

function rpBuildCalendarUrl() {
  const url = new URL("https://api.leadconnectorhq.com/widget/booking/1VXLRmyHfLdsHa4rTKJ2");
  const parts = rpState.fullName.trim().split(/\s+/).filter(Boolean);
  const firstName = parts.shift() || "";
  const lastName = parts.join(" ");
  const total = rpFinalPrice();
  const jobDetails = rpGetEstimatePayload().job_details;

  const params = {
    first_name: firstName,
    last_name: lastName,
    name: rpState.fullName,
    email: rpState.email,
    phone: rpState.phone,
    address: rpState.address1,
    city: rpState.city,
    state: "OK",
    postal_code: rpState.postalCode,
    service: rpServices[rpState.service]?.name || "Cleaning",
    estimated_price: rpState.service === "airbnb" ? "Custom Quote" : `$${total}`,
    job_details: jobDetails
  };

  Object.entries(params).forEach(([key, value]) => {
    if (value) url.searchParams.set(key, value);
  });
  return url.toString();
}

/* =========================================================================
   RENDERER with slide transitions
   ========================================================================= */
function rpRender(direction) {
  rpUpdateProgress();
  const host = document.getElementById("rpScreens");
  if (!host) return;

  const def = rpScreenHtml();
  const screen = document.createElement("div");
  screen.className = "rp-screen step-" + rpState.step + (def.bg ? " has-photo-bg" : "");
  screen.innerHTML = `
    ${def.bg || ""}
    <div class="rp-screen-scroll">${def.scroll || ""}</div>
    ${def.footer ? `<div class="rp-screen-footer">${def.footer}</div>` : ""}
  `;

  const old = host.querySelector(".rp-screen:last-child");
  if (old && (direction === "forward" || direction === "back")) {
    old.classList.add(direction === "forward" ? "exit-forward" : "exit-back");
    screen.classList.add(direction === "forward" ? "enter-forward" : "enter-back");
    host.appendChild(screen);
    setTimeout(() => { old.remove(); screen.classList.remove("enter-forward","enter-back"); }, 340);
  } else {
    host.innerHTML = "";
    host.appendChild(screen);
  }

  if (typeof def.onMount === "function") def.onMount();

  rpScreenEnteredAt = Date.now();
  rpTrack("screen_view");
  if (rpState.step === "estimate") rpTrack("estimate_reached", { estimate: rpPriceLabel() });
  if (rpState.step === "calendar") rpTrack("calendar_reached", { estimate: rpPriceLabel() });
}

/* Same-screen refresh without transition or duplicate screen_view. */
function rpRefresh() {
  const host = document.getElementById("rpScreens");
  if (!host) return;
  const def = rpScreenHtml();
  const current = host.querySelector(".rp-screen:last-child");
  if (!current) return;
  const scrollEl = current.querySelector(".rp-screen-scroll");
  const prevScrollTop = scrollEl ? scrollEl.scrollTop : 0;
  current.innerHTML = `
    ${def.bg || ""}
    <div class="rp-screen-scroll">${def.scroll || ""}</div>
    ${def.footer ? `<div class="rp-screen-footer">${def.footer}</div>` : ""}
  `;
  const newScrollEl = current.querySelector(".rp-screen-scroll");
  if (newScrollEl) newScrollEl.scrollTop = prevScrollTop;
}

/* =========================================================================
   PAYLOAD + CALENDAR HANDOFF — verbatim from the homepage estimator.
   ========================================================================= */
function rpGetEstimatePayload() {
  const subtotal = rpCalculatePrice();
  const total = rpFinalPrice();
  const discountApplied = rpState.militaryDiscount && rpState.service !== "airbnb" && subtotal > 0;
  const service = rpServices[rpState.service]?.name || "Not selected";
  const address1 = rpState.address1.trim();
  const city = rpState.city.trim();
  const state = (rpState.state || "OK").trim().toUpperCase();
  const postalCode = rpState.postalCode.trim();
  const fullAddress = [address1, [city, state, postalCode].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const notes = rpState.specialInstructions.trim() || "None";
  const addonsList = [
    rpState.addonCarpetRooms ? `Carpet Cleaning: ${rpState.addonCarpetRooms} room(s)` : "",
    rpState.junkSize ? `Junk Haul: ${rpState.junkSize}` : "",
    rpState.windowsTier ? `Exterior Windows: ${rpState.windowsTier}` : "",
    rpState.garageWash ? "Garage Floor Wash" : "",
    rpState.laundryLoads ? "Laundry Service" : "",
    rpState.fridgeAddon ? "Refrigerator Interior" : "",
    rpState.yardTier ? `Yard Refresh: ${rpState.yardTier}` : ""
  ].filter(Boolean).join(", ") || "None";
  const jobDetails = [
    `Service: ${service}`, `Estimate: ${rpState.service === "airbnb" ? "Custom Quote" : `$${total}`}`,
    `Bedrooms: ${rpState.bedrooms || "N/A"}`, `Bathrooms: ${rpState.bathrooms || "N/A"}`,
    `Condition: ${rpState.condition || "N/A"}`, `Frequency: ${rpState.frequency || "N/A"}`,
    `Carpet rooms (primary): ${rpState.carpetRooms || "0"}`, `Heavy soil: ${rpState.heavySoil ? "Yes" : "No"}`, `Pet odor: ${rpState.petOdor ? "Yes" : "No"}`,
    `Airbnb laundry: ${rpState.airbnbLaundry ? "Yes" : "No"}`, `Airbnb restocking: ${rpState.airbnbRestocking ? "Yes" : "No"}`, `Airbnb same-day: ${rpState.airbnbSameDay ? "Yes" : "No"}`,
    `Add-ons: ${addonsList}`, `Handyman & Turnover interest: ${rpState.handymanInterest ? "Yes" : "No"}`,
    `Military/First Responder Discount: ${discountApplied ? `Yes (-$${subtotal - total})` : "No"}`,
    `Address: ${fullAddress || "N/A"}`, `Special instructions: ${notes}`
  ].join(" | ");
  return {
    source: "Red Prairie Website Instant Estimator", business: "Red Prairie Cleaning",
    full_name: rpState.fullName, phone: rpState.phone, email: rpState.email,
    address1, street_address: address1, address: address1, city, state, postal_code: postalCode, zip: postalCode, full_address: fullAddress,
    service, service_type: service, service_key: rpState.service,
    estimated_price: rpState.service === "airbnb" ? "Custom Quote" : `$${total}`, estimated_price_number: total, price_estimate: rpState.service === "airbnb" ? "Custom Quote" : `$${total}`,
    bedrooms: rpState.bedrooms || "N/A", bathrooms: rpState.bathrooms || "N/A",
    carpet_rooms: rpState.carpetRooms || rpState.addonCarpetRooms || "0",
    exterior_windows: rpState.windowsTier ? "Yes" : "No",
    upholstery_type: "N/A", upholstery_item: "N/A", upholstery_price: "0",
    junk_size: rpState.junkSize || "N/A",
    helpers_count: "N/A", hours_count: "N/A",
    addons: addonsList,
    condition: rpState.condition || "N/A", frequency: rpState.frequency || "N/A",
    heavy_soil: rpState.heavySoil ? "Yes" : "No", pet_odor: rpState.petOdor ? "Yes" : "No",
    airbnb_laundry: rpState.airbnbLaundry ? "Yes" : "No", airbnb_restocking: rpState.airbnbRestocking ? "Yes" : "No", airbnb_same_day: rpState.airbnbSameDay ? "Yes" : "No",
    exterior_windows_tier: rpState.windowsTier || "N/A",
    handyman_interest: rpState.handymanInterest ? "Yes" : "No",
    military_discount: discountApplied ? "Yes" : "No",
    subtotal_before_discount: discountApplied ? `$${subtotal}` : (rpState.service === "airbnb" ? "Custom Quote" : `$${subtotal}`),
    discount_amount: discountApplied ? `$${subtotal - total}` : "$0",
    special_instructions: notes, customer_notes: notes, estimate_notes: jobDetails, job_details: jobDetails, cleaner_notes: jobDetails,
    submitted_at: new Date().toISOString(), page_url: window.location.href
  };
}

function rpSendEstimateToGoHighLevel(extra = {}) {
  /*
    Calendar-only confirmation gate:
    Do not send the website webhook from the estimate/contact step.
    The site only passes customer and job details into the embedded GHL calendar URL.
    GHL should send customer texts from the appointment booked trigger after a time slot is selected.
  */
  rpState.estimateSent = true;
  rpState.preBookingWebhookSent = true;
  return true;
}
function rpSubmitLeadAndShowCalendar() {
  const fullName = document.getElementById("rpFullName").value.trim();
  const phone = document.getElementById("rpPhone").value.trim();
  const email = document.getElementById("rpEmail").value.trim();
  const address1 = document.getElementById("rpAddress1").value.trim();
  const city = document.getElementById("rpCity").value.trim();
  const postalCode = document.getElementById("rpPostalCode").value.trim();
  const specialInstructions = document.getElementById("rpSpecialInstructions").value.trim();
  const errorBox = document.getElementById("rpFormError");
  const emailLooksValid = email.includes("@") && email.includes(".");
  if (!fullName || !phone || !emailLooksValid || !address1 || !city || !postalCode) {
    errorBox.style.display = "block";
    rpTrack("lead_validation_error");
    return;
  }
  rpState.fullName = fullName; rpState.phone = phone; rpState.email = email; rpState.address1 = address1; rpState.city = city; rpState.state = "OK"; rpState.postalCode = postalCode; rpState.specialInstructions = specialInstructions;

  rpSendEstimateToGoHighLevel({
    booking_status: "Estimate Submitted - Appointment Time Not Selected Yet",
    booking_source: "website_estimator_before_calendar",
    customer_action_needed: "Customer still needs to choose appointment time in embedded calendar",
    should_send_booking_confirmation: "No - wait for GHL calendar appointment booked trigger"
  });

  rpTrack("lead_submitted", { estimate: rpPriceLabel() });

  const button = document.getElementById("rpReserveBtn"); if (button) { button.disabled = true; button.innerText = "Opening calendar..."; }
  rpGoToStep("calendar", "forward");
}

const rpConfirmationPath = "/booking-confirmation.html";
let rpCalendarLoadCount = 0;
let rpCalendarMountedAt = 0;
let rpBookingRedirected = false;
function rpRedirectToConfirmation(reason) {
  if (rpBookingRedirected || rpState.step !== "calendar") return;
  rpBookingRedirected = true;
  rpTrack("booking_completed", { completion_signal: reason || "calendar" });
  window.location.assign(rpConfirmationPath);
}
function rpLooksLikeBookingSuccess(data) {
  let text = "";
  try { text = typeof data === "string" ? data : JSON.stringify(data || {}); } catch (_) {}
  text = text.toLowerCase();
  const hasBooking = /(appointment|booking|calendar)/.test(text);
  const hasSuccess = /(booked|confirmed|complete|completed|success|appointmentid|appointment_id)/.test(text);
  const falseSignal = /(cancelled|canceled|failed|error)/.test(text);
  return hasBooking && hasSuccess && !falseSignal;
}
window.addEventListener("message", function(event) {
  const origin = String(event.origin || "");
  if (!/(leadconnectorhq|msgsndr|gohighlevel)/i.test(origin)) return;
  if (rpLooksLikeBookingSuccess(event.data)) rpRedirectToConfirmation("postmessage");
});
function rpLoadCalendarScript() {
  if (document.getElementById("ghl-calendar-script")) return;
  const script = document.createElement("script");
  script.src = "https://link.msgsndr.com/js/form_embed.js";
  script.type = "text/javascript";
  script.id = "ghl-calendar-script";
  document.body.appendChild(script);
}
function rpMountCalendar() {
  rpCalendarMountedAt = Date.now();
  rpCalendarLoadCount = 0;
  rpLoadCalendarScript();
  const frame = document.getElementById("1VXLRmyHfLdsHa4rTKJ2_book");
  if (!frame) return;
  frame.addEventListener("load", function() {
    rpCalendarLoadCount += 1;
    /* The widget is a single-page app. A later full iframe navigation is its
       hosted confirmation route; move the parent page to our branded confirmation. */
    if (rpCalendarLoadCount > 1 && Date.now() - rpCalendarMountedAt > 7000) {
      setTimeout(function(){ rpRedirectToConfirmation("iframe_navigation"); }, 900);
    }
  });
}

/*
  IMPORTANT:
  This page must NOT fire the customer text automation from the estimate/contact step.
  The website only passes estimate/contact details into the embedded GHL calendar URL.
  Booking confirmation texts/emails should be triggered by the GHL calendar appointment
  booked/confirmed event after the customer selects a calendar time.
*/

/* Boot */
rpRender();
