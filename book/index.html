<style>
:root {
  --red: #9f2027;
  --red-bright: #bd3036;
  --red-dark: #6f1118;
  --ink: #181512;
  --ink-soft: #37312b;
  --muted: #71685f;
  --faint: #9d9287;
  --paper: #f7f1e7;
  --paper-deep: #eadfce;
  --surface: #fffdf9;
  --surface-strong: #ffffff;
  --line: rgba(70, 52, 37, .14);
  --line-strong: rgba(70, 52, 37, .25);
  --gold: #c6a164;
  --gold-soft: #eee0c4;
  --sage: #6f806f;
  --green: #2f7448;
  --header-h: 62px;
  --radius-lg: 26px;
  --radius-md: 18px;
  --shadow-lg: 0 28px 80px rgba(48, 32, 19, .18);
  --shadow-md: 0 14px 34px rgba(48, 32, 19, .10);
  --shadow-sm: 0 7px 18px rgba(48, 32, 19, .07);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 12% 12%, rgba(198,161,100,.24), transparent 30%),
    radial-gradient(circle at 88% 85%, rgba(159,32,39,.14), transparent 34%),
    linear-gradient(135deg, #ece4d7 0%, #ddd1c0 100%);
  line-height: 1.45;
  overflow: hidden;
  position: fixed;
  inset: 0;
  width: 100%;
  font-synthesis-weight: none;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.10'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}
a { text-decoration: none; color: inherit; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid rgba(159,32,39,.24);
  outline-offset: 3px;
}

/* ============ APP SHELL ============ */
.rp-app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 610px;
  margin: 0 auto;
  background: var(--paper);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.rp-app::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(680px 420px at 115% -8%, rgba(198,161,100,.20), transparent 64%),
    radial-gradient(620px 500px at -18% 112%, rgba(159,32,39,.10), transparent 67%);
}
@media (min-width: 670px) {
  .rp-app {
    height: calc(100dvh - 36px);
    margin: 18px auto;
    border: 1px solid rgba(255,255,255,.62);
    border-radius: 34px;
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.65);
  }
}

/* Header */
.rp-head {
  height: var(--header-h);
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  z-index: 20;
  background: rgba(247,241,231,.84);
  border-bottom: 1px solid rgba(70,52,37,.08);
  backdrop-filter: blur(18px) saturate(1.25);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
}
.rp-head-btn {
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.50);
  border: 1px solid rgba(70,52,37,.10);
  border-radius: 14px;
  transition: background .18s, opacity .2s, transform .18s;
}
.rp-head-btn:active { background: var(--surface); transform: scale(.95); }
.rp-head-btn.is-hidden { opacity: 0; pointer-events: none; }
.rp-wordmark { height: 42px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.rp-wordmark img { width: 30px; height: 30px; display: block; border-radius: 9px; box-shadow: 0 5px 12px rgba(159,32,39,.18); }
.rp-wordmark span { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.rp-wordmark strong { font-size: 13px; font-weight: 800; letter-spacing: .075em; color: var(--ink); white-space: nowrap; }
.rp-wordmark strong b { color: var(--red); }
.rp-wordmark small { margin-top: 4px; font-size: 7px; font-weight: 800; letter-spacing: .28em; color: var(--muted); }
.rp-head-text {
  font-size: 12px; font-weight: 800; letter-spacing: .02em;
  color: var(--red);
  padding: 9px 11px;
  border-radius: 12px;
  border: 1px solid rgba(159,32,39,.14);
  background: rgba(255,255,255,.45);
  transition: background .18s, transform .18s;
}
.rp-head-text:active { background: var(--surface); transform: scale(.96); }

/* Progress */
.rp-progress {
  position: relative;
  z-index: 21;
  height: 4px;
  margin: 0;
  background: rgba(70,52,37,.09);
  overflow: hidden;
}
.rp-progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--red-dark), var(--red-bright) 72%, #df765f);
  box-shadow: 0 0 18px rgba(189,48,54,.46);
  transition: width .48s cubic-bezier(.22,.8,.25,1);
}

/* Screens */
.rp-screens { flex: 1; position: relative; overflow: hidden; }
.rp-screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  background:
    radial-gradient(620px 400px at 108% -8%, rgba(198,161,100,.14), transparent 62%),
    radial-gradient(620px 420px at -12% 110%, rgba(159,32,39,.07), transparent 63%),
    linear-gradient(180deg, #fbf7f0 0%, var(--paper) 100%);
}
.rp-screen-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 22px 26px 30px;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  scrollbar-width: thin;
  scrollbar-color: rgba(159,32,39,.22) transparent;
}
.rp-screen-scroll::-webkit-scrollbar { width: 5px; }
.rp-screen-scroll::-webkit-scrollbar-thumb { background: rgba(159,32,39,.22); border-radius: 99px; }
.rp-center { margin-block: auto; width: 100%; max-width: 510px; align-self: center; }
.rp-screen-footer {
  position: relative;
  z-index: 5;
  padding: 12px 26px calc(16px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(247,241,231,1) 76%, rgba(247,241,231,.92) 86%, rgba(247,241,231,0));
}
.rp-screen-footer::before {
  content: "";
  position: absolute;
  left: 26px; right: 26px; top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(70,52,37,.12), transparent);
}

@media (prefers-reduced-motion: no-preference) {
  .rp-screen.enter-forward { animation: rpInFwd .42s cubic-bezier(.22,.86,.28,1) both; }
  .rp-screen.exit-forward  { animation: rpOutFwd .34s cubic-bezier(.4,0,.6,1) both; }
  .rp-screen.enter-back    { animation: rpInBack .42s cubic-bezier(.22,.86,.28,1) both; }
  .rp-screen.exit-back     { animation: rpOutBack .34s cubic-bezier(.4,0,.6,1) both; }
  .rp-screen.enter-forward .rp-center > *,
  .rp-screen.enter-back .rp-center > * { animation: rpRise .46s cubic-bezier(.22,.86,.28,1) both; }
  .rp-screen.enter-forward .rp-center > *:nth-child(2), .rp-screen.enter-back .rp-center > *:nth-child(2) { animation-delay: .035s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(3), .rp-screen.enter-back .rp-center > *:nth-child(3) { animation-delay: .07s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(4), .rp-screen.enter-back .rp-center > *:nth-child(4) { animation-delay: .105s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(5), .rp-screen.enter-back .rp-center > *:nth-child(5) { animation-delay: .14s; }
  .rp-screen.enter-forward .rp-center > *:nth-child(n+6), .rp-screen.enter-back .rp-center > *:nth-child(n+6) { animation-delay: .175s; }
  .rp-primary::after { transition: transform .22s ease; }
  .rp-primary:hover::after { transform: translateX(4px); }
}
@keyframes rpInFwd  { from { transform: translate3d(34px,0,0) scale(.985); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes rpOutFwd { from { transform: none; opacity: 1; } to { transform: translate3d(-18px,0,0) scale(.992); opacity: 0; } }
@keyframes rpInBack { from { transform: translate3d(-34px,0,0) scale(.985); opacity: 0; filter: blur(3px); } to { transform: none; opacity: 1; filter: none; } }
@keyframes rpOutBack{ from { transform: none; opacity: 1; } to { transform: translate3d(18px,0,0) scale(.992); opacity: 0; } }
@keyframes rpRise   { from { transform: translateY(13px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ============ TYPE ============ */
.rp-eyebrow {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  gap: 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .17em;
  text-transform: uppercase;
  color: var(--red);
  margin: 0 0 11px;
}
.rp-eyebrow::before {
  content: "";
  width: 24px;
  height: 1px;
  background: currentColor;
  opacity: .55;
}
.rp-eyebrow.red { color: #f4c9b6; }
h1, h2 {
  font-family: "DM Serif Display", Georgia, "Times New Roman", serif;
  font-weight: 400;
  color: var(--ink);
  text-wrap: balance;
}
h1 { font-size: clamp(31px, 7vw, 42px); line-height: 1.02; letter-spacing: -.028em; margin: 0 0 14px; }
h2 { font-size: clamp(31px, 7.2vw, 39px); line-height: 1.04; letter-spacing: -.025em; margin: 0 0 9px; }
.rp-sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 20px; max-width: 430px; }
.rp-q-gap { height: 12px; }

/* Icons */
.rp-ic { width: 20px; height: 20px; display: block; }
.rp-ic-chip {
  width: 44px; height: 44px; min-width: 44px;
  border-radius: 15px;
  background: linear-gradient(155deg, #c5333d 0%, #a31f28 46%, #7d131b 100%);
  border: 1px solid rgba(255,242,225,.78);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 8px 18px rgba(90,24,27,.18);
  display: flex; align-items: center; justify-content: center;
  color: #fff4e7;
  transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
}
.rp-ic-chip svg {
  stroke: currentColor;
}
.rp-ic-chip .fill-current, .rp-ic-chip [fill="currentColor"] { fill: currentColor; }
.rp-ic-sm { width: 15px; height: 15px; }

/* Full-bleed photo background */
.rp-screen.has-photo-bg { background: #17120f; }
.rp-bg-photo { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.rp-bg-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.012); }
.rp-bg-photo::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background:
    linear-gradient(180deg, rgba(18,13,10,.76) 0%, rgba(18,13,10,.46) 32%, rgba(18,13,10,.14) 55%, rgba(18,13,10,.24) 100%),
    linear-gradient(120deg, rgba(111,17,24,.25), transparent 56%);
}
.rp-bg-photo::after {
  content: "";
  position: absolute; inset: 0;
  z-index: 2;
  background: radial-gradient(circle at 78% 12%, rgba(234,185,123,.22), transparent 34%);
  mix-blend-mode: screen;
}
.rp-screen.has-photo-bg .rp-screen-scroll { position: relative; z-index: 3; padding: 18px 20px 22px; }

.rp-hero-onphoto { padding: 5px 5px 112px; max-width: 500px; }
.rp-hero-onphoto .rp-eyebrow.red { color: #f4d4c5; text-shadow: 0 1px 14px rgba(0,0,0,.34); }
.rp-hero-onphoto h1 { color: #fffaf3; text-shadow: 0 3px 22px rgba(0,0,0,.34); max-width: 480px; }
.rp-hero-onphoto .rp-trust { color: rgba(255,255,255,.94); }
.rp-hero-onphoto .rp-trust span, .rp-hero-onphoto .rp-trust a {
  background: rgba(255,255,255,.13);
  backdrop-filter: blur(14px) saturate(1.3);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  border: 1px solid rgba(255,255,255,.24);
  color: #fff;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.rp-hero-onphoto .rp-trust .rp-ic-sm { color: #fff; }
.rp-hero-onphoto .rp-trust .amber { color: #ffd983; }

.rp-sheet {
  position: relative;
  background: linear-gradient(160deg, rgba(248,240,229,.86), rgba(241,229,214,.74));
  border: 1px solid rgba(255,246,233,.42);
  border-radius: 30px;
  margin: -84px 0 0;
  padding: 18px 16px 16px;
  box-shadow: 0 26px 62px rgba(14,10,7,.26), inset 0 1px 0 rgba(255,255,255,.48);
  backdrop-filter: blur(20px) saturate(1.18);
  -webkit-backdrop-filter: blur(20px) saturate(1.18);
}
.rp-sheet::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: radial-gradient(400px 190px at 95% 0%, rgba(198,161,100,.12), transparent 62%);
}
.rp-sheet-handle {
  width: 38px; height: 4px; border-radius: 999px;
  background: linear-gradient(90deg, var(--red), var(--gold));
  margin: 0 auto 14px;
  opacity: .72;
}
.rp-sheet .rp-start-service-q {
  position: relative;
  font-family: "DM Serif Display", Georgia, serif;
  font-size: 20px; font-weight: 400; letter-spacing: -.01em;
  margin: 0 2px 13px;
}

/* Trust line */
.rp-trust {
  display: flex; flex-wrap: wrap; align-items: center;
  column-gap: 7px; row-gap: 7px;
  margin: 0;
  font-size: 10.5px; font-weight: 700; color: var(--muted);
}
.rp-trust span, .rp-trust a {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 7px 9px;
  border-radius: 999px;
}
.rp-trust .amber { color: #d49a24; }
.rp-trust .rp-ic-sm { color: var(--ink); }

/* ============ OPTION ROWS ============ */
.rp-rows { display: grid; gap: 10px; }
.rp-row {
  width: 100%;
  min-height: 66px;
  display: flex; align-items: center; gap: 13px;
  background: linear-gradient(145deg, rgba(255,255,255,.94), rgba(255,252,247,.84));
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 11px 14px;
  text-align: left;
  box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.95);
  transition: border-color .18s, transform .16s, background .18s, box-shadow .18s;
  position: relative;
  overflow: visible;
}
.rp-row::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,.50) 43%, transparent 62%);
  transform: translateX(-120%);
  transition: transform .58s ease;
}
.rp-row:hover { border-color: rgba(159,32,39,.33); box-shadow: 0 13px 28px rgba(48,32,19,.11); transform: translateY(-1px); }
.rp-row:hover::after { transform: translateX(120%); }
.rp-row:hover .rp-ic-chip { transform: scale(1.04); }
.rp-row:active { transform: scale(.982); border-color: var(--red); }
.rp-row.is-featured {
  border-color: rgba(159,32,39,.42);
  background: linear-gradient(145deg, rgba(252,243,237,.82), rgba(247,229,220,.70));
  box-shadow: 0 13px 30px rgba(127,25,31,.11), inset 3px 0 0 rgba(159,32,39,.88);
}
.rp-row.is-selected {
  border-color: rgba(159,32,39,.92);
  background: linear-gradient(145deg, rgba(250,236,229,.90), rgba(243,220,210,.80));
  box-shadow: 0 12px 28px rgba(159,32,39,.13), inset 3px 0 0 var(--red);
}
.rp-row.is-selected .rp-ic-chip { background: linear-gradient(155deg, #cf3d46 0%, #ae2029 48%, #7d131b 100%); color: #fff6ea; box-shadow: inset 0 1px 0 rgba(255,255,255,.26), 0 10px 18px rgba(90,24,27,.22); }
.rp-row-main { flex: 1; min-width: 0; position: relative; z-index: 1; }
.rp-row-title { font-size: 14.5px; font-weight: 800; line-height: 1.3; letter-spacing: -.01em; display: block; }
.rp-row-desc { font-size: 11.5px; color: var(--muted); line-height: 1.38; display: block; margin-top: 2px; }
.rp-row-val { font-size: 14px; font-weight: 800; color: var(--red-dark); white-space: nowrap; position: relative; z-index: 1; padding: 7px 10px; border-radius: 999px; background: rgba(255,247,238,.72); border: 1px solid rgba(167,126,93,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.55); }
.rp-row-val small { display: block; font-size: 10px; font-weight: 800; color: var(--red); text-align: right; }
.rp-row-chev {
  width: 28px; height: 28px; min-width: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--red);
  border-radius: 999px;
  background: rgba(159,32,39,.07);
  position: relative; z-index: 1;
}
.rp-row .badge {
  position: absolute; top: -9px; right: 13px; z-index: 3;
  background: linear-gradient(135deg, var(--ink), #41382f);
  color: #fff8eb;
  border: 1px solid rgba(198,161,100,.45);
  box-shadow: 0 5px 14px rgba(24,21,18,.18);
  font-size: 8.5px; font-weight: 800; letter-spacing: .12em;
  padding: 4px 9px; border-radius: 999px; text-transform: uppercase;
}
.rp-row-sum { font-size: 11.5px; font-weight: 800; color: var(--red); text-align: right; white-space: nowrap; position: relative; z-index: 1; padding: 7px 10px; border-radius: 999px; background: rgba(255,247,238,.68); border: 1px solid rgba(167,126,93,.16); box-shadow: inset 0 1px 0 rgba(255,255,255,.52); }
.rp-row-sum em { font-style: normal; display: block; color: var(--faint); font-weight: 700; font-size: 9.5px; margin-top: 2px; }
.rp-row.is-selected .rp-row-val, .rp-row.is-selected .rp-row-sum { background: linear-gradient(135deg, var(--red-bright), var(--red-dark)); color: #fff7ee; border-color: rgba(255,243,229,.32); }
.rp-row.is-selected .rp-row-val small, .rp-row.is-selected .rp-row-sum em { color: rgba(255,245,236,.82); }

/* Start screen service rows stay compact */
.rp-sheet .rp-rows { gap: 8px; }
.rp-sheet .rp-row { min-height: 61px; padding: 9px 11px; border-radius: 16px; background: linear-gradient(145deg, rgba(251,244,235,.76), rgba(245,232,217,.66)); border-color: rgba(255,243,229,.22); box-shadow: 0 10px 24px rgba(32,20,13,.11), inset 0 1px 0 rgba(255,255,255,.48);} 
.rp-sheet .rp-ic-chip { width: 39px; height: 39px; min-width: 39px; border-radius: 13px; }
.rp-sheet .rp-row-title { font-size: 13.5px; }
.rp-sheet .rp-row-desc { font-size: 10.5px; }

/* Expanded add-on */
.rp-expand {
  border: 1px solid rgba(159,32,39,.42);
  border-radius: 20px;
  overflow: hidden;

   read-only "includes" screen — that content lives as an expandable
   "What's included" on the estimate screen. */
const rpFlows = {

  deep:        ["bedrooms", "bathrooms", "condition", "addons", "estimate", "lead", "calendar"],
  maintenance: ["bedrooms", "bathrooms", "frequency", "addons", "estimate", "lead", "calendar"],
  carpet:      ["rooms", "carpetdetails", "estimate", "lead", "calendar"],
  airbnb:      ["bedrooms", "bathrooms", "airbnbdetails", "estimate", "lead", "calendar"]
};

function rpCurrentFlow() { return rpFlows[rpState.service] || []; }
function rpStepIndex() { return rpCurrentFlow().indexOf(rpState.step); }

function rpTimeEstimate() {
  if (rpState.service === "moveout" || rpState.service === "movein") return "6–10 hours";
  if (rpState.service === "deep") return "Up to 6 hours";
  if (rpState.service === "maintenance") return "Up to 4 hours";
  if (rpState.service === "airbnb") return "Varies by property size";
  if (rpState.service === "carpet") return "Varies by room count";
  return "";
}
function rpTeamSize() {
  if (rpState.service === "moveout" || rpState.service === "movein") return "2 cleaners";
  if (rpState.service === "deep" || rpState.service === "maintenance") return "1 cleaner";
  if (rpState.service === "airbnb") return "1–2 cleaners";
  if (rpState.service === "carpet") return "1 technician";
  return "";
}

function rpAddonsTotal() {
  let total = 0;
  if (rpState.addonCarpetRooms > 0) total += rpState.addonCarpetRooms * rpAddonCatalog.carpet.bundlePrice;
  if (rpState.junkSize === "half") total += rpAddonCatalog.junk.half;
  if (rpState.junkSize === "full") total += rpAddonCatalog.junk.full;
  if (rpState.windowsTier === "basic") total += rpAddonCatalog.windows.basic;
  if (rpState.windowsTier === "premium") total += rpAddonCatalog.windows.premium;
  if (rpState.garageWash) total += rpAddonCatalog.garage.price;
  if (rpState.laundryLoads > 0) total += rpState.laundryLoads * rpAddonCatalog.laundry.pricePerLoad;
  if (rpState.fridgeAddon) total += rpAddonCatalog.fridge.price;
  if (rpState.yardTier) total += rpAddonCatalog.yard[rpState.yardTier];
  return total;
}

function rpCalculatePrice() {
  if (!rpState.service) return 0;
  if (rpState.service === "airbnb") return 0; // custom quote, no fixed price
  if (rpState.service === "carpet") {
    const rooms = Math.max(2, Number(rpState.carpetRooms || 0)); // 2-room minimum
    return rpState.carpetRooms ? rooms * 75 : 0;
  }
  if (rpState.service === "maintenance") {
    if (!rpState.bedrooms) return 0;
    return rpMaintenancePrice(rpState.bedrooms, rpState.bathrooms) + rpAddonsTotal();
  }
  if (["moveout", "movein", "deep"].includes(rpState.service)) {
    if (!rpState.bedrooms) return 0;
    const base = rpTierPrices[Math.min(Number(rpState.bedrooms), 5)] || rpTierPrices[5];
    return base + rpAddonsTotal();
  }
  return 0;
}

function rpFinalPrice() {
  const subtotal = rpCalculatePrice();
  if (!subtotal) return subtotal;
  if (rpState.service === "airbnb") return subtotal;
  return rpState.militaryDiscount ? Math.round(subtotal * 0.9) : subtotal;
}

function rpPriceLabel() {
  const total = rpFinalPrice();
  if (rpState.service === "airbnb") return "Custom Quote";
  if (!total) return "$0";
  return `$${total}`;
}

/* =========================================================================
   FUNNEL ANALYTICS — every screen is measurable.
   ========================================================================= */
let rpScreenEnteredAt = Date.now();
function rpTrack(event, extra = {}) {
  const payload = Object.assign({
    screen: rpState.step,
    service: rpState.service || "none",
    elapsed_ms: Date.now() - rpScreenEnteredAt,
    funnel: "book_v1"
  }, extra);
  try { if (typeof gtag === "function") gtag("event", event, payload); } catch (e) {}
  try { if (window.clarity) window.clarity("event", event + "_" + payload.screen); } catch (e) {}
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
function rpTotalSteps() {
  return 1 + (rpState.service ? rpCurrentFlow().length : 7);
}
function rpStepNumber() {
  if (rpState.step === "service") return 1;
  return 2 + rpStepIndex();
}
function rpStepLabel() {
  if (rpState.step === "calendar") return "Last step";
  return `Step ${rpStepNumber()} of ${rpTotalSteps()}`;
}
function rpUpdateProgress() {
  const fill = document.getElementById("rpProgressFill");
  const backBtn = document.getElementById("rpBackBtn");
  if (fill) fill.style.width = `${Math.round((rpStepNumber() / rpTotalSteps()) * 100)}%`;
  if (backBtn) backBtn.classList.toggle("is-hidden", rpState.step === "service");
}

function rpGoToStep(name, direction = "forward") {
  if (direction === "forward" && rpState.step !== name) rpTrack("screen_continue", { to_screen: name });
  rpState.step = name;
  rpRender(direction);
}
function rpAdvance() {
  const flow = rpCurrentFlow();
  const idx = rpStepIndex();
  const next = flow[idx + 1];
  if (next) rpGoToStep(next, "forward");
}
function rpBack() {
  if (rpState.step === "service") return;
  rpTrack("screen_back");
  const flow = rpCurrentFlow();
  const idx = rpStepIndex();
  if (idx <= 0) { rpState.service = null; rpState.step = "service"; rpRender("back"); return; }
  rpState.step = flow[idx - 1];
  rpRender("back");
}

/* =========================================================================
   RENDERER with slide transitions
   ========================================================================= */
function rpRender(direction) {
  rpUpdateProgress();
  const host = document.getElementById("rpScreens");
  if (!host) return;

  const def = rpScreenHtml();
  const screen = document.createElement("div");
  screen.className = "rp-screen step-" + rpState.step + (def.bg ? " has-photo-bg" : "");
  screen.innerHTML = `
    ${def.bg || ""}
    <div class="rp-screen-scroll">${def.scroll || ""}</div>
    ${def.footer ? `<div class="rp-screen-footer">${def.footer}</div>` : ""}
  `;

  const old = host.querySelector(".rp-screen:last-child");
  if (old && (direction === "forward" || direction === "back")) {
    old.classList.add(direction === "forward" ? "exit-forward" : "exit-back");
    screen.classList.add(direction === "forward" ? "enter-forward" : "enter-back");
    host.appendChild(screen);
    setTimeout(() => { old.remove(); screen.classList.remove("enter-forward","enter-back"); }, 340);
  } else {
    host.innerHTML = "";
    host.appendChild(screen);
  }

  if (typeof def.onMount === "function") def.onMount();

  rpScreenEnteredAt = Date.now();
  rpTrack("screen_view");
  if (rpState.step === "estimate") rpTrack("estimate_reached", { estimate: rpPriceLabel() });
  if (rpState.step === "calendar") rpTrack("calendar_reached", { estimate: rpPriceLabel() });
}

/* Same-screen refresh without transition or duplicate screen_view. */
function rpRefresh() {
  const host = document.getElementById("rpScreens");
  if (!host) return;
  const def = rpScreenHtml();
  const current = host.querySelector(".rp-screen:last-child");
  if (!current) return;
  const scrollEl = current.querySelector(".rp-screen-scroll");
  const prevScrollTop = scrollEl ? scrollEl.scrollTop : 0;
  current.innerHTML = `
    ${def.bg || ""}
    <div class="rp-screen-scroll">${def.scroll || ""}</div>
    ${def.footer ? `<div class="rp-screen-footer">${def.footer}</div>` : ""}
  `;
  const newScrollEl = current.querySelector(".rp-screen-scroll");
  if (newScrollEl) newScrollEl.scrollTop = prevScrollTop;
}

  const emailLooksValid = email.includes("@") && email.includes(".");
  if (!fullName || !phone || !emailLooksValid || !address1 || !city || !postalCode) {
    errorBox.style.display = "block";
    rpTrack("lead_validation_error");
    return;
  }
  rpState.fullName = fullName; rpState.phone = phone; rpState.email = email; rpState.address1 = address1; rpState.city = city; rpState.state = "OK"; rpState.postalCode = postalCode; rpState.specialInstructions = specialInstructions;

  rpSendEstimateToGoHighLevel({
    booking_status: "Estimate Submitted - Appointment Time Not Selected Yet",
    booking_source: "website_estimator_before_calendar",
    customer_action_needed: "Customer still needs to choose appointment time in embedded calendar",
    should_send_booking_confirmation: "No - wait for GHL calendar appointment booked trigger"
  });

  rpTrack("lead_submitted", { estimate: rpPriceLabel() });

  const button = document.getElementById("rpReserveBtn"); if (button) { button.disabled = true; button.innerText = "Opening calendar..."; }
  rpGoToStep("calendar", "forward");
}

const rpConfirmationPath = "/booking-confirmation.html";
let rpCalendarLoadCount = 0;
let rpCalendarMountedAt = 0;
let rpBookingRedirected = false;
function rpRedirectToConfirmation(reason) {
  if (rpBookingRedirected || rpState.step !== "calendar") return;
  rpBookingRedirected = true;
  rpTrack("booking_completed", { completion_signal: reason || "calendar" });
  window.location.assign(rpConfirmationPath);
}
function rpLooksLikeBookingSuccess(data) {
  let text = "";
  try { text = typeof data === "string" ? data : JSON.stringify(data || {}); } catch (_) {}
  text = text.toLowerCase();
  const hasBooking = /(appointment|booking|calendar)/.test(text);
  const hasSuccess = /(booked|confirmed|complete|completed|success|appointmentid|appointment_id)/.test(text);
  const falseSignal = /(cancelled|canceled|failed|error)/.test(text);
  return hasBooking && hasSuccess && !falseSignal;
}
window.addEventListener("message", function(event) {
  const origin = String(event.origin || "");
  if (!/(leadconnectorhq|msgsndr|gohighlevel)/i.test(origin)) return;
  if (rpLooksLikeBookingSuccess(event.data)) rpRedirectToConfirmation("postmessage");
});
function rpLoadCalendarScript() {
  if (document.getElementById("ghl-calendar-script")) return;
  const script = document.createElement("script");
  script.src = "https://link.msgsndr.com/js/form_embed.js";
  script.type = "text/javascript";
  script.id = "ghl-calendar-script";
  document.body.appendChild(script);
}
function rpMountCalendar() {
  rpCalendarMountedAt = Date.now();
  rpCalendarLoadCount = 0;
  rpLoadCalendarScript();
  const frame = document.getElementById("1VXLRmyHfLdsHa4rTKJ2_book");
  if (!frame) return;
  frame.addEventListener("load", function() {
    rpCalendarLoadCount += 1;
    /* The widget is a single-page app. A later full iframe navigation is its
       hosted confirmation route; move the parent page to our branded confirmation. */
    if (rpCalendarLoadCount > 1 && Date.now() - rpCalendarMountedAt > 7000) {
      setTimeout(function(){ rpRedirectToConfirmation("iframe_navigation"); }, 900);
    }
  });
}

/*
  IMPORTANT:
  This page must NOT fire the customer text automation from the estimate/contact step.
  The website only passes estimate/contact details into the embedded GHL calendar URL.
  Booking confirmation texts/emails should be triggered by the GHL calendar appointment
  booked/confirmed event after the customer selects a calendar time.
*/

/* Boot */
rpRender();
</script>
