<script>
const RP_WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/o4s9L5c0Rd4vqrzAeCY1/webhook-trigger/05947288-6996-4ecc-80aa-42766c3be32b";
const RP_BOOKING_CALENDAR_URL = "https://api.leadconnectorhq.com/widget/booking/1VXLRmyHfLdsHa4rTKJ2";

const state = {
  step: 1,
  service: null,
  bedrooms: 3,
  bathrooms: 2,
  condition: "Average",
  addons: [],
  carpetRooms: 2,
  furnitureItem: "Sofa",
  fullName: "",
  phone: "",
  email: "",
  address1: "",
  city: "Lawton",
  stateField: "OK",
  postalCode: "",
  specialInstructions: "",
  estimateSent: false
};

const services = {
  moveout: { name:"Move-Out Cleaning", key:"moveout", base:199, emoji:"📦", desc:"Factory Reset cleaning for empty homes, apartments, PCS moves, keys, and inspections.", includes:["Kitchen detail","Bathrooms cleaned","Inside oven","Inside refrigerator","Inside microwave","Cabinets/drawers wiped inside","Baseboards","Interior windows","Floors vacuumed and mopped"] },
  movein: { name:"Move-In Cleaning", key:"movein", base:199, emoji:"🔑", desc:"Factory Reset cleaning before furniture, boxes, and daily life move in.", includes:["Kitchen reset","Bathrooms sanitized","Inside appliances","Cabinets/drawers wiped inside","Baseboards","Interior windows","Floors vacuumed and mopped","High-touch surfaces"] },
  deep: { name:"Deep Cleaning", key:"deep", base:249, emoji:"💎", desc:"Detailed cleaning for lived-in homes, first-time cleans, resets, and catch-up jobs.", includes:["Detailed bathrooms","Kitchen detail","Detailed dusting","Baseboards","Floors","High-touch surfaces"] },
  maintenance: { name:"Maintenance Cleaning", key:"maintenance", base:149, emoji:"🏠", desc:"Best for maintained homes that need routine professional cleaning.", includes:["Kitchen wipe-down","Bathrooms","Dusting","Floors","Trash removal","General tidy-up"] },
  carpet: { name:"Carpet Cleaning", key:"carpet", base:75, emoji:"🧼", desc:"Professional steam carpet cleaning by room with hot water extraction.", includes:["Hot water extraction","Pre-spray","Rake/grooming","Basic spot attention","Fresh finish"] },
  upholstery: { name:"Upholstery Cleaning", key:"upholstery", base:100, emoji:"🛋️", desc:"Fabric furniture cleaning for chairs, recliners, sofas, loveseats, and sectionals.", includes:["Fabric pre-spray","Extraction cleaning","Basic spot treatment","Freshened finish"] }
};

const homeAddons = [
  { name:"Exterior windows basic wash", price:100 },
  { name:"Heavy buildup / excessive grime", price:75 },
  { name:"Extra pet hair removal", price:50 },
  { name:"Wall scuff removal", price:35 },
  { name:"Small trash removal", price:60 },
  { name:"Window tracks & sills", price:35 }
];
const carpetAddons = [
  { name:"Pet stain treatment", price:30 },
  { name:"Deodorizer", price:25 },
  { name:"Heavy traffic lane treatment", price:25 },
  { name:"Stair cleaning", price:40 }
];
const upholsteryAddons = [
  { name:"Deodorizer", price:20 },
  { name:"Pet hair removal", price:25 },
  { name:"Stain treatment", price:25 },
  { name:"Fabric protector", price:35 }
];
const upholsteryPrices = {
  "Dining Chair":100,
  "Recliner":125,
  "Loveseat":150,
  "Sofa":175,
  "Sectional up to 5 seats":250,
  "Large sectional":325
};

function escapeHtml(value){ return String(value || "").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function isHomeService(){ return ["moveout","movein","deep","maintenance"].includes(state.service); }
function currentAddons(){ if(state.service === "carpet") return carpetAddons; if(state.service === "upholstery") return upholsteryAddons; return homeAddons; }

function updateProgress(){
  const maxSteps = 4;
  const visualStep = state.step;
  document.getElementById("stepText").innerText = `Step ${visualStep} of ${maxSteps}`;
  document.getElementById("progressFill").style.width = `${(visualStep / maxSteps) * 100}%`;
}

function calculatePrice(){
  if(!state.service) return 0;
  let total = services[state.service].base;
  if(["moveout","movein"].includes(state.service)) {
    const bedroomPrices = {1:199,2:299,3:399,4:499,5:599};
    total = bedroomPrices[state.bedrooms] || 599;
    total += Math.max(0, Number(state.bathrooms || 1) - 2) * 40;
    if(state.condition === "Well maintained") total -= 25;
    if(state.condition === "Heavy buildup") total += 75;
  }
  if(state.service === "deep") {
    total = 249 + Math.max(0, Number(state.bedrooms || 1) - 1) * 45 + Math.max(0, Number(state.bathrooms || 1) - 1) * 30;
    if(state.condition === "Well maintained") total -= 20;
    if(state.condition === "Heavy buildup") total += 75;
  }
  if(state.service === "maintenance") {
    total = 149 + Math.max(0, Number(state.bedrooms || 1) - 1) * 30 + Math.max(0, Number(state.bathrooms || 1) - 1) * 25;
    if(state.condition === "Heavy buildup") total += 60;
  }
  if(state.service === "carpet") total = Math.max(1, Number(state.carpetRooms || 1)) * 75;
  if(state.service === "upholstery") total = upholsteryPrices[state.furnitureItem] || 175;
  state.addons.forEach(addon => total += addon.price);
  return Math.max(total, 75);
}

function selectedAddonsText(){ return state.addons.length ? state.addons.map(a => a.name).join(", ") : "None"; }
function includedBox(){
  const s = services[state.service];
  return `<div class="included"><div class="included-title">Included with ${s.name}</div><div class="checklist">${s.includes.map(item => `<div>✓ ${item}</div>`).join("")}</div></div>`;
}
function estimateSummary(){
  const s = services[state.service];
  const total = calculatePrice();
  let details = "";
  if(isHomeService()) details = `${state.bedrooms} bed / ${state.bathrooms} bath · ${state.condition}`;
  if(state.service === "carpet") details = `${state.carpetRooms} carpeted room${state.carpetRooms === 1 ? "" : "s"}`;
  if(state.service === "upholstery") details = state.furnitureItem;
  return `<div class="estimate-summary"><div class="total"><span>Estimated Total</span><span>$${total}</span></div><div class="mini-row"><span>Service</span><strong>${s.name}</strong></div><div class="mini-row"><span>Details</span><strong>${details}</strong></div><div class="mini-row"><span>Add-ons</span><strong>${selectedAddonsText()}</strong></div></div>`;
}
function addonsHtml(){
  return currentAddons().map(addon => {
    const checked = state.addons.some(a => a.name === addon.name) ? "checked" : "";
    return `<label class="addon"><input type="checkbox" ${checked} onchange="toggleAddon('${addon.name.replace(/'/g,"\\'")}', ${addon.price}, this.checked)"><span>${addon.name}</span><span class="price">+$${addon.price}</span></label>`;
  }).join("");
}

function render(){
  updateProgress();
  const app = document.getElementById("app");
  if(state.step === 1){
    app.innerHTML = `<h1>Get Your Instant Estimate</h1><p class="sub">Choose your service, answer one question at a time, save your contact and address, then choose an appointment online.</p><div class="grid">${Object.entries(services).map(([key,s]) => `<button type="button" class="option ${state.service === key ? "is-selected" : ""}" onclick="selectService('${key}')"><strong>${s.emoji} ${s.name}</strong><span>${s.desc}</span></button>`).join("")}</div><p class="fineprint">Serving Lawton, Fort Sill, Cache, Elgin, Medicine Park, Fletcher, and nearby Southwest Oklahoma areas.</p>`;
  }
  if(state.step === 2){
    const s = services[state.service];
    app.innerHTML = `<h2>${s.emoji} ${s.name}</h2><p class="sub">${s.desc}</p>${includedBox()}${serviceQuestions()}<h3>Optional add-ons</h3>${addonsHtml()}${estimateSummary()}<div class="notice">This is a starting estimate. Final pricing can change for severe buildup, heavy pet hair, unusual conditions, limited access, long travel, stairs, or specialty requests.</div><div class="btns"><button type="button" class="secondary" onclick="backToServices()">Back</button><button type="button" class="primary" onclick="goToLeadCapture()">Next: Contact & Address</button><a class="sms-btn" href="sms:5802150915">Text Us Instead</a></div>`;
  }
  if(state.step === 3){
    app.innerHTML = `<span class="estimate-badge">Estimated Price: $${calculatePrice()}</span><h2>Contact & Job Details</h2><p class="sub">These details are required before the appointment calendar opens so the team has your estimate, address, and notes attached.</p>${estimateSummary()}<div class="lead-form"><div class="lead-field"><label for="fullName">Full Name *</label><input id="fullName" type="text" value="${escapeHtml(state.fullName)}" placeholder="John Smith" autocomplete="name"></div><div class="lead-field"><label for="phone">Phone *</label><input id="phone" type="tel" value="${escapeHtml(state.phone)}" placeholder="(580) 555-1234" autocomplete="tel"></div><div class="lead-field"><label for="email">Email *</label><input id="email" type="email" value="${escapeHtml(state.email)}" placeholder="john@email.com" autocomplete="email"></div><div class="lead-field"><label for="address1">Street Address / Unit *</label><input id="address1" type="text" value="${escapeHtml(state.address1)}" placeholder="123 Main St Apt 4B" autocomplete="address-line1"></div><div class="field-grid"><div class="lead-field"><label for="city">City *</label><input id="city" type="text" value="${escapeHtml(state.city)}" placeholder="Lawton" autocomplete="address-level2"></div><div class="lead-field"><label for="stateField">State *</label><input id="stateField" type="text" value="${escapeHtml(state.stateField)}" placeholder="OK" maxlength="2" autocomplete="address-level1"></div></div><div class="lead-field"><label for="postalCode">ZIP Code *</label><input id="postalCode" type="text" value="${escapeHtml(state.postalCode)}" placeholder="73501" autocomplete="postal-code"></div><div class="lead-field"><label for="specialInstructions">Access Notes / Deadline / Special Instructions</label><textarea id="specialInstructions" placeholder="Gate code, pets, carpet notes, inspection date, parking, unit access, or anything Christa should know">${escapeHtml(state.specialInstructions)}</textarea></div></div><div id="formError" class="error">Please enter your name, phone, valid email, street address/unit, city, state, and ZIP before booking.</div><div class="btns"><button type="button" class="secondary" onclick="backToEstimate()">Back To Estimate</button><button id="reserveBtn" type="button" class="primary" onclick="submitLeadAndShowCalendar()">Save Estimate & Choose Appointment</button></div><p class="fineprint">By submitting, you agree Red Prairie Cleaning may contact you about your estimate and appointment. This saves an estimate only; the appointment is not booked until the calendar is completed.</p>`;
  }
  if(state.step === 4){
    app.innerHTML = `<span class="estimate-badge">Estimated Price: $${calculatePrice()}</span><h2>Choose Your Appointment</h2><p class="sub">Select your preferred date and time below. Your appointment confirmation should come from the GHL calendar booking workflow, not from the estimate form.</p><div class="notice">Your estimate and job details have been saved. Complete the calendar step to reserve your appointment.</div><div class="booking-widget"><iframe src="${buildCalendarUrl()}" scrolling="no" id="1VXLRmyHfLdsHa4rTKJ2_book_page" title="Red Prairie Cleaning Booking Calendar"></iframe></div><div class="btns"><button type="button" class="secondary" onclick="backToLeadCapture()">Back</button></div>`;
    loadCalendarScript();
  }
}

function serviceQuestions(){
  if(isHomeService()){
    return `<h3>How many bedrooms?</h3><div class="pill-grid">${[1,2,3,4,5].map(n => `<button type="button" class="pill ${state.bedrooms === n ? "is-selected" : ""}" onclick="setBedrooms(${n})">${n}${n === 5 ? "+" : ""}</button>`).join("")}</div><h3>How many bathrooms?</h3><div class="pill-grid">${[1,2,3,4,5].map(n => `<button type="button" class="pill ${state.bathrooms === n ? "is-selected" : ""}" onclick="setBathrooms(${n})">${n}${n === 5 ? "+" : ""}</button>`).join("")}</div><h3>Condition</h3><div class="grid">${["Well maintained","Average","Heavy buildup"].map(c => `<button type="button" class="option ${state.condition === c ? "is-selected" : ""}" onclick="setCondition('${c}')"><strong>${c}</strong><span>${c === "Well maintained" ? "Mostly maintained and ready for professional detail." : c === "Average" ? "Normal condition with typical dust, grime, and use." : "Heavy grime, pet hair, buildup, or neglected areas."}</span></button>`).join("")}</div>`;
  }
  if(state.service === "carpet"){
    return `<h3>How many carpeted rooms?</h3><div class="pill-grid">${[1,2,3,4,5].map(n => `<button type="button" class="pill ${state.carpetRooms === n ? "is-selected" : ""}" onclick="setCarpetRooms(${n})">${n}${n === 5 ? "+" : ""}</button>`).join("")}</div>`;
  }
  if(state.service === "upholstery"){
    return `<h3>What furniture item?</h3><div class="grid">${Object.keys(upholsteryPrices).map(item => `<button type="button" class="option ${state.furnitureItem === item ? "is-selected" : ""}" onclick="setFurnitureItem('${item.replace(/'/g,"\\'")}')"><strong>${item}</strong><span>Starting at $${upholsteryPrices[item]}</span></button>`).join("")}</div>`;
  }
  return "";
}

function selectService(service){ state.service = service; state.addons = []; state.condition = "Average"; state.estimateSent = false; state.step = 2; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function setBedrooms(n){ state.bedrooms = n; state.estimateSent = false; render(); }
function setBathrooms(n){ state.bathrooms = n; state.estimateSent = false; render(); }
function setCondition(condition){ state.condition = condition; state.estimateSent = false; render(); }
function setCarpetRooms(n){ state.carpetRooms = n; state.estimateSent = false; render(); }
function setFurnitureItem(item){ state.furnitureItem = item; state.estimateSent = false; render(); }
function toggleAddon(name, price, checked){ if(checked){ if(!state.addons.some(a => a.name === name)) state.addons.push({name, price}); } else { state.addons = state.addons.filter(a => a.name !== name); } state.estimateSent = false; render(); }
function backToServices(){ state.step = 1; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function goToLeadCapture(){ state.step = 3; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function backToEstimate(){ state.step = 2; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function backToLeadCapture(){ state.step = 3; render(); window.scrollTo({top:0, behavior:"smooth"}); }

function readLeadFields(){
  state.fullName = document.getElementById("fullName").value.trim();
  state.phone = document.getElementById("phone").value.trim();
  state.email = document.getElementById("email").value.trim();
  state.address1 = document.getElementById("address1").value.trim();
  state.city = document.getElementById("city").value.trim();
  state.stateField = document.getElementById("stateField").value.trim().toUpperCase();
  state.postalCode = document.getElementById("postalCode").value.trim();
  state.specialInstructions = document.getElementById("specialInstructions").value.trim();
}
function validateLead(){
  const emailLooksValid = state.email.includes("@") && state.email.includes(".");
  return state.fullName && state.phone && emailLooksValid && state.address1 && state.city && state.stateField && state.postalCode;
}
function getEstimatePayload(){
  const total = calculatePrice();
  const serviceName = services[state.service]?.name || "Not selected";
  const addonNames = state.addons.map(a => a.name);
  const fullAddress = [state.address1, [state.city, state.stateField, state.postalCode].filter(Boolean).join(" ")].filter(Boolean).join(", ");
  const specialInstructions = state.specialInstructions || "None";
  let sizeDetails = "N/A";
  if(isHomeService()) sizeDetails = `${state.bedrooms} bed / ${state.bathrooms} bath`;
  if(state.service === "carpet") sizeDetails = `${state.carpetRooms} carpeted room${state.carpetRooms === 1 ? "" : "s"}`;
  if(state.service === "upholstery") sizeDetails = state.furnitureItem;
  const jobDetails = [
    `Service: ${serviceName}`,
    `Estimate: $${total}`,
    `Details: ${sizeDetails}`,
    `Condition: ${isHomeService() ? state.condition : "N/A"}`,
    `Add-ons: ${addonNames.length ? addonNames.join(", ") : "None"}`,
    `Address: ${fullAddress || "N/A"}`,
    `Special instructions: ${specialInstructions}`,
    `Booking status: Estimate Submitted - Appointment Time Not Selected Yet`,
    `Do not send booking confirmation from this webhook`
  ].join(" | ");
  return {
    source: "Book Online Universal Booking Page",
    business: "Red Prairie Cleaning",
    full_name: state.fullName,
    phone: state.phone,
    email: state.email,
    address1: state.address1,
    street_address: state.address1,
    address: state.address1,
    city: state.city,
    state: state.stateField,
    postal_code: state.postalCode,
    zip: state.postalCode,
    full_address: fullAddress,
    service: serviceName,
    service_type: serviceName,
    service_key: state.service,
    city_page: "Book Online",
    estimated_price: `$${total}`,
    estimated_price_number: total,
    price_estimate: `$${total}`,
    bedrooms: isHomeService() ? String(state.bedrooms) : "N/A",
    bathrooms: isHomeService() ? String(state.bathrooms) : "N/A",
    carpet_rooms: state.service === "carpet" ? String(state.carpetRooms) : "N/A",
    furniture_item: state.service === "upholstery" ? state.furnitureItem : "N/A",
    condition: isHomeService() ? state.condition : "N/A",
    addons: addonNames.length ? addonNames.join(", ") : "None",
    addon_count: addonNames.length,
    special_instructions: specialInstructions,
    customer_notes: specialInstructions,
    estimate_notes: jobDetails,
    job_details: jobDetails,
    cleaner_notes: jobDetails,
    booking_status: "Estimate Submitted - Appointment Time Not Selected Yet",
    appointment_status: "Not booked yet",
    should_send_booking_confirmation: "No - wait for GHL calendar appointment booked trigger",
    submitted_at: new Date().toISOString(),
    page_url: window.location.href
  };
}

function buildCalendarUrl(){
  const payload = getEstimatePayload();
  const url = new URL(RP_BOOKING_CALENDAR_URL);
  [
    "full_name","phone","email","address1","street_address","address","city","state","postal_code","zip",
    "full_address","service","service_type","service_key","estimated_price","estimated_price_number",
    "price_estimate","bedrooms","bathrooms","condition","addons","addon_count","carpet_rooms","furniture_item",
    "special_instructions","customer_notes","estimate_notes","job_details","cleaner_notes","source","business","page_url"
  ].forEach(key => {
    if (payload[key] !== undefined && payload[key] !== null) url.searchParams.set(key, payload[key]);
  });
  return url.toString();
}

function sendEstimateToGoHighLevel(){
  const payload = getEstimatePayload();
  const url = new URL(RP_WEBHOOK_URL);
  Object.keys(payload).forEach(key => url.searchParams.append(key, payload[key]));
  const img = new Image();
  img.src = url.toString();
  state.estimateSent = true;
  return true;
}
function submitLeadAndShowCalendar(){
  readLeadFields();
  const errorBox = document.getElementById("formError");
  if(!validateLead()){ errorBox.style.display = "block"; return; }
  const button = document.getElementById("reserveBtn");
  if(button){ button.disabled = true; button.innerText = "Saving estimate..."; }
  sendEstimateToGoHighLevel();
  state.step = 4;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function loadCalendarScript(){
  if(document.getElementById("ghl-calendar-script")) return;
  const script = document.createElement("script");
  script.src = "https://link.msgsndr.com/js/form_embed.js";
  script.type = "text/javascript";
  script.id = "ghl-calendar-script";
  document.body.appendChild(script);
}
render();
</script>
