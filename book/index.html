<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Online | Red Prairie Cleaning</title>

  <style>
    :root {
      --bg: #0d0d0d;
      --card: #171717;
      --card2: #202020;
      --border: #333;
      --red: #c62828;
      --red2: #ff4545;
      --text: #ffffff;
      --muted: #bdbdbd;
      --soft: #2a1515;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,.85)),
        radial-gradient(circle at top, #3a1111, #0d0d0d 55%);
      color: var(--text);
      min-height: 100vh;
    }

    .topbar {
      max-width: 1000px;
      margin: auto;
      padding: 22px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: .5px;
    }

    .phone {
      color: white;
      text-decoration: none;
      border: 1px solid #555;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      white-space: nowrap;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(23,23,23,.96);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
      gap: 12px;
    }

    .progress {
      width: 100%;
      height: 10px;
      background: #292929;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 14%;
      background: linear-gradient(90deg, var(--red), var(--red2));
      transition: width .25s ease;
    }

    h1, h2, h3 { margin-top: 0; }

    h1 {
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .sub {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 22px 0;
    }

    @media (max-width: 650px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 22px;
      }
    }

    .option {
      background: var(--card2);
      border: 1px solid #404040;
      color: white;
      padding: 18px;
      border-radius: 18px;
      cursor: pointer;
      text-align: left;
      font-size: 16px;
      transition: .18s ease;
      min-height: 92px;
    }

    .option:hover {
      border-color: var(--red2);
      background: var(--soft);
      transform: translateY(-2px);
    }

    .option strong {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .option span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    @media (max-width: 650px) {
      .pill-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .pill {
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .pill:hover {
      border-color: var(--red2);
      background: var(--soft);
    }

    .included {
      background: #121212;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 18px;
      margin: 20px 0;
    }

    .included-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .checklist {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      color: #ddd;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .checklist {
        grid-template-columns: 1fr;
      }
    }

    label.addon {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      background: #202020;
      border: 1px solid #383838;
      padding: 15px;
      border-radius: 14px;
      margin: 10px 0;
      cursor: pointer;
    }

    label.addon:hover {
      border-color: var(--red2);
      background: #251717;
    }

    label.addon input {
      transform: scale(1.2);
      margin-right: 10px;
    }

    .addon-left {
      display: flex;
      align-items: center;
    }

    .price {
      color: var(--red2);
      font-weight: bold;
      white-space: nowrap;
    }

    .invoice {
      background: #111;
      border: 1px solid #343434;
      border-radius: 18px;
      padding: 20px;
      margin-top: 20px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #292929;
      padding: 12px 0;
      color: #ddd;
    }

    .row strong { color: white; }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
      font-weight: 900;
      color: var(--red2);
      padding-top: 18px;
    }

    .notice {
      background: #241818;
      border: 1px solid #5a2525;
      padding: 14px;
      border-radius: 12px;
      color: #ddd;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.45;
    }

    .btns {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    button.primary,
    button.secondary {
      border-radius: 999px;
      font-size: 16px;
      padding: 15px 22px;
      cursor: pointer;
    }

    button.primary {
      background: var(--red);
      color: white;
      border: none;
      font-weight: 900;
    }

    button.primary:hover { background: #e63333; }

    button.secondary {
      background: transparent;
      color: white;
      border: 1px solid #555;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .fineprint {
      color: #888;
      font-size: 13px;
      margin-top: 18px;
      line-height: 1.45;
    }

    .booking-widget {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      margin-top: 22px;
      border: 1px solid #333;
    }

    .booking-widget iframe {
      display: block;
      min-height: 760px;
    }

    .estimate-badge {
      display: inline-block;
      background: #241818;
      border: 1px solid #5a2525;
      color: var(--red2);
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: 900;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">RED PRAIRIE CLEANING</div>
    <a class="phone" href="tel:5802150915">Call/Text: (580) 215-0915</a>
  </div>

  <main class="wrap">
    <div class="card">
      <div class="progress-label">
        <span id="stepText">Step 1 of 7</span>
        <span>Instant Price & Booking</span>
      </div>

      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div id="app"></div>
    </div>
  </main>

<script>
const WEBHOOK_URL = "https://services.leadconnectorhq.com/hooks/o4s9L5c0Rd4vqrzAeCY1/webhook-trigger/86d95f18-b0fa-4520-87a7-629a3f777695";

const state = {
  step: 1,
  service: null,
  bedrooms: null,
  bathrooms: null,
  condition: "Average",
  addons: [],
  estimateSent: false
};

const services = {
  standard: {
    name: "Standard House Cleaning",
    emoji: "🏠",
    base: 149,
    desc: "Best for recurring or maintained homes.",
    includes: ["Kitchen wipe-down", "Bathrooms", "Dusting", "Floors", "Trash removal", "General tidy-up"]
  },
  deep: {
    name: "Deep Cleaning",
    emoji: "💎",
    base: 249,
    desc: "Best for first-time cleans, seasonal resets, and detailed work.",
    includes: ["Baseboards included", "Detailed bathrooms", "Kitchen detail", "Detailed dusting", "Floors", "High-touch surfaces"]
  },
  carpet: {
    name: "Carpet Cleaning",
    emoji: "🧼",
    base: 149,
    desc: "Professional carpet cleaning with commercial equipment.",
    includes: ["Hot-water extraction", "Pre-spray", "Rake/grooming", "Basic spot attention", "Fresh finish"]
  },
  moveout: {
    name: "Move-Out Cleaning",
    emoji: "📦",
    base: 399,
    desc: "For empty homes, apartments, PCS moves, and deposit recovery.",
    includes: ["Kitchen", "Bathrooms", "Cabinets exterior", "Baseboards", "Floors", "Move-out detail"]
  },
  upholstery: {
    name: "Upholstery Cleaning",
    emoji: "🛋️",
    base: 99,
    desc: "For couches, chairs, sectionals, and fabric furniture.",
    includes: ["Fabric pre-spray", "Extraction cleaning", "Basic spot treatment", "Freshened finish"]
  }
};

const addonsByService = {
  standard: [
    ["Inside oven", 25],
    ["Inside refrigerator", 25],
    ["Inside microwave", 10],
    ["Interior windows", 40],
    ["Window tracks & sills", 25],
    ["Baseboard detailing", 35],
    ["Pet hair removal", 35],
    ["Change bed sheets", 15],
    ["Laundry folding", 20],
    ["Inside empty cabinets", 40]
  ],
  deep: [
    ["Inside oven", 25],
    ["Inside refrigerator", 25],
    ["Inside microwave", 10],
    ["Interior windows", 40],
    ["Window tracks & sills", 25],
    ["Inside empty cabinets", 40],
    ["Pet hair removal", 35],
    ["Odor treatment", 40],
    ["Change bed sheets", 15],
    ["Laundry folding", 20]
  ],
  carpet: [
    ["Pet stain treatment", 30],
    ["Deodorizer", 25],
    ["Heavy traffic lane treatment", 25],
    ["Carpet protector", 50],
    ["Area rug cleaning", 35],
    ["Stair cleaning", 40]
  ],
  moveout: [
    ["Appliance deep clean package", 40],
    ["Interior windows", 40],
    ["Window tracks & sills", 25],
    ["Garage sweep-out", 50],
    ["Wall scuff removal", 30],
    ["Small trash removal", 50],
    ["Inside empty cabinets/drawers", 50]
  ],
  upholstery: [
    ["Deodorizer", 20],
    ["Pet hair removal", 25],
    ["Stain treatment", 25],
    ["Fabric protector", 35],
    ["Extra large sectional", 50]
  ]
};

function updateProgress() {
  const maxSteps = 7;
  document.getElementById("stepText").innerText = `Step ${state.step} of ${maxSteps}`;
  document.getElementById("progressFill").style.width = `${(state.step / maxSteps) * 100}%`;
}

function calculatePrice() {
  let total = services[state.service]?.base || 0;

  if (["standard", "deep", "moveout"].includes(state.service)) {
    total += (Number(state.bedrooms) - 1) * 25;
    total += (Number(state.bathrooms) - 1) * 30;

    if (state.condition === "Heavy buildup") total += 50;
    if (state.condition === "Well maintained") total -= 20;
  }

  if (state.service === "carpet") {
    total += (Number(state.bedrooms) - 1) * 35;
  }

  if (state.service === "upholstery") {
    total += (Number(state.bedrooms) - 1) * 40;
  }

  state.addons.forEach(addon => total += addon.price);

  return Math.max(total, 99);
}

function includedBox(serviceKey) {
  const s = services[serviceKey];

  return `
    <div class="included">
      <div class="included-title">Included with ${s.name}</div>
      <div class="checklist">
        ${s.includes.map(item => `<div>✓ ${item}</div>`).join("")}
      </div>
    </div>
  `;
}

function getEstimatePayload() {
  const total = calculatePrice();
  const serviceName = services[state.service]?.name || "Not selected";
  const addonNames = state.addons.map(a => a.name);

  return {
    source: "Red Prairie Website Calculator",
    business: "Red Prairie Cleaning",
    service: serviceName,
    service_key: state.service,
    estimated_price: `$${total}`,
    estimated_price_number: total,
    bedrooms_rooms_items: state.bedrooms ? String(state.bedrooms) : "N/A",
    bathrooms: state.bathrooms ? String(state.bathrooms) : "N/A",
    condition: ["standard", "deep", "moveout"].includes(state.service) ? state.condition : "N/A",
    addons: addonNames.length ? addonNames.join(", ") : "None",
    addon_count: addonNames.length,
    submitted_at: new Date().toISOString(),
    page_url: window.location.href
  };
}

async function sendEstimateToGoHighLevel() {
  const payload = getEstimatePayload();

  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    state.estimateSent = true;
    return true;
  } catch (error) {
    console.error("Webhook failed:", error);
    return false;
  }
}

function render() {
  updateProgress();
  const app = document.getElementById("app");

  if (state.step === 1) {
    app.innerHTML = `
      <h1>Get Your Instant Price</h1>
      <p class="sub">Choose your cleaning service, see your estimate, then reserve your appointment with Red Prairie Cleaning.</p>

      <div class="grid">
        ${Object.entries(services).map(([key, s]) => `
          <button class="option" onclick="selectService('${key}')">
            <strong>${s.emoji} ${s.name}</strong>
            <span>${s.desc}</span>
          </button>
        `).join("")}
      </div>

      <p class="fineprint">Serving Lawton, Fort Sill, Cache, Elgin, Medicine Park, and nearby Southwest Oklahoma areas.</p>
    `;
  }

  if (state.step === 2) {
    const wording = ["carpet", "upholstery"].includes(state.service)
      ? "How many rooms/items?"
      : "How many bedrooms?";

    app.innerHTML = `
      <h2>${services[state.service].emoji} ${services[state.service].name}</h2>
      <p class="sub">${services[state.service].desc}</p>

      ${includedBox(state.service)}

      <h3>${wording}</h3>

      <div class="pill-grid">
        ${[1,2,3,4,5].map(n => `
          <button class="pill" onclick="selectBedrooms(${n})">${n}${n === 5 ? "+" : ""}</button>
        `).join("")}
      </div>

      <div class="btns">
        <button class="secondary" onclick="back()">Back</button>
      </div>
    `;
  }

  if (state.step === 3) {
    app.innerHTML = `
      <h2>Bathrooms</h2>
      <p class="sub">How many bathrooms should we account for?</p>

      <div class="pill-grid">
        ${[1,2,3,4].map(n => `
          <button class="pill" onclick="selectBathrooms(${n})">${n}${n === 4 ? "+" : ""}</button>
        `).join("")}
      </div>

      <div class="btns">
        <button class="secondary" onclick="back()">Back</button>
      </div>
    `;
  }

  if (state.step === 4) {
    app.innerHTML = `
      <h2>Home Condition</h2>
      <p class="sub">This helps price the job fairly and prevents surprises.</p>

      <div class="grid">
        <button class="option" onclick="selectCondition('Well maintained')">
          <strong>Well maintained</strong>
          <span>Already kept up, just needs professional attention.</span>
        </button>

        <button class="option" onclick="selectCondition('Average')">
          <strong>Average</strong>
          <span>Normal lived-in home. This is the default.</span>
        </button>

        <button class="option" onclick="selectCondition('Heavy buildup')">
          <strong>Heavy buildup</strong>
          <span>Extra grime, heavy dust, neglected areas, or extra time needed.</span>
        </button>
      </div>

      <div class="btns">
        <button class="secondary" onclick="back()">Back</button>
      </div>
    `;
  }

  if (state.step === 5) {
    const addons = addonsByService[state.service] || [];

    app.innerHTML = `
      <h2>✨ Make It Shine Even More</h2>
      <p class="sub">Optional upgrades while we're already there.</p>

      ${addons.map(([name, price]) => `
        <label class="addon">
          <span class="addon-left">
            <input type="checkbox" onchange="toggleAddon('${name}', ${price}, this.checked)">
            ${name}
          </span>
          <span class="price">+$${price}</span>
        </label>
      `).join("")}

      <div class="btns">
        <button class="secondary" onclick="back()">Back</button>
        <button class="primary" onclick="next()">See My Price</button>
      </div>
    `;
  }

  if (state.step === 6) {
    const total = calculatePrice();

    app.innerHTML = `
      <h2>Your Instant Estimate</h2>
      <p class="sub">Here is your estimated price based on your selections.</p>

      <div class="invoice">
        <div class="row"><span>Service</span><strong>${services[state.service].name}</strong></div>
        <div class="row"><span>Base price</span><strong>$${services[state.service].base}</strong></div>

        ${state.bedrooms ? `<div class="row"><span>${["carpet", "upholstery"].includes(state.service) ? "Rooms/items" : "Bedrooms"}</span><strong>${state.bedrooms}${state.bedrooms === 5 ? "+" : ""}</strong></div>` : ""}

        ${state.bathrooms ? `<div class="row"><span>Bathrooms</span><strong>${state.bathrooms}${state.bathrooms === 4 ? "+" : ""}</strong></div>` : ""}

        ${["standard", "deep", "moveout"].includes(state.service) ? `<div class="row"><span>Condition</span><strong>${state.condition}</strong></div>` : ""}

        ${state.addons.map(a => `
          <div class="row"><span>${a.name}</span><strong>+$${a.price}</strong></div>
        `).join("")}

        <div class="total">
          <span>Total</span>
          <span>$${total}</span>
        </div>
      </div>

      <div class="notice">
        This is an instant estimate. Final price may be adjusted if the home is significantly larger, heavily soiled, not empty for move-outs, or outside normal service conditions.
      </div>

      <div class="btns">
        <button class="secondary" onclick="back()">Edit</button>
        <button id="reserveBtn" class="primary" onclick="reserveCleaning()">Reserve My Cleaning →</button>
      </div>

      <p class="fineprint">A $50 reservation deposit is collected during booking and applied toward your final invoice.</p>
    `;
  }

  if (state.step === 7) {
    const total = calculatePrice();

    app.innerHTML = `
      <span class="estimate-badge">Estimated Price: $${total}</span>

      <h2>Reserve Your Cleaning</h2>

      <p class="sub">
        Choose your preferred date and time below. A $50 reservation deposit secures your appointment and is applied toward your final invoice.
      </p>

      <div class="notice">
        Your estimate has been submitted to Red Prairie Cleaning. During booking, add your address, pets, gate code, stains, parking notes, or any special requests.
      </div>

      <div class="booking-widget">
        <iframe
          src="https://api.leadconnectorhq.com/widget/booking/1VXLRmyHfLdsHa4rTKJ2"
          style="width:100%; border:none; overflow:hidden;"
          scrolling="no"
          id="1VXLRmyHfLdsHa4rTKJ2_1781361516868">
        </iframe>
      </div>

      <div class="btns">
        <button class="secondary" onclick="backToEstimate()">Back to Estimate</button>
      </div>
    `;

    loadCalendarScript();
  }
}

function selectService(service) {
  state.service = service;
  state.addons = [];
  state.bedrooms = null;
  state.bathrooms = null;
  state.condition = "Average";
  state.estimateSent = false;
  state.step = 2;
  render();
}

function selectBedrooms(n) {
  state.bedrooms = n;

  if (["carpet", "upholstery"].includes(state.service)) {
    state.step = 5;
  } else {
    state.step = 3;
  }

  render();
}

function selectBathrooms(n) {
  state.bathrooms = n;
  state.step = 4;
  render();
}

function selectCondition(condition) {
  state.condition = condition;
  state.step = 5;
  render();
}

function toggleAddon(name, price, checked) {
  if (checked) {
    state.addons.push({ name, price });
  } else {
    state.addons = state.addons.filter(a => a.name !== name);
  }

  state.estimateSent = false;
}

function next() {
  state.step++;
  render();
}

function back() {
  if (state.step > 1) {
    if (state.step === 5 && ["carpet", "upholstery"].includes(state.service)) {
      state.step = 2;
    } else {
      state.step--;
    }
    render();
  }
}

async function reserveCleaning() {
  const button = document.getElementById("reserveBtn");

  if (button) {
    button.disabled = true;
    button.innerText = "Saving estimate...";
  }

  await sendEstimateToGoHighLevel();

  state.step = 7;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function backToEstimate() {
  state.step = 6;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function loadCalendarScript() {
  if (document.getElementById("ghl-calendar-script")) return;

  const script = document.createElement("script");
  script.src = "https://link.msgsndr.com/js/form_embed.js";
  script.type = "text/javascript";
  script.id = "ghl-calendar-script";
  document.body.appendChild(script);
}

render();
</script>

</body>
</html>
